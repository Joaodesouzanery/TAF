<style>
:root{

}

  --ok:#4cc582; --ok-bg:#1b3d2b; --warn:#e7b04a; --warn-bg:#40341a; --bad:#ef6a5f; --bad-bg:#46231f;
  --info:#7c9cf0; --info-bg:#232f55; --ok-ink:#4cc582; --warn-ink:#e7b04a; --bad-ink:#ef6a5f; --info-ink:#7c9cf0; --tick-off:#44454c; --btn:#f2f2f4; --btn-ink:#111113; --sh:none}}
:root[data-theme="dark"]{
  --bg:#1c1d21; --panel:#25262b; --panel-2:#2c2d33; --line:#3a3b42; --ink:#f2f2f4; --ink-2:#b8b8c0; --ink-3:#9696a0;
  --ok:#4cc582; --ok-bg:#1b3d2b; --warn:#e7b04a; --warn-bg:#40341a; --bad:#ef6a5f; --bad-bg:#46231f;
  --info:#7c9cf0; --info-bg:#232f55; --ok-ink:#4cc582; --warn-ink:#e7b04a; --bad-ink:#ef6a5f; --info-ink:#7c9cf0; --tick-off:#44454c; --btn:#f2f2f4; --btn-ink:#111113; --sh:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;padding:16px;gap:16px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:16px;height:calc(100vh - 32px);box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.obra-sel{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.obra-sel .av{width:32px;height:32px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:600}

.nav .badge{margin-left:auto}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{font:500 10.5px var(--mono);padding:2px 7px;border-radius:999px;background:var(--panel-2);color:var(--ink-3)}

.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}

h1{font-size:30px;font-weight:500;letter-spacing:-.02em;margin:26px 0 6px}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:12px}

.row:first-child{border-top:0}

.sq{display:flex;flex-wrap:wrap;gap:2.5px}.sq i{width:8px;height:8px;border-radius:2px;background:var(--tick-off)}

.sub{color:var(--ink-3);font-size:12.5px;margin:2px 0 4px}
.panel-t{font-weight:500;font-size:15px;margin:2px 4px}

.drawer{position:fixed;top:16px;right:16px;bottom:16px;width:380px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.18);transform:translateX(120%);transition:transform .22s ease;z-index:20;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);font-weight:500}
.drawer .list{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.alert{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel-2);display:grid;grid-template-columns:28px 1fr;gap:10px}
.alert .g{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.alert b{font-weight:500;display:block}.alert p{margin:2px 0 6px;font-size:12.5px;color:var(--ink-2)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:.2s;z-index:10}.scrim.open{opacity:1;pointer-events:auto}
.err{padding:40px;text-align:center;color:var(--bad)}

.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:13px}
.tbl th{font:500 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:6px 10px;background:var(--panel-2)}

.tbl td:first-child{border-left:1px solid var(--line);border-radius:10px 0 0 10px}.tbl td:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}

.r{text-align:right;white-space:nowrap}.mut{color:var(--ink-3)}.neg{color:var(--bad)}.pos{color:var(--ok)}

input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;place-items:start center;padding:5vh 16px;z-index:40;overflow:auto}
.modal.open{display:grid}.mbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(720px,100%);box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mbox h3{margin:0 0 4px;font-weight:500;font-size:18px}.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.btn[disabled]{opacity:.45;cursor:not-allowed}.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}.btn.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.btn.no{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.sem{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;margin-top:12px;border:1px solid var(--line)}
.sem.verde{background:var(--ok-bg);color:var(--ok)}.sem.amarelo{background:var(--warn-bg);color:var(--warn)}.sem.vermelho,.sem.bloqueado{background:var(--bad-bg);color:var(--bad)}
.sem b{font-weight:600}.sem span{color:var(--ink-2);font-size:12.5px}
.who{width:100%}.search{max-width:280px}
.bar-fecha{height:10px;border-radius:5px;background:var(--tick-off);overflow:hidden;margin-top:8px}.bar-fecha i{display:block;height:100%;background:var(--ok);transition:width .15s}
.bar-fecha.bad i{background:var(--bad)}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:14px 0 4px}

.chev{display:inline-block;width:14px;color:var(--ink-3)}
.pr{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-top:6px}

:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:6px}

  D.items.forEach(i=>{const ov=S.t.baseOv&&S.t.baseOv[i.codigo];if(ov){i.meta_base=ov.meta_total;i.teto_total=ov.teto_total;i.status_cotacao=ov.status_cotacao;i.meta_unit=ov.meta_unit}else i.meta_base=i.meta_base??i.meta_total;if(S.t.metaOv[i.codigo]!=null)i.meta_total=S.t.metaOv[i.codigo];else i.meta_total=i.meta_base;i.nat=dominante(i)});
  D.pacotes.forEach(p=>{const o=S.t.basePac&&S.t.basePac[p.codigo];if(o)Object.assign(p,o)});
  S.byCod=Object.fromEntries(D.eap.map(e=>[e.codigo,e]));
  D.items.forEach(i=>{i.linhas=i.composicao||[{nat:i.nat,share:1}]});
  D.pacotes.forEach(p=>p._it=D.items.filter(i=>i.pacote===p.codigo));
}
function saldos(){
  const m={};S.D.items.forEach(i=>m[i.codigo]={comp:0,real:0});
  const fat={};
  S.t.notas.forEach(n=>{if(n.status==='lancada')return;n.rateio.forEach(l=>{m[l.item]&&(m[l.item].real+=+l.valor);if(n.oc)fat[n.oc+'|'+l.item]=(fat[n.oc+'|'+l.item]||0)+ +l.valor})});
  S.t.ocs.forEach(o=>{if(['aprovada','recebida_parcial','recebida'].includes(o.status)&&m[o.item])m[o.item].comp+=Math.max(0,o.valor-(fat[o.id+'|'+o.item]||0))});
  S.sd=m;S.D.items.forEach(i=>{const s=m[i.codigo];s.meta=i.meta_total;s.teto=i.teto_total;s.livre=r2(i.meta_total-s.comp-s.real)});
  return m;
}
function semaforo(cod,total,pendId){
  const i=S.byCod[cod];
  if(!S.t.frozen)return ['bloqueado','Linha de base não congelada','Obra sem linha de base não abre compra (E01). Peça à Gestão para congelar a versão 1 em Orçamento.'];
  if(i&&i.tipo_linha==='item'&&i.meta_total==null)return ['bloqueado','Item sem meta de custo','Esta obra ainda não tem estudo de custo: defina a meta do item (Orçamento → Atualizar pela planilha) antes de comprar.'];
  if(!i||i.tipo_linha!=='item'||i.meta_total==null)return ['bloqueado','Fora da planilha do contrato','Sem item com meta não há compra: abra pedido de inclusão ou aditivo.'];
  const s=S.sd[i.codigo];
  if(i.teto_total!=null&&s.comp+s.real+total>i.teto_total)return ['vermelho','Acima do teto','Teto '+brl(i.teto_total)+' (margem zero). Só a Diretoria aprova.'];
  if(total<=s.livre)return ['verde','Cabe no saldo da meta','Saldo livre '+brl(s.livre)+'. Vira pedido sem alçada.'];
  return ['amarelo','Acima da meta, até o teto','Saldo livre '+brl(s.livre)+'. O Gerente de contrato aprova com justificativa.'];
}

/* ============ derivados ============ */
function derive(){
  const D=S.D,X={};saldos();
  const it=D.items;
  X.meta=it.reduce((s,i)=>s+i.meta_total,0);X.venda=it.reduce((s,i)=>s+i.preco_venda_total,0);X.teto=it.reduce((s,i)=>s+i.teto_total,0);
  X.comp=it.reduce((s,i)=>s+S.sd[i.codigo].comp,0);X.real=it.reduce((s,i)=>s+S.sd[i.codigo].real,0);
  X.aCotar=it.filter(i=>i.status_cotacao==='A cotar');X.semFolga=it.filter(i=>i.meta_total>i.teto_total);
  D.pacotes.forEach(p=>{p._dias=diasAte(p.fechar_ate);p._cot=p._it.filter(i=>i.status_cotacao==='A cotar').length;p._pctCot=p._it.length?1-p._cot/p._it.length:1;
    p._semFolga=p._it.filter(i=>i.meta_total>i.teto_total).length;p._acima=p.meta>p.teto;
    p._meta=p._it.reduce((s,i)=>s+i.meta_total,0);p._comp=p._it.reduce((s,i)=>s+S.sd[i.codigo].comp,0);p._real=p._it.reduce((s,i)=>s+S.sd[i.codigo].real,0);
    p._temOC=S.t.ocs.some(o=>S.byCod[o.item]?.pacote===p.codigo&&o.status!=='cancelada'&&o.status!=='reprovada')});
  X.vencidos=D.pacotes.filter(p=>p._dias!=null&&p._dias<0&&p._it.length&&!p._temOC);
  X.pendAprov=S.t.ocs.filter(o=>o.status==='em_alcada');
  X.semRateio=S.t.notas.filter(n=>n.status==='lancada');
  X.semPedido=S.t.notas.filter(n=>!n.oc);
  X.economia=S.t.ocs.filter(o=>['aprovada','recebida_parcial','recebida'].includes(o.status)).reduce((s,o)=>{const i=S.byCod[o.item];return s+(i.meta_unit*o.qtd-o.valor)},0);
  return X;
}

  S.t.fats.filter(f=>fatSaldo(f)>0&&f.venc<hojeISO()).forEach(f=>a.push(['bad','NF '+f.num+' vencida sem recebimento','Saldo '+brl(fatSaldo(f))]));

  if(tab==='prod')b=tabProd(prodTabela());
  return `<div class="head"><div><h1>Campo</h1><p class="lead">Apontamento diário por frente: quantidade, equipe, máquinas, chuva e paradas. Fluxo <b>rascunho → conferido → aprovado</b>; só o aprovado vira % físico (VA e IDC). ${MODO_SB?'Sem sinal, o registro fica guardado no aparelho e sobe sozinho.':''}</p></div>
   <button class="btn dark" data-act="novo-apt" ${can('apontar')?'':'disabled title="Só Encarregado, Engenheiro ou Gerente"'}>Novo apontamento</button></div>
   <div class="kpi4"><div><div class="k-l">Aguardando aprovação</div><div class="v ${pend.length?'neg':''}">${pend.length}</div></div><div><div class="k-l">Produzido hoje (VA)</div><div class="v">${brl(cs.reduce((s,c)=>s+c.va,0),true)}</div></div><div><div class="k-l">HH hoje</div><div class="v">${num(cs.reduce((s,c)=>s+c.hh,0))}</div></div><div><div class="k-l">Custo MO hoje</div><div class="v">${brl(cs.reduce((s,c)=>s+c.cmo,0),true)}</div></div></div>
   <div class="toolbar">${tabs('campo',[['dia','Apontamentos '+A.length],['prod','Produção por item']],tab)}</div>${b}`}
function modalApt(){
  APT={data:hojeISO(),item:S.D.items[0].codigo,qtd:'',chuva:0,pessoas:[{funcao:FUNCOES()[0]||'',n:1,h:8}],equip:[],parou:false,motivoParada:'',horasParada:0,obs:''};pintaApt()}
function lerApt(){if(!APT||!$('#a-item'))return;APT.data=$('#a-d').value;APT.item=$('#a-item').value;APT.qtd=$('#a-q').value;APT.chuva=+$('#a-ch').value||0;APT.parou=$('#a-pa').checked;APT.motivoParada=$('#a-mo').value;APT.horasParada=+$('#a-hp').value||0;APT.obs=$('#a-ob').value;
  document.querySelectorAll('[data-pk]').forEach(e=>{const k=+e.dataset.pk,f=e.dataset.f;const v=f==='funcao'?e.value:+e.value||0;APT.pessoas[k][f]=v});
  document.querySelectorAll('[data-ek]').forEach(e=>{const k=+e.dataset.ek,f=e.dataset.f;APT.equip[k][f]=f==='nome'?e.value:+e.value||0})}
function pintaApt(){
  const i=S.byCod[APT.item];
  modal(`<h3>Apontamento do dia</h3><div class="sub">Um registro por frente (item da EAP) e dia.</div>

  <div class="sub" style="margin-top:6px">${i?`Orçado ${num(i.qtd)} · já aprovado ${num(prodAcum(i.codigo))}${i.hh_unit?` · referência ${num(i.hh_unit)} HH/${esc(i.unidade||'un')}`:''}`:''}</div>
  <label>Equipe (pessoas × horas) <button class="btn sm" data-act="apt-ponto" style="margin-left:8px">Puxar do ponto</button></label>${APT.pessoas.map((p,k)=>`<div class="pr"><select data-pk="${k}" data-f="funcao">${FUNCOES().map(f=>`<option ${f===p.funcao?'selected':''}>${esc(f)}</option>`).join('')}</select><input data-pk="${k}" data-f="n" type="number" min="0" step="1" value="${p.n}" aria-label="pessoas"><input data-pk="${k}" data-f="h" type="number" min="0" step="any" value="${p.h}" aria-label="horas"><button class="btn sm" data-act="apt-delp" data-k="${k}">×</button></div>`).join('')}<button class="btn sm" style="margin-top:6px" data-act="apt-addp">+ função</button>
  <label>Equipamentos (horas, R$/h opcional, horas paradas)</label>${APT.equip.map((e,k)=>`<div class="pr"><input data-ek="${k}" data-f="nome" placeholder="Equipamento" list="frota-l" value="${esc(e.nome)}"><input data-ek="${k}" data-f="h" type="number" min="0" step="any" value="${e.h}" aria-label="horas"><input data-ek="${k}" data-f="rh" type="number" min="0" step="any" value="${e.rh}" aria-label="R$/h"><button class="btn sm" data-act="apt-dele" data-k="${k}">×</button></div>`).join('')}<button class="btn sm" style="margin-top:6px" data-act="apt-adde">+ equipamento</button><datalist id="frota-l">${(S.t.frts||[]).map(v=>`<option value="${esc(v.cod)}">${esc(v.desc)}</option>`).join('')}</datalist>
  <label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0"><input id="a-pa" type="checkbox" style="width:auto" ${APT.parou?'checked':''}> Houve parada</label>
  <div class="g2"><div><label>Motivo da parada</label><input id="a-mo" value="${esc(APT.motivoParada)}"></div><div><label>Horas paradas</label><input id="a-hp" type="number" min="0" step="any" value="${APT.horasParada}"></div></div>
  <label>Observação</label><textarea id="a-ob" rows="2">${esc(APT.obs)}</textarea>
  <div class="acts"><button class="btn" data-act="fechar">Cancelar</button><button class="btn dark" data-act="apt-ok">Salvar rascunho</button></div>`);
  $('#a-item').onchange=()=>{lerApt();pintaApt()}}
function doApt(){lerApt();frotaAplicaRh();const q=+APT.qtd;if(!(q>=0)||APT.qtd==='')return toast('Informe a quantidade (0 se não produziu)');
  if(!APT.data||APT.data>hojeISO())return toast('Data inválida');
  if(!APT.pessoas.some(p=>p.n>0&&p.h>0)&&q>0)return toast('Informe a equipe');
  if(S.t.apts.some(a=>a.data===APT.data&&a.item===APT.item&&a.status!=='rascunho'))return toast('Já há apontamento conferido/aprovado deste item neste dia');
  const a={id:'apt'+Date.now(),num:nextNum('apt'),data:APT.data,item:APT.item,qtd:q,chuva:APT.chuva,pessoas:APT.pessoas.filter(p=>p.n>0&&p.h>0),equip:APT.equip.filter(e=>e.nome),parou:APT.parou,motivoParada:APT.motivoParada,horasParada:APT.horasParada,obs:APT.obs,status:'rascunho',quem:user(),criado:new Date().toISOString()};
  S.t.apts.unshift(a);log('apontamento',a.num,'lançado','',num(q)+' · '+a.item);save();closeModal();toast(a.num+' salvo como rascunho');render()}
function aptConf(id){const a=S.t.apts.find(x=>x.id===id);if(!can('apontar'))return;a.status='conferido';a.conferidoPor=user();a.conferidoEm=new Date().toISOString();
  if(a.conferidoEm.slice(0,10)>addDias(a.data,1)||(a.conferidoEm.slice(0,10)===addDias(a.data,1)&&new Date().getHours()>=9))a.tarde=true;
  log('apontamento',a.num,'status','rascunho','conferido');save();toast(a.num+' conferido');render()}
function aptApr(id){const a=S.t.apts.find(x=>x.id===id);if(!can('aprovarApt'))return toast('Sem alçada');if(a.quem===user()&&S.role!=='admin')return toast('Quem lança não aprova');
  a.status='aprovado';a.aprovadoPor=user();if(hojeISO()>addDias(a.data,1))a.retro=true;log('apontamento',a.num,'status','conferido','aprovado'+(a.retro?' (retroativo)':''));save();toast(a.num+' aprovado · % físico atualizado');render()}
/* ============ LEAN (Fase 8) ============ */
const CAUSAS=['Material não chegou','Projeto ou definição','Equipamento indisponível','Falta de mão de obra','Chuva','Cliente ou liberação','Retrabalho','Planejamento falho','Outro'];
const TIPOS_R=['Material','Projeto','Equipamento','Mão de obra','Liberação do cliente','Licença','Financeiro','Outro'];
const restAb=()=>S.t.rsts.filter(r=>r.status==='aberta');
const escalada=r=>r.status==='aberta'&&duDesde(r.atualizada||r.criada)>=3;
const donoAb=d=>restAb().filter(r=>r.dono===d).length;
const bloqItem=cod=>restAb().filter(r=>r.item===cod);
function ppcSemanas(){const m={};S.t.atvs.forEach(a=>{if(a.status!=='cumprida'&&a.status!=='nao_cumprida')return;const w=m[a.semana]=m[a.semana]||{c:0,n:0};a.status==='cumprida'?w.c++:w.n++});
  return Object.entries(m).sort().map(([s,w])=>({semana:s,...w,ppc:w.c/(w.c+w.n)}))}
const ppcPill=p=>`<span class="pill ${p>=.8?'ok':p>=.6?'warn':'bad'}">${Math.round(p*100)}%</span>`;
function pareto(){const m={};S.t.atvs.filter(a=>a.status==='nao_cumprida').forEach(a=>m[a.causa||'Outro']=(m[a.causa||'Outro']||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function restAuto(X){return X.vencidos.map(p=>({auto:true,id:'auto-'+p.codigo,tipo:'Material',desc:`Pacote ${p.nome}: fechar até ${fdata(p.fechar_ate)} vencido, sem pedido`,dono:p.responsavel||'Compras',prazo:p.fechar_ate,valor:p.meta,status:'aberta'}))}
function viewLean(X){
  const tab=S.tab.lean||'pauta',T=S.t,ab=restAb(),esc3=ab.filter(escalada),auto=restAuto(X);
  const seg=segunda(hojeISO()),segAnt=addDias(seg,-7),pp=ppcSemanas(),ppAnt=pp.find(w=>w.semana===segAnt);
  let b='';
  if(tab==='pauta'){
    const sem=T.atvs.filter(a=>a.semana===seg),ven=T.tars.filter(t=>t.status!=='feito'&&t.quando&&t.quando<hojeISO());
    b=`<div class="kpi4"><div><div class="k-l">PPC semana anterior</div><div class="v">${ppAnt?Math.round(ppAnt.ppc*100)+'%':'—'}</div></div><div><div class="k-l">Restrições abertas</div><div class="v ${esc3.length?'neg':''}">${ab.length+auto.length}</div></div><div><div class="k-l">Escaladas (3+ dias úteis)</div><div class="v ${esc3.length?'neg':''}">${esc3.length}</div></div><div><div class="k-l">Atividades da semana</div><div class="v">${sem.length}</div></div></div>
    <div class="cols" style="margin-top:14px"><div class="card"><div class="in"><div class="panel-t">Compromissos da semana (${fdata(seg)})</div>${sem.length?sem.map(a=>`<div class="row" style="grid-template-columns:1fr auto"><div><h4>${esc(a.desc)}</h4><p class="mono">${a.item}</p></div>${atvPill(a)}</div>`).join(''):'<div class="sub">Nenhuma atividade prometida. Use Lookahead.</div>'}</div></div>
    <div class="card"><div class="in"><div class="panel-t">Para decidir na segunda</div>
     ${[...esc3.map(r=>`<div class="row" style="grid-template-columns:1fr auto"><div><h4>${esc(r.desc)}</h4><p>${esc(r.dono)} · escalada, parada há ${duDesde(r.atualizada||r.criada)} dias úteis</p></div><span class="pill bad">Escalar</span></div>`),
       ...X.vencidos.slice(0,4).map(p=>`<div class="row" style="grid-template-columns:1fr auto"><div><h4>Pacote ${esc(p.nome)} sem pedido</h4><p>fechar até ${fdata(p.fechar_ate)}</p></div><span class="pill bad">Vencido</span></div>`),
       ...ven.map(t=>`<div class="row" style="grid-template-columns:1fr auto"><div><h4>${esc(t.oque)}</h4><p>${esc(t.quem)} · era para ${fdata(t.quando)}</p></div><span class="pill warn">Atrasada</span></div>`),
       ...(S.t.apts.filter(a=>a.status!=='aprovado').length?[`<div class="row" style="grid-template-columns:1fr auto"><div><h4>${S.t.apts.filter(a=>a.status!=='aprovado').length} apontamento(s) sem aprovação</h4><p>Campo</p></div><span class="pill warn">Pendente</span></div>`]:[])].join('')||'<div class="sub">Nada crítico.</div>'}</div></div></div>`}
  if(tab==='look'){
    const sems=[-2,-1,0,1,2,3,4,5].map(k=>addDias(seg,7*k));
    b=`<div class="sub" style="margin-top:8px">Atividade só fica <b>Pronta</b> sem restrição aberta no item. Não cumprida exige a causa.</div>`+sems.map(s=>{const L=T.atvs.filter(a=>a.semana===s);return `<div class="panel-t" style="margin-top:14px">Semana de ${fdata(s)}${s===seg?' · atual':''}</div>${L.length?L.map(a=>`<div class="row" style="grid-template-columns:1fr auto auto"><div><h4>${esc(a.desc)}</h4><p class="mono">${a.item}${a.causa?' · '+esc(a.causa):''}</p></div>${atvPill(a)}<div>${a.status==='planejada'?`<button class="btn sm ok" data-act="atv-ok" data-id="${a.id}" ${bloqItem(a.item).length||!can('lean')?'disabled title="Há restrição aberta ou sem permissão"':''}>Cumprida</button> <button class="btn sm no" data-act="atv-no" data-id="${a.id}" ${can('lean')?'':'disabled'}>Não cumprida</button>`:''}</div></div>`).join(''):'<div class="sub">—</div>'}`}).join('')}
  if(tab==='restr'){
    const L=[...auto,...ab,...T.rsts.filter(r=>r.status!=='aberta')];
    b=`<div class="tw">${L.length?`<table class="tbl"><thead><tr><th>Restrição</th><th>Dono</th><th>Prazo</th><th class="r">R$ em jogo</th><th>Situação</th><th></th></tr></thead><tbody>${L.map(r=>`<tr><td><b>${esc(r.desc)}</b><div class="mut" style="font-size:11.5px">${esc(r.tipo)}${r.item?' · '+r.item:''}${r.proximo?' · próximo passo: '+esc(r.proximo):''}${r.replan?' · replanejada '+r.replan+'x':''}</div></td><td>${esc(r.dono)}</td><td>${fdata(r.prazo)}</td><td class="r">${brl(r.valor)}</td><td>${r.auto?'<span class="pill info">Automática</span>':r.status==='resolvida'?'<span class="pill ok">Resolvida</span>':escalada(r)?'<span class="pill bad">Escalada</span>':r.prazo&&r.prazo<hojeISO()?'<span class="pill warn">Vencida</span>':'<span class="pill mute">Aberta</span>'}</td>
      <td class="r">${r.status==='aberta'&&!r.auto?`<button class="btn sm ok" data-act="rst-ok" data-id="${r.id}" ${can('lean')?'':'disabled'}>Resolver</button> <button class="btn sm" data-act="rst-rep" data-id="${r.id}" ${can('lean')?'':'disabled'}>Replanejar</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="sub" style="padding:18px">Nenhuma restrição.</div>'}</div><div class="sub" style="margin-top:8px">Limite de 8 abertas por pessoa. Sem atualização por 3 dias úteis a restrição é escalada. Restrição automática nasce de pacote com “fechar até” vencido e sem pedido.</div>`}
  if(tab==='ppc'){
    const par=pareto(),mx=Math.max(1,...par.map(x=>x[1])),espera=ab.reduce((s,r)=>s+(+r.valor||0),0);
    b=`<div class="kpi4"><div><div class="k-l">PPC acumulado</div><div class="v">${pp.length?Math.round(pp.reduce((s,w)=>s+w.c,0)/pp.reduce((s,w)=>s+w.c+w.n,0)*100)+'%':'—'}</div></div><div><div class="k-l">Semanas medidas</div><div class="v">${pp.length}</div></div><div><div class="k-l">Custo da espera (R$ em jogo)</div><div class="v">${brl(espera,true)}</div></div><div><div class="k-l">Metas</div><div class="v" style="font-size:14px">verde ≥ 80% · amarelo ≥ 60%</div></div></div>
    <div class="cols" style="margin-top:14px"><div class="card"><div class="in"><div class="panel-t">PPC por semana</div>${pp.length?pp.map(w=>`<div class="row" style="grid-template-columns:1fr auto"><div><h4>Semana de ${fdata(w.semana)}</h4><p>${w.c} cumpridas de ${w.c+w.n}</p></div>${ppcPill(w.ppc)}</div>`).join(''):'<div class="sub">Marque atividades como cumprida/não cumprida.</div>'}</div></div>
    <div class="card"><div class="in"><div class="panel-t">Pareto das causas</div>${par.length?par.map(([c,n])=>`<div class="row" style="grid-template-columns:1fr 80px"><div><h4>${esc(c)}</h4><div class="bar-fecha bad"><i style="width:${n/mx*100}%"></i></div></div><b>${n}</b></div>`).join(''):'<div class="sub">Sem não cumpridas.</div>'}</div></div></div>`}
  if(tab==='tar'){
    const cols=[['afazer','A fazer'],['fazendo','Fazendo'],['feito','Feito']];
    b=`<div class="cols" style="grid-template-columns:repeat(3,1fr);margin-top:12px">${cols.map(([k,l])=>`<div class="card"><div class="in"><div class="panel-t">${l} · ${T.tars.filter(t=>t.status===k).length}</div>${T.tars.filter(t=>t.status===k).map(t=>`<div class="alert" style="grid-template-columns:1fr;margin-top:8px"><div><b>${esc(t.oque)}</b><p>${esc(t.quem)} · até ${fdata(t.quando)}${t.item?' · '+t.item:''}</p><p class="mut">${esc([t.porque&&'Por quê: '+t.porque,t.onde&&'Onde: '+t.onde,t.como&&'Como: '+t.como,t.quanto&&'Quanto: '+t.quanto].filter(Boolean).join(' · '))}</p>${k!=='feito'?`<button class="btn sm" data-act="tar-mv" data-id="${t.id}" ${can('lean')?'':'disabled'}>${k==='afazer'?'Iniciar':'Concluir'}</button>`:''}</div></div>`).join('')}</div></div>`).join('')}</div>`}
  const nb={restr:ab.length+auto.length,tar:T.tars.filter(t=>t.status!=='feito').length};

   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="nova-atv" ${can('lean')?'':'disabled'}>Nova atividade</button><button class="btn" data-act="nova-rst" ${can('lean')?'':'disabled'}>Nova restrição</button><button class="btn dark" data-act="nova-tar" ${can('lean')?'':'disabled'}>Nova tarefa</button></div></div>
   <div class="toolbar">${tabs('lean',[['pauta','Pauta de segunda'],['look','Lookahead'],['restr','Restrições',nb.restr],['ppc','PPC'],['tar','Tarefas',nb.tar]],tab)}</div>${b}`}
function atvPill(a){if(a.status==='cumprida')return '<span class="pill ok">Cumprida</span>';if(a.status==='nao_cumprida')return '<span class="pill bad">Não cumprida</span>';
  return bloqItem(a.item).length?'<span class="pill bad">Com restrição</span>':'<span class="pill ok">Pronta</span>'}
function modalAtv(){const seg=segunda(hojeISO());
  modal(`<h3>Nova atividade no lookahead</h3><label>Item</label><select id="v-item">${itemOptions()}</select><label>O que será feito</label><input id="v-desc"><label>Semana</label><select id="v-sem">${[-2,-1,0,1,2,3,4,5].map(k=>{const s=addDias(seg,7*k);return `<option value="${s}" ${k===0?'selected':''}>${fdata(s)}</option>`}).join('')}</select>
   <div class="acts"><button class="btn" data-act="fechar">Cancelar</button><button class="btn dark" data-act="atv-salvar">Salvar</button></div>`)}
function doAtv(){const d=$('#v-desc').value.trim();if(!d)return toast('Descreva a atividade');const a={id:'atv'+Date.now(),item:$('#v-item').value,desc:d,semana:$('#v-sem').value,status:'planejada',quem:user()};S.t.atvs.push(a);log('atividade',a.item,'lookahead','',d);save();closeModal();S.tab.lean='look';render()}
function atvOk(id){const a=S.t.atvs.find(x=>x.id===id);if(bloqItem(a.item).length)return toast('Há restrição aberta neste item');a.status='cumprida';log('atividade',a.item,'status','planejada','cumprida');save();render()}

/* ============ FATURAMENTO, RECEBIMENTO, DRE E CAIXA (Fase 9) ============ */
const mesDe=s=>String(s||'').slice(0,7);
const addMes=(m,n)=>{const [y,x]=m.split('-').map(Number);const d=new Date(y,x-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const fmes=m=>{const [y,x]=m.split('-');return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+x-1]+'/'+y.slice(2)};
const puItem=i=>i.qtd?i.preco_venda_total/i.qtd:0;
const medValor=m=>m.qtd*puItem(S.byCod[m.item]||{qtd:0,preco_venda_total:0});
const medsLivres=()=>S.t.meds.filter(m=>m.status==='atestada'&&!m.bc);
const bcBruto=b=>r2(b.medIds.reduce((s,id)=>{const m=S.t.meds.find(x=>x.id===id);return s+(m?medValor(m):0)},0));
const bcTotal=b=>r2(bcBruto(b)*(1+(b.reajuste||0)/100));
const bcAprov=b=>b.valorAprovado!=null?b.valorAprovado:bcTotal(b);
const bcGlosa=b=>b.valorAprovado!=null?r2(Math.max(0,bcTotal(b)-b.valorAprovado)):0;
const fatLiq=f=>r2(f.valor*(1-(f.ret||0)/100));
const fatRec=f=>r2(S.t.recs.filter(r=>r.fat===f.id).reduce((s,r)=>s+r.valor,0));
const fatSaldo=f=>r2(Math.max(0,fatLiq(f)-fatRec(f)));
const BC_ST={rascunho:['mute','Rascunho'],enviado:['info','Enviado ao cliente'],aprovado:['warn','Aprovado, a faturar'],faturado:['ok','Faturado']};
function realPorConta(){const real={};S.t.notas.forEach(n=>{if(n.status==='lancada')return;n.rateio.forEach(l=>{const c=l.conta||contaPadrao(l.nat,S.byCod[l.item]?.pacote);real[c]=(real[c]||0)+ +l.valor})});return real}
function dre(){
  const trib=S.D.obra.tributos_nota,bcs=S.t.bcs.filter(b=>b.status==='aprovado'||b.status==='faturado');
  const bruto=bcs.reduce((s,b)=>s+bcBruto(b),0),reaj=bcs.reduce((s,b)=>s+r2(bcBruto(b)*(b.reajuste||0)/100),0),glosa=bcs.reduce((s,b)=>s+bcGlosa(b),0);
  const aprov=bcs.reduce((s,b)=>s+bcAprov(b),0),ded=r2(aprov*trib),liq=r2(aprov-ded);
  const real=realPorConta(),custoPorConta=Object.entries(real).sort(([a],[b])=>cmpCod(a,b));const custo=custoPorConta.reduce((s,[,v])=>s+v,0);
  return {bruto,reaj,glosa,aprov,ded,liq,custoPorConta,custo,resultado:r2(liq-custo),margem:liq>0?(liq-custo)/liq:null}}
function proxMeses(n0,n1){const m0=mesDe(hojeISO());return Array.from({length:n1-n0+1},(_,k)=>addMes(m0,n0+k))}
function caixa(){return memo('cx',caixaRaw)}
function caixaRaw(){
  const meses=proxMeses(-2,6),L={};meses.forEach(m=>L[m]={entP:0,entR:0,saiP:0,saiR:0,man:0});
  const put=(m,k,v)=>{if(L[m])L[m][k]+=v};
  S.t.fats.forEach(f=>{put(mesDe(f.venc),'entP',fatSaldo(f))});
  S.t.recs.forEach(r=>put(mesDe(r.data),'entR',r.valor));
  S.t.titulos.filter(t=>!t.cancelado).forEach(t=>{const i=tituloInfo(t);if(t.parcelas&&t.parcelas.length){let pg=i.pago;t.parcelas.forEach(q=>{const u=Math.min(pg,q.valor);pg=r2(pg-u);put(mesDe(q.venc),'saiP',r2(q.valor-u))})}else put(mesDe(t.venc),'saiP',i.saldo)});
  S.t.notas.filter(n=>n.status==='paga').forEach(n=>put(mesDe(n.pago),'saiR',n.valor));
  S.t.lans.forEach(l=>put(mesDe(l.data),'man',l.valor));
  let acc=0,minAcc=0;
  const rows=meses.map(m=>{const x=L[m],liq=x.entR+x.entP-x.saiR-x.saiP+x.man;acc+=liq;minAcc=Math.min(minAcc,acc);return {m,...x,liq,acc}});
  return {rows,minAcc}}
function svgCaixa(rows){
  const W=640,H=180,P=24,mx=Math.max(1,...rows.map(r=>Math.max(r.entR+r.entP,r.saiR+r.saiP))),bw=(W-2*P)/rows.length;
  const y=v=>H-P-(v/mx)*(H-2*P);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto" role="img" aria-label="Entradas e saídas por mês">${rows.map((r,k)=>{const x=P+k*bw,e=r.entR+r.entP,s=r.saiR+r.saiP;
   return `<rect x="${x+bw*.12}" y="${y(e)}" width="${bw*.34}" height="${H-P-y(e)}" fill="var(--ok)" rx="2"/><rect x="${x+bw*.52}" y="${y(s)}" width="${bw*.34}" height="${H-P-y(s)}" fill="var(--bad)" rx="2"/><text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${fmes(r.m)}</text>`}).join('')}</svg>
   <div class="legend"><span><i style="background:var(--ok)"></i>Entradas (previstas + realizadas)</span><span><i style="background:var(--bad)"></i>Saídas (previstas + realizadas)</span></div>`}
function viewFat(X){
  const tab=S.tab.fat||'bc',T=S.t,livres=medsLivres(),vl=livres.reduce((s,m)=>s+medValor(m),0);
  let b='';
  if(tab==='bc'){
    b=`<div class="kpi4"><div><div class="k-l">Atestado a medir ao cliente</div><div class="v">${brl(vl,true)}</div></div><div><div class="k-l">Boletins</div><div class="v">${T.bcs.length}</div></div><div><div class="k-l">Aprovados a faturar</div><div class="v ${T.bcs.some(x=>x.status==='aprovado')?'neg':''}">${brl(T.bcs.filter(x=>x.status==='aprovado').reduce((s,x)=>s+bcAprov(x),0),true)}</div></div><div><div class="k-l">Glosas</div><div class="v">${brl(T.bcs.reduce((s,x)=>s+bcGlosa(x),0),true)}</div></div></div>
    <div class="tw">${T.bcs.length?`<table class="tbl"><thead><tr><th>Boletim</th><th class="r">Medido</th><th class="r">Reajuste</th><th class="r">Aprovado</th><th class="r">Glosa</th><th>Situação</th><th></th></tr></thead><tbody>${T.bcs.map(x=>{const st=BC_ST[x.status];
      return `<tr><td class="mono">${x.num}<div class="mut" style="font-size:11.5px">${fdata(x.periodo)} · ${x.medIds.length} medição(ões)</div></td><td class="r">${brl(bcBruto(x))}</td><td class="r">${x.reajuste?x.reajuste+'%':'—'}</td><td class="r">${x.valorAprovado!=null?brl(x.valorAprovado):'—'}</td><td class="r ${bcGlosa(x)?'neg':''}">${brl(bcGlosa(x))}</td><td><span class="pill ${st[0]}">${st[1]}</span></td>
      <td class="r">${x.status==='rascunho'?`<button class="btn sm" data-act="bc-env" data-id="${x.id}" ${can('bc')?'':'disabled'}>Enviar</button>`:x.status==='enviado'?`<button class="btn sm ok" data-act="bc-apr" data-id="${x.id}" ${can('bc')?'':'disabled'}>Registrar aprovação</button>`:x.status==='aprovado'?`<button class="btn sm dark" data-act="bc-fat" data-id="${x.id}" ${can('faturar')?'':'disabled title="Só Financeiro, Adm ou Gerente"'}>Faturar</button>`:''}</td></tr>`}).join('')}</tbody></table>`:'<div class="sub" style="padding:18px">Nenhum boletim. Medições atestadas em “Medição e resultado” entram aqui.</div>'}</div>`}
  if(tab==='nf'){
    const ab=T.fats.reduce((s,f)=>s+fatSaldo(f),0),venc=T.fats.filter(f=>fatSaldo(f)>0&&f.venc<hojeISO());
    b=`<div class="kpi4"><div><div class="k-l">NFs emitidas</div><div class="v">${T.fats.length}</div></div><div><div class="k-l">A receber (líquido de retenção)</div><div class="v">${brl(ab,true)}</div></div><div><div class="k-l">Vencidas</div><div class="v ${venc.length?'neg':''}">${venc.length}</div></div><div><div class="k-l">Recebido</div><div class="v">${brl(T.recs.reduce((s,r)=>s+r.valor,0),true)}</div></div></div>
    <div class="tw">${T.fats.length?`<table class="tbl"><thead><tr><th>NF de serviço</th><th>Vence</th><th class="r">Valor</th><th class="r">Retenção</th><th class="r">Recebido</th><th class="r">Saldo</th><th></th></tr></thead><tbody>${T.fats.map(f=>`<tr><td class="mono">${f.num}<div class="mut" style="font-size:11.5px">${f.bcNum} · emitida ${fdata(f.emissao)}</div></td><td class="${f.venc<hojeISO()&&fatSaldo(f)>0?'neg':''}">${fdata(f.venc)}</td><td class="r">${brl(f.valor)}</td><td class="r">${f.ret?f.ret+'%':'—'}</td><td class="r">${brl(fatRec(f))}</td><td class="r">${brl(fatSaldo(f))}</td><td class="r">${fatSaldo(f)>0?`<button class="btn sm ok" data-act="rec-novo" data-id="${f.id}" ${can('recFat')?'':'disabled title="Só Financeiro, Adm ou Diretoria"'}>Receber</button>`:'<span class="pill ok">Quitada</span>'}</td></tr>`).join('')}</tbody></table>`:'<div class="sub" style="padding:18px">Nenhuma NF emitida.</div>'}</div>
    <div class="panel-t" style="margin-top:16px">Conciliar recebimentos</div><div class="sub">Linhas do extrato <span class="mono">dd/mm/aaaa;descrição;valor</span> com valor positivo casam com recebimentos de mesmo valor.</div><textarea id="ofx-e" rows="3" placeholder="20/11/2026;TED SANEAGO;50000,00"></textarea><div style="margin-top:8px"><button class="btn dark" data-act="conc-ent" ${can('recFat')?'':'disabled'}>Conciliar</button> <span class="sub">${S.msgConcE||''}</span></div>`}
  if(tab==='caixa'){
    const c=caixa();
    b=`<div class="kpi4"><div><div class="k-l">Exposição máxima de caixa</div><div class="v ${c.minAcc<0?'neg':''}">${brl(c.minAcc,true)}</div></div><div><div class="k-l">A receber</div><div class="v">${brl(T.fats.reduce((s,f)=>s+fatSaldo(f),0),true)}</div></div><div><div class="k-l">A pagar</div><div class="v">${brl(T.titulos.filter(t=>!t.cancelado).reduce((s,t)=>s+tituloInfo(t).saldo,0),true)}</div></div><div><div class="k-l">Lançamentos manuais</div><div class="v">${T.lans.length}</div></div></div>
    <div class="card" style="margin-top:14px"><div class="in">${svgCaixa(c.rows)}</div></div>
    <div class="tw"><table class="tbl"><thead><tr><th>Mês</th><th class="r">Entradas previstas</th><th class="r">Recebido</th><th class="r">Saídas previstas</th><th class="r">Pago</th><th class="r">Manual</th><th class="r">Saldo do mês</th><th class="r">Acumulado</th></tr></thead><tbody>${c.rows.map(r=>`<tr><td>${fmes(r.m)}</td><td class="r">${brl(r.entP)}</td><td class="r">${brl(r.entR)}</td><td class="r">${brl(r.saiP)}</td><td class="r">${brl(r.saiR)}</td><td class="r">${brl(r.man)}</td><td class="r ${r.liq<0?'neg':''}">${brl(r.liq)}</td><td class="r ${r.acc<0?'neg':''}">${brl(r.acc)}</td></tr>`).join('')}</tbody></table></div>
    <div class="sub" style="margin-top:8px">Entradas: NFs a receber pelo vencimento e recebimentos. Saídas: títulos a pagar pelo vencimento e notas pagas. Use lançamentos manuais para impostos, financeiro e o que não passa pelo fluxo.</div>
    ${T.lans.length?`<div class="tw"><table class="tbl"><tbody>${T.lans.map(l=>`<tr><td>${fdata(l.data)}</td><td>${esc(l.desc)}</td><td class="r ${l.valor<0?'neg':'pos'}">${brl(l.valor)}</td></tr>`).join('')}</tbody></table></div>`:''}`}
  return `<div class="head"><div><h1>Faturamento e caixa</h1><p class="lead">Medições atestadas viram <b>boletim ao cliente</b>; aprovado, vira NF de serviço; o recebimento baixa e alimenta o caixa junto com as contas a pagar.</p></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="lan-novo" ${can('lan')?'':'disabled title="Só Financeiro ou Diretoria"'}>Lançamento manual</button><button class="btn dark" data-act="bc-novo" ${can('bc')&&livres.length?'':'disabled title="Sem medição atestada a faturar"'}>Gerar boletim</button></div></div>
   <div class="toolbar">${tabs('fat',[['bc','Boletins ao cliente '+T.bcs.length],['nf','NFs e recebimentos '+T.fats.length],['caixa','Caixa']],tab)}</div>${b}`}
function modalBc(){const l=medsLivres();
  modal(`<h3>Gerar boletim ao cliente</h3><div class="sub">Entram ${l.length} medição(ões) atestada(s) ainda não faturadas, no total de <b>${brl(l.reduce((s,m)=>s+medValor(m),0))}</b>.</div>
   <div class="g2"><div><label>Período</label><input id="b-per" type="date" value="${hojeISO()}"></div><div><label>Reajuste (%)</label><input id="b-rj" type="number" step="any" value="0"></div></div>
   <div class="acts"><button class="btn" data-act="fechar">Cancelar</button><button class="btn dark" data-act="bc-ok">Gerar</button></div>`)}
function doBc(){const l=medsLivres();if(!l.length)return toast('Nada a faturar');const b={id:'bc'+Date.now(),num:nextNum('bc'),periodo:$('#b-per').value||hojeISO(),reajuste:+$('#b-rj').value||0,medIds:l.map(m=>m.id),status:'rascunho',quem:user()};

function bcEnv(id){const b=S.t.bcs.find(x=>x.id===id);b.status='enviado';b.enviado=hojeISO();log('boletim',b.num,'status','rascunho','enviado');save();render()}
function bcAprModal(id){const b=S.t.bcs.find(x=>x.id===id);
  modal(`<h3>Aprovação do cliente · ${b.num}</h3><div class="sub">Total medido com reajuste: <b>${brl(bcTotal(b))}</b>. Se o cliente aprovou menos, a diferença vira glosa.</div><label>Valor aprovado (R$)</label><input id="b-ap" type="number" step="any" value="${bcTotal(b)}">

function concEnt(){const linhas=($('#ofx-e').value||'').split('\n').map(l=>l.trim()).filter(Boolean);let ok=0,sem=0;

const lfxDe=tp=>S.t.lfxs.filter(l=>l.tipo===tp);
function vencNota(n){const t=S.t.titulos.find(x=>x.oc&&x.oc===n.oc&&!x.cancelado);return t?t.venc:addDias(n.emissao||hojeISO(),30)}
function painelCalc(){return memo('pc',painelCalcRaw)}
function painelCalcRaw(){
  const T=S.t,h=hojeISO(),O=S.D.obra,X=S.X||derive(),contrato=O.valor_contrato||X.venda,trib=O.tributos_nota||0;
  const fats=T.fats,recs=T.recs,fat=r2(fats.reduce((s,f)=>s+f.valor,0));
  const faturadoAnt=r2(fats.filter(f=>mesDe(f.emissao)<mesCorr()).reduce((s,f)=>s+f.valor,0));
  const recebido=r2(recs.reduce((s,r)=>s+r.valor,0)),aReceber=r2(fats.reduce((s,f)=>s+fatSaldo(f),0));
  const atrRec=r2(fats.filter(f=>f.venc<h).reduce((s,f)=>s+fatSaldo(f),0));
  const fatDireto=r2(fats.filter(f=>f.fatDireto).reduce((s,f)=>s+f.valor,0)+T.notas.filter(n=>n.fatDireto&&n.status!=='lancada').reduce((s,n)=>s+n.valor,0)+lfxDe('gasto').filter(l=>l.fatDireto).reduce((s,l)=>s+l.valor,0));
  const impDeb=r2(fat*trib);
  const nt=T.notas.filter(n=>n.status!=='lancada'),npg=nt.filter(n=>n.status==='paga'),nab=nt.filter(n=>n.status!=='paga');
  const lg=lfxDe('gasto');
  const pago=r2(npg.reduce((s,n)=>s+n.valor,0)+lg.filter(l=>l.pago).reduce((s,l)=>s+l.valor,0));
  const atrasado=r2(nab.filter(n=>vencNota(n)<h).reduce((s,n)=>s+n.valor,0)+lg.filter(l=>!l.pago&&l.venc<h).reduce((s,l)=>s+l.valor,0));
  const aPagar=r2(nab.filter(n=>vencNota(n)>=h).reduce((s,n)=>s+n.valor,0)+lg.filter(l=>!l.pago&&l.venc>=h).reduce((s,l)=>s+l.valor,0));
  const gasto=r2(pago+atrasado+aPagar);
  const requisicao=r2(T.sols.filter(s=>['enviada','em_cotacao','cotada'].includes(s.status)).reduce((s,x)=>s+x.qtd*x.preco,0));
  const cfReal=r2(T.notas.filter(n=>n.status!=='lancada').reduce((s,n)=>s+n.rateio.filter(l=>l.nat==='ADM').reduce((a,l)=>a+ +l.valor,0),0)+lfxDe('custo_fixo').reduce((s,l)=>s+l.valor,0));
  const cfPrev=r2(S.D.items.filter(i=>i.nat==='ADM').reduce((s,i)=>s+i.meta_total,0));
  const custoFixo=Math.max(cfReal,0),prov=r2(X.comp+lfxDe('provisao').reduce((s,l)=>s+l.valor,0));
  const saldoFat=r2(contrato-fat);
  const comprom=r2(gasto+custoFixo+prov);
  const lucro=r2(contrato*(1-trib)-comprom);          // projetado com o que já está comprometido
  const lucroReal=r2(fat*(1-trib)-gasto-custoFixo);   // realizado: só o faturado contra o gasto
  return {contrato,fat,faturadoAnt,recebido,aReceber,atrRec,fatDireto,impDeb,impCred:0,pago,aPagar,atrasado,gasto,requisicao,custoFixo,cfPrev,
    pctCF:contrato?custoFixo/contrato:0,prov,saldoFat,comprom,lucro,lucroReal,pctLucro:contrato?lucro/contrato:0,trib}}
const PAINEL_DICA={contrato:'Valor do contrato da obra.',fat:'Soma das NFs de serviço emitidas (boletins aprovados e faturados).',
 gasto:'Pago + a pagar + atrasado: notas rateadas/conferidas/pagas e lançamentos importados do tipo gasto. Atrasado = vencimento no passado e sem pagamento.',
 requisicao:'Solicitações de compra ainda sem pedido aprovado (preço × quantidade).',custoFixo:'Natureza indireta (ADM) rateada nas notas + lançamentos de custo fixo importados.',
 prov:'Comprometido: pedidos aprovados ainda sem nota + provisões importadas.',saldoFat:'Contrato − faturado.',lucro:'Contrato líquido de tributos − (gasto + custo fixo + provisão). É projeção; o realizado aparece ao lado.',impDeb:'Estimativa: faturado × tributos sobre a nota do contrato. Apuração completa na Fase 14.'};
const kv=(l,v,o={})=>`<div class="pk ${o.cls||''} ${o.k?'clk':''}" ${o.k?`data-act="pc-det" data-k="${o.k}"`:''} ${o.tip?`title="${esc(o.tip)}"`:''}><div class="k-l">${l}</div><div class="v ${o.neg&&v<0?'neg':''}">${brl(v)}</div>${o.sub?`<div class="mut" style="font-size:11.5px">${o.sub}</div>`:''}</div>`;
function svgBarrasContrato(c){
  const W=560,H=250,P=30,mx=Math.max(c.contrato,c.comprom,1)*1.08,y=v=>H-P-(v/mx)*(H-2*P),bw=70;
  const stack=[['Gasto',c.gasto,'var(--info)'],['Custo fixo',c.custoFixo,'var(--warn)'],['Provisão',c.prov,'var(--bad)']];
  let acc=0,seg='';stack.forEach(([n,v,col])=>{const y1=y(acc+v),y0=y(acc);seg+=`<rect x="${W*.5-bw/2}" y="${y1}" width="${bw}" height="${Math.max(0,y0-y1)}" fill="${col}"><title>${n}: ${brl(v)}</title></rect>`;acc+=v});
  const lx=W*.82,ly=y(Math.max(0,c.lucro)),lh=Math.abs(y(c.lucro)-y(0));
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto" role="img" aria-label="Contrato, custos empilhados e lucro">
   <line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="var(--line)"/>
   <rect x="${W*.18-bw/2}" y="${y(c.contrato)}" width="${bw}" height="${H-P-y(c.contrato)}" fill="var(--ink-4,#9aa)"><title>Contrato ${brl(c.contrato)}</title></rect>
   ${seg}
   <rect x="${lx-bw/2}" y="${c.lucro>=0?ly:y(0)}" width="${bw}" height="${Math.max(2,lh)}" fill="${c.lucro>=0?'var(--ok)':'var(--bad)'}"><title>Lucro ${brl(c.lucro)}</title></rect>
   <text x="${W*.18}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--ink-3)">Contrato</text><text x="${W*.5}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--ink-3)">Custos</text><text x="${lx}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--ink-3)">Lucro</text>
   <text x="${W*.18}" y="${y(c.contrato)-6}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${brl(c.contrato,true)}</text><text x="${W*.5}" y="${y(c.comprom)-6}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${brl(c.comprom,true)}</text><text x="${lx}" y="${(c.lucro>=0?ly:y(0)+lh)+(c.lucro>=0?-6:14)}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${brl(c.lucro,true)}</text></svg>
   <div class="legend">${stack.map(([n,,col])=>`<span><i style="background:${col}"></i>${n}</span>`).join('')}</div>`}
function curvaS(){
  const ms=new Set([mesCorr()]);S.t.meds.forEach(m=>ms.add(mesDe(m.periodo)));S.t.fats.forEach(f=>ms.add(mesDe(f.emissao)));S.t.notas.forEach(n=>n.status!=='lancada'&&ms.add(mesDe(n.emissao)));
  const L=[...ms].filter(Boolean).sort();if(L.length<2)L.unshift(addMes(L[0],-1));
  const c={medido:0,fat:0,custo:0};return L.map(m=>{c.medido+=S.t.meds.filter(x=>x.status==='atestada'&&mesDe(x.periodo)===m).reduce((s,x)=>s+medValor(x),0);
    c.fat+=S.t.fats.filter(f=>mesDe(f.emissao)===m).reduce((s,f)=>s+f.valor,0);
    c.custo+=S.t.notas.filter(n=>n.status!=='lancada'&&mesDe(n.emissao)===m).reduce((s,n)=>s+n.valor,0);return {m,...c}}).filter(x=>{const M=typeof mesesPeriodo==='function'?mesesPeriodo():null;return !M||M.has(x.m)})}
function svgCurvaS(r){
  const W=560,H=210,P=28,mx=Math.max(1,...r.map(x=>Math.max(x.medido,x.fat,x.custo))),X=i=>P+i*(W-2*P)/Math.max(1,r.length-1),Y=v=>H-P-(v/mx)*(H-2*P);
  const ln=(k,col)=>`<polyline fill="none" stroke="${col}" stroke-width="2" points="${r.map((x,i)=>X(i)+','+Y(x[k])).join(' ')}"/>`+r.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x[k])}" r="3" fill="${col}"><title>${fmes(x.m)} · ${k}: ${brl(x[k])}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto" role="img" aria-label="Curva S acumulada">${ln('medido','var(--info)')}${ln('fat','var(--ok)')}${ln('custo','var(--bad)')}${r.map((x,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${fmes(x.m)}</text>`).join('')}</svg>
   <div class="legend"><span><i style="background:var(--info)"></i>Medido (atestado)</span><span><i style="background:var(--ok)"></i>Faturado</span><span><i style="background:var(--bad)"></i>Custo (notas)</span></div>`}
function painelContrato(X){
  const c=painelCalc(),O=S.D.obra,sf=(v,l)=>({tip:PAINEL_DICA[l]});
  const totI=S.D.items.length,semMeta=S.D.items.filter(i=>!i.meta_total).length;
  const idc=(()=>{let cm=0,va=0;S.D.items.forEach(i=>{const r=resItem(i);cm+=r.real;va+=r.va});return cm>0?va/cm:null})();
  const sem=(ok,warn)=>ok?'ok':warn?'warn':'bad';
  const desv=[...S.D.items].map(i=>({i,v:S.sd[i.codigo].comp+S.sd[i.codigo].real-i.meta_total})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,6);
  const nat={};S.D.items.forEach(i=>{nat[i.nat]=nat[i.nat]||{meta:0,real:0};nat[i.nat].meta+=i.meta_total;nat[i.nat].real+=S.sd[i.codigo].comp+S.sd[i.codigo].real});
  const alerts=[];if(c.atrasado>0)alerts.push(['bad','Gasto atrasado',brl(c.atrasado)]);if(c.atrRec>0)alerts.push(['bad','NF vencida a receber',brl(c.atrRec)]);if(c.lucro<0)alerts.push(['bad','Lucro projetado negativo',brl(c.lucro)]);
  if(X.semFolga.length)alerts.push(['warn','Itens com meta acima do teto',String(X.semFolga.length)]);if(semMeta)alerts.push(['warn','Itens sem meta de custo',semMeta+' de '+totI]);
  const bar=(v,m)=>m>0?`<div class="bar"><i class="b" style="width:${Math.min(100,v/m*100)}%"></i></div>`:'<span class="mut">sem meta</span>';
  return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px"><span class="mut" style="font-size:12px">Período da Curva S e do caixa</span>${barraFiltros()}</div><div class="sub" style="margin-top:6px">${esc(O.contratante)} · contrato ${esc(O.contrato)} · <b>${esc(O.codigo)}</b> ${esc(O.nome)}. Passe o mouse sobre um valor para ver como foi calculado.</div>
  <div class="pgrid">
   ${kv('Contrato',c.contrato,{...sf(0,'contrato'),cls:'big'})}
   ${kv('Faturado',c.fat,{k:'fat',...sf(0,'fat'),sub:'anteriores '+brl(c.faturadoAnt)})}${kv('Recebido',c.recebido,{k:'recebido'})}${kv('A receber',c.aReceber,{k:'aReceber'})}${kv('Atrasado (a receber)',c.atrRec,{k:'atrRec',neg:0,cls:c.atrRec>0?'bad':''})}
   ${kv('Fat. direto',c.fatDireto,{tip:'Faturamento direto: pago pelo cliente ao fornecedor (marque na NF).'})}
   ${kv('Impostos (débito)',c.impDeb,{...sf(0,'impDeb')})}${kv('Impostos (crédito)',c.impCred,{tip:'Créditos de impostos entram na apuração da Fase 14.'})}
   ${kv('Gasto',c.gasto,{k:'gasto',...sf(0,'gasto'),cls:'big'})}${kv('Gasto pago',c.pago,{k:'pago'})}${kv('Gasto a pagar',c.aPagar,{k:'aPagar'})}${kv('Gasto atrasado',c.atrasado,{k:'atrasado',cls:c.atrasado>0?'bad':''})}${kv('Requisição',c.requisicao,{k:'requisicao',...sf(0,'requisicao')})}
   ${kv('Custo fixo',c.custoFixo,{k:'custoFixo',...sf(0,'custoFixo'),sub:(c.pctCF*100).toFixed(2).replace('.',',')+' % do contrato · previsto '+brl(c.cfPrev)})}
   ${kv('Prov. gasto',c.prov,{k:'prov',...sf(0,'prov')})}${kv('Saldo a faturar',c.saldoFat,{...sf(0,'saldoFat')})}
   ${kv('Lucro (projetado)',c.lucro,{...sf(0,'lucro'),neg:1,cls:'big '+(c.lucro<0?'bad':''),sub:(c.pctLucro*100).toFixed(2).replace('.',',')+' % · realizado '+brl(c.lucroReal)})}
  </div>
  <div class="cols" style="margin-top:14px"><div class="card"><div class="in"><div class="panel-t">Contrato × custos × lucro</div>${svgBarrasContrato(c)}</div></div>
   <div class="card"><div class="in"><div class="panel-t">Curva S acumulada</div>${svgCurvaS(curvaS())}</div></div></div>
  <div class="cols" style="margin-top:14px"><div class="card"><div class="in"><div class="panel-t">Saúde da obra</div>
    <div class="row" style="grid-template-columns:1fr auto"><div><h4>IDC (valor agregado ÷ custo)</h4></div><span class="pill ${idc==null?'mute':sem(idc>=.95,idc>=.9)}">${idc==null?'0,00':idc.toFixed(2).replace('.',',')}</span></div>
    <div class="row" style="grid-template-columns:1fr auto"><div><h4>Margem projetada</h4></div><span class="pill ${sem(c.pctLucro>=.05,c.pctLucro>=0)}">${(c.pctLucro*100).toFixed(1).replace('.',',')} %</span></div>
    <div class="row" style="grid-template-columns:1fr auto"><div><h4>Comprometido ÷ contrato</h4></div><span class="pill ${sem(c.comprom/c.contrato<=.85,c.comprom/c.contrato<=1)}">${(c.comprom/c.contrato*100).toFixed(1).replace('.',',')} %</span></div>
    <div class="row" style="grid-template-columns:1fr auto"><div><h4>Caixa da obra (recebido − pago)</h4></div><span class="pill ${c.recebido-c.pago>=0?'ok':'bad'}">${brl(c.recebido-c.pago,true)}</span></div></div></div>
   <div class="card"><div class="in"><div class="panel-t">Alertas</div>${alerts.length?alerts.map(a=>`<div class="row" style="grid-template-columns:1fr auto"><div><h4>${a[1]}</h4></div><span class="pill ${a[0]}">${a[2]}</span></div>`).join(''):'<div class="sub">Nenhum alerta.</div>'}</div></div></div>
  <div class="cols" style="margin-top:14px"><div class="card"><div class="in"><div class="panel-t">Maiores desvios (acima da meta)</div>${desv.length?`<table class="tbl"><tbody>${desv.map(x=>`<tr class="clk" data-item="${x.i.codigo}"><td class="mono">${x.i.codigo}</td><td>${esc(x.i.descricao.slice(0,50))}</td><td class="r neg">+${brl(x.v)}</td></tr>`).join('')}</tbody></table>`:'<div class="sub">Nenhum item acima da meta.</div>'}</div></div>
   <div class="card"><div class="in"><div class="panel-t">Custo por natureza (meta × usado)</div><table class="tbl"><tbody>${Object.entries(nat).map(([k,v])=>`<tr><td>${NATNOME[k]||k}</td><td class="r">${brl(v.real,true)} / ${brl(v.meta,true)}</td><td style="width:90px">${bar(v.real,v.meta)}</td></tr>`).join('')}</tbody></table></div></div></div>
  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="pc-csv">Copiar números (CSV)</button><button class="btn" data-act="pc-conf">Conferir os números</button></div>
  ${consumoView()}${pessoalView()}${carteiraView()}
  <div class="sub" style="margin-top:8px">A obra ${esc(O.codigo)} mostra o que foi lançado aqui. Para trazer histórico financeiro de planilhas, use a aba <b>Importar</b> (CSV).</div>`}
ACOES['pc-csv']=()=>{const c=painelCalc(),t='indicador;valor\n'+Object.entries({contrato:c.contrato,faturado:c.fat,recebido:c.recebido,a_receber:c.aReceber,atrasado_receber:c.atrRec,fat_direto:c.fatDireto,impostos_debito:c.impDeb,gasto:c.gasto,gasto_pago:c.pago,gasto_a_pagar:c.aPagar,gasto_atrasado:c.atrasado,requisicao:c.requisicao,custo_fixo:c.custoFixo,prov_gasto:c.prov,saldo_a_faturar:c.saldoFat,lucro:c.lucro}).map(([k,v])=>k+';'+String(v).replace('.',',')).join('\n');
  try{navigator.clipboard.writeText(t).then(()=>toast('Copiado'),()=>toast('Não consegui copiar'))}catch(e){toast('Não consegui copiar')}};
ACOES['pc-conf']=()=>{S.tab.pain='conf';render()};

/* ---------- Conferência interna (o sistema confere os próprios números) ---------- */
function confChecks(){const c=painelCalc(),X=S.X||derive(),T=S.t,nt=T.notas.filter(n=>n.status!=='lancada'),
  rat=r2(nt.reduce((s,n)=>s+n.rateio.reduce((a,l)=>a+ +l.valor,0),0)),vnt=r2(nt.reduce((s,n)=>s+n.valor,0));
  return [
  {t:'Contrato × venda da EAP',a:['Contrato',c.contrato],b:['Soma da venda da EAP',X.venda],causa:'O valor do contrato cadastrado difere da soma dos itens vendidos na EAP.'},
  {t:'Notas × rateio',a:['Valor das notas',vnt],b:['Total rateado nos itens',rat],causa:'Há nota sem rateio de 100 % nos itens da EAP.'},
  {t:'Gasto lançado × realizado na EAP',a:['Gasto (pago + a pagar + atrasado)',c.gasto],b:['Realizado na EAP',X.real],causa:'Há lançamento importado sem item da EAP, ou nota sem rateio.'},
  {t:'Faturado × recebido + a receber',a:['Faturado',c.fat],b:['Recebido + a receber',r2(c.recebido+c.aReceber)],causa:'Recebimento registrado sem fatura, ou fatura sem saldo calculado.'},
  {t:'Gasto = pago + a pagar + atrasado',a:['Gasto',c.gasto],b:['Soma das três faixas',r2(c.pago+c.aPagar+c.atrasado)],causa:'Nota com vencimento ou situação inconsistente.'},
  {t:'Comprometido dentro do teto',a:['Gasto + custo fixo + provisão',c.comprom],b:['Teto da EAP',X.teto],modo:'max',causa:'O comprometido passou do teto: revise pedidos e rateios por item.'}]}
function confView(){
  const L=confChecks().map(x=>{const d=r2(x.a[1]-x.b[1]),ok=x.modo==='max'?d<=1:Math.abs(d)<=1;return {...x,d,ok}}),dif=L.filter(x=>!x.ok).length;
  const rows=L.map(x=>`<tr><td>${x.t}</td><td class="r">${brl(x.a[1])}<div class="mut" style="font-size:11px">${x.a[0]}</div></td><td class="r">${brl(x.b[1])}<div class="mut" style="font-size:11px">${x.b[0]}</div></td><td class="r ${x.ok?'':'neg'}">${brl(x.d)}</td><td>${x.ok?'<span class="pill ok">bate</span>':'<span class="pill bad">difere</span>'}</td><td class="mut" style="font-size:12px">${x.ok?'':x.causa}</td></tr>`).join('');
  return `<div class="sub">O sistema confere os próprios números da obra <b>${esc(S.D.obra.codigo)}</b>: contrato, EAP, notas, rateio, financeiro e teto. Nada precisa ser digitado.</div>
  <div class="kpi4"><div><div class="k-l">Verificações</div><div class="v">${L.length}</div></div><div><div class="k-l">Batem</div><div class="v">${L.length-dif}</div></div><div><div class="k-l">Diferem</div><div class="v ${dif?'neg':''}">${dif}</div></div><div><div class="k-l">Tolerância</div><div class="v">R$ 1,00</div></div></div>
  <div class="tw"><table class="tbl"><thead><tr><th>Verificação</th><th class="r">Valor A</th><th class="r">Valor B</th><th class="r">Diferença</th><th>Resultado</th><th>Causa provável</th></tr></thead><tbody>${rows}</tbody></table></div>`}

/* ---------- Importar lançamentos do financeiro (CSV) ---------- */
/* Colunas: tipo;numero;fornecedor;descricao;vencimento;valor;pago_em;fat_direto  (tipo: gasto | custo_fixo | provisao). Datas dd/mm/aaaa ou aaaa-mm-dd; valores 1.234,56. */
const numBR=s=>{s=String(s||'').trim().replace(/[R$\s]/g,'');if(!s)return 0;return s.includes(',')?+s.replace(/\./g,'').replace(',','.'):+s};
const dataImp=s=>{s=String(s||'').trim();const m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?`${m[3]}-${m[2]}-${m[1]}`:/^\d{4}-\d{2}-\d{2}$/.test(s)?s:''};
function lfxParse(txt){const out=[],erros=[];String(txt||'').replace(/^﻿/,'').split(/\r?\n/).forEach((ln,i)=>{if(!ln.trim())return;const c=ln.split(';').map(x=>x.trim());
  if(i===0&&/^tipo$/i.test(c[0]))return;const tp=(c[0]||'').toLowerCase();
  if(!['gasto','custo_fixo','provisao'].includes(tp))return erros.push(`Linha ${i+1}: tipo "${c[0]}" inválido (use gasto, custo_fixo ou provisao)`);
  const v=numBR(c[5]),venc=dataImp(c[4]);if(!(v>0))return erros.push(`Linha ${i+1}: valor inválido`);if(!venc)return erros.push(`Linha ${i+1}: vencimento inválido`);

/* ---------- drill-down: lista que compõe cada número ---------- */
function painelLinhas(k){const T=S.t,h=hojeISO(),R=[],add=(ref,desc,valor,data)=>R.push({ref,desc,valor:r2(valor),data});
  const nt=T.notas.filter(n=>n.status!=='lancada'),lg=lfxDe('gasto');
  const nota=n=>add(n.num,n.emitente+(n.status==='paga'?' · paga':''),n.valor,n.status==='paga'?n.pago:vencNota(n)),lf=l=>add('Importado '+(l.numero||''),l.forn+' · '+l.desc,l.valor,l.pago||l.venc);
  if(k==='fat')T.fats.forEach(f=>add(f.num,f.bcNum,f.valor,f.emissao));
  if(k==='recebido')T.recs.forEach(r=>add(r.id,'Recebimento',r.valor,r.data));
  if(k==='aReceber')T.fats.filter(f=>fatSaldo(f)>0).forEach(f=>add(f.num,'saldo a receber',fatSaldo(f),f.venc));
  if(k==='atrRec')T.fats.filter(f=>fatSaldo(f)>0&&f.venc<h).forEach(f=>add(f.num,'vencida',fatSaldo(f),f.venc));
  if(k==='pago'){nt.filter(n=>n.status==='paga').forEach(nota);lg.filter(l=>l.pago).forEach(lf)}
  if(k==='atrasado'){nt.filter(n=>n.status!=='paga'&&vencNota(n)<h).forEach(nota);lg.filter(l=>!l.pago&&l.venc<h).forEach(lf)}
  if(k==='aPagar'){nt.filter(n=>n.status!=='paga'&&vencNota(n)>=h).forEach(nota);lg.filter(l=>!l.pago&&l.venc>=h).forEach(lf)}
  if(k==='gasto'){nt.forEach(nota);lg.forEach(lf)}
  if(k==='requisicao')T.sols.filter(s=>['enviada','em_cotacao','cotada'].includes(s.status)).forEach(s=>add(s.num,s.desc,s.qtd*s.preco,s.data));
  if(k==='custoFixo'){nt.forEach(n=>{const v=n.rateio.filter(l=>l.nat==='ADM').reduce((a,l)=>a+ +l.valor,0);if(v)add(n.num,n.emitente+' (rateio ADM)',v,n.emissao)});lfxDe('custo_fixo').forEach(lf)}
  if(k==='prov'){T.ocs.filter(o=>['aprovada','recebida_parcial','recebida'].includes(o.status)).forEach(o=>{const f=T.notas.filter(n=>n.oc===o.id&&n.status!=='lancada').reduce((s,n)=>s+n.rateio.filter(l=>l.item===o.item).reduce((a,l)=>a+ +l.valor,0),0),v=Math.max(0,o.valor-f);if(v)add(o.num,o.forn+' · pedido sem nota',v,o.data)});lfxDe('provisao').forEach(lf)}
  return R}

  out.push({data:`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`,valor:r2(v),desc:g('MEMO')||g('NAME'),fitid:g('FITID')})});return out}

/* concilia saídas com notas pagas de mesmo valor e entradas com recebimentos de mesmo valor */
function conciliaMovs(id){let c=0;S.t.movs.filter(m=>m.banco===id&&!m.conc&&m.origem!=='baixa').forEach(m=>{
  if(m.valor<0){/* extrato confirma uma baixa já feita no sistema, ou uma nota paga sem baixa pela conta */
    const bx=S.t.movs.find(x=>x.banco===id&&x.origem==='baixa'&&!x.conc&&Math.abs(x.valor-m.valor)<.005);
    if(bx){const n=S.t.notas.find(n=>n.id===bx.nota);bx.conc=m.conc=n?n.num:"baixa";m.dup=true;if(n)n.conc=m.data;c++;return}
    const n=S.t.notas.find(n=>n.status==='paga'&&!n.conc&&Math.abs(n.valor+(n.encargos||0)-Math.abs(m.valor))<.005);if(n){n.conc=m.data;m.conc=n.num;c++}}
  else{const r=S.t.recs.find(r=>!r.conc&&Math.abs(r.valor-m.valor)<.005);if(r){r.conc=m.data;m.conc=r.id;c++}}});return c}

function baixaMultipla(){const ids=[...document.querySelectorAll('.bx:checked')].map(e=>e.value);if(!ids.length)return toast('Marque as notas');const banco=contaSel();if(!banco)return toast('Cadastre uma conta bancária');

  if(!ns.length)return toast('Nenhuma nota liberada marcada');const base=ns.reduce((s,n)=>s+n.valor,0),adj=r2(ju+mu-de);let rest=adj;

/* kardex: custo médio ponderado móvel por insumo (todos os locais); saldo por local à parte */
function kardex(ins,local){let q=0,cm=0;const R=[];
  movsIns(ins).forEach(m=>{const s=sinalMov(m);let cu=m.cu;
    if(s>0&&m.tipo==='ent'){const tot=q*cm+m.qtd*m.cu;q=r2(q+m.qtd);cm=q>0?tot/q:m.cu}
    else if(s>0){cu=cm||m.cu||0;q=r2(q+m.qtd)}   /* ajuste positivo entra ao custo médio */
    else{cu=cm;q=r2(q-m.qtd)}
    if(!local||m.local===local)R.push({m,q,cm,cu})});return R}
const cmIns=ins=>memo('cm'+ins,()=>{let q=0,cm=0;movsIns(ins).forEach(m=>{const s=sinalMov(m);if(s>0&&m.tipo==='ent'){const t=q*cm+m.qtd*m.cu;q=r2(q+m.qtd);cm=q>0?t/q:m.cu}else if(s>0)q=r2(q+m.qtd);else q=r2(q-m.qtd)});return cm});
const movsIns=ins=>(memo('mi',()=>{const M=new Map();movOrd().forEach(x=>{if(!M.has(x.ins))M.set(x.ins,[]);M.get(x.ins).push(x)});return M})).get(ins)||[];
const saldoIns=(ins,local)=>memo('sd'+ins+'|'+(local||''),()=>r2(movsIns(ins).filter(m=>!local||m.local===local).reduce((s,m)=>s+sinalMov(m)*m.qtd,0)));

const ultDia=comp=>{const [y,m]=comp.split('-').map(Number);return comp+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0')};
const diasMes=comp=>+ultDia(comp).slice(8);
/* depreciação linear mensal, pró-rata no mês de aquisição e no de baixa. vida e residual contábeis; a fiscal só informa */
function deprecBem(b,fiscal){const vida=fiscal?(b.vidaFisc||b.vida):b.vida;if(!(vida>0)||!b.aquisicao)return [];
  const base=b.valor*(1-(b.residual||0)/100),mensal=base/vida,fim=b.baixa?mesDe(b.baixa.data):mesDe(hojeISO()),R=[];let acum=0,m=mesDe(b.aquisicao);
  while(m<=fim&&acum<base-0.005){let f=1;if(m===mesDe(b.aquisicao))f=(diasMes(m)-(+b.aquisicao.slice(8))+1)/diasMes(m);if(b.baixa&&m===mesDe(b.baixa.data))f=Math.min(f,(+b.baixa.data.slice(8))/diasMes(m));
    const v=r2(Math.min(mensal*f,base-acum));if(v>0)R.push({comp:m,valor:v});acum=r2(acum+v);m=addMes(m,1)}return R}
const deprecAcum=(b,fiscal)=>r2(deprecBem(b,fiscal).reduce((s,x)=>s+x.valor,0));
const valorContabil=b=>r2(b.valor-deprecAcum(b));
/* partidas contábeis do patrimônio (somadas ao Diário em partidasAuto) */
function partidasPatrimonio(){const E=[];(S.t.pats||[]).forEach(b=>{if(!b.aquisicao)return;
  E.push({ref:'pa:'+b.id,origem:'Patrimônio',data:b.aquisicao,comp:mesDe(b.aquisicao),desc:'Ativação do bem '+b.cod,auto:true,linhas:[{conta:'1.2.01',d:b.valor,c:0},{conta:b.nota?'5.9.05':'3.1.03',d:0,c:b.valor}]});
  deprecBem(b).forEach(x=>E.push({ref:'pd:'+b.id+':'+x.comp,origem:'Depreciação',data:ultDia(x.comp),comp:x.comp,desc:'Depreciação '+b.cod,auto:true,linhas:[{conta:'5.9.03',d:x.valor,c:0},{conta:'1.2.02',d:0,c:x.valor}]}));
  if(b.baixa){const ac=deprecAcum(b),res=r2(b.valor-ac);E.push({ref:'pb:'+b.id,origem:'Baixa de bem',data:b.baixa.data,comp:mesDe(b.baixa.data),desc:'Baixa do bem '+b.cod+' · '+b.baixa.motivo,auto:true,linhas:[{conta:'1.2.02',d:ac,c:0},{conta:'5.9.04',d:res,c:0},{conta:'1.2.01',d:0,c:b.valor}].filter(l=>l.d>0||l.c>0)})}});return E}

  R.querySelectorAll('.clk:not([tabindex])').forEach(e=>{e.tabIndex=0;if(!e.getAttribute('role'))e.setAttribute('role','button')});
  R.querySelectorAll('th:not([scope])').forEach(e=>e.setAttribute('scope','col'));
  /* campos sem rótulo visível: usa placeholder, título, nome do dado ou id (sem forçar layout: nada de .labels) */
  R.querySelectorAll('input:not([aria-label]):not([type=hidden]),select:not([aria-label]),textarea:not([aria-label])').forEach(e=>{if(e.closest('label'))return;if(e.id&&R.querySelector('label[for="'+e.id+'"]'))return;const l=e.getAttribute('placeholder')||e.title||(e.dataset&&(e.dataset.f||e.dataset.k||e.dataset.cf))||e.name||e.id||(e.type==='checkbox'?'selecionar':'');if(l)e.setAttribute('aria-label',l)});
  R.querySelectorAll('button[title]:not([aria-label])').forEach(b=>{if(!b.firstChild||(b.firstChild.nodeType===1&&!b.textContent.trim()))b.setAttribute('aria-label',b.title)});
  R.querySelectorAll('svg[role=img]:not([aria-label])').forEach(s=>s.setAttribute('aria-label','Gráfico'))}
document.addEventListener('keydown',e=>{
  const t=e.target;if((e.key==='Enter'||e.key===' ')&&t&&t.classList&&t.classList.contains('clk')&&t.tagName!=='BUTTON'&&t.tagName!=='A'){e.preventDefault();t.click();return}
  if(e.key==='Tab'&&$('#modal').classList.contains('open')){const F=[...$('#mbox').querySelectorAll('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]')].filter(x=>x.offsetParent!==null);
    if(!F.length)return;const a=F[0],z=F[F.length-1];if(e.shiftKey&&(document.activeElement===a||!$('#mbox').contains(document.activeElement))){e.preventDefault();z.focus()}else if(!e.shiftKey&&(document.activeElement===z||!$('#mbox').contains(document.activeElement))){e.preventDefault();a.focus()}}});

const mdInline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<span class="mono">$1</span>');
function mdHtml(md,q){const out=[];let ul=false;const ok=l=>!q||l.toLowerCase().includes(q.toLowerCase());const fecha=()=>{if(ul){out.push('</ul>');ul=false}};
  md.split('\n').forEach(l=>{if(!l.trim()){fecha();return}if(/^# /.test(l)){fecha();out.push(`<h3>${mdInline(l.slice(2))}</h3>`);return}if(/^## /.test(l)){fecha();out.push(`<div class="panel-t" style="margin-top:12px">${mdInline(l.slice(3))}</div>`);return}
   if(/^- /.test(l)){if(!ok(l))return;if(!ul){out.push('<ul style="margin:4px 0 4px 18px;padding:0">');ul=true}out.push(`<li style="margin:4px 0">${mdInline(l.slice(2))}</li>`);return}fecha();if(ok(l))out.push(`<p class="sub">${mdInline(l)}</p>`)});fecha();return out.join('')}

lançamentos daquele mês ficam bloqueados (só a Diretoria reabre).\n- Nota acima da tolerância de 2% sobre o pedido volta para Compras.\n- CPF/CNPJ inválidos ou repetidos são recusados.\n\n## Erros comuns\n- \"O rateio não fecha 100% da nota\": some os valores das linhas.\n", "almoxarife": "# Manual do Almoxarife\n**Seu dia:** receber material, dar saída para as frentes e manter o estoque certo.\n\n## Tarefas\n- **Receber OC** (Suprimentos → Compras → Ordens de compra → Receber): informe a quantidade; se o insumo tem unidade de compra (ex.: BR = 6 m), escolha a unidade e o estoque converte.\n- **Estoque** (Suprimentos → Estoque): saída para a frente (escolha o item do orçamento para apropriar o consumo), entrada avulsa, ajuste (com motivo), transferência para outra obra (copie o código; a outra obra cola em \"Receber transferência\").\n- **Inventário**: abrir (copia o saldo), contar, recontar o que divergiu, importar contagem do coletor (`código;quantidade`) e fechar (gera os ajustes).\n- **Kardex**: botão Ver em cada insumo.\n\n## Regras que bloqueiam\n- Saída maior que o saldo do local é recusada.\n- Ajuste e inventário exigem motivo/contagem completa.\n- O mesmo código de transferência não entra duas vezes.\n\n## Observação\nO custo realizado do item continua vindo da nota fiscal; a saída mostra o **consumo apropriado** só como informação.\n", "compras": "# Manual de Compras e suprimentos\n**Seu dia:** cotar, emitir pedidos, acompanhar entregas e ocorrências.\n\n## Tarefas\n- **Cotar** (Suprimentos → Compras → Solicitações → Mapa de cotação): adicione propostas uma a uma ou **cole o arquivo do fornecedor** (`fornecedor;preço;prazo`). **Sugerir melhor** escolhe o menor preço (empate: menor prazo). Emita a OC.\n- **Ordens de compra**: acompanhe aprovação, recebimento, **Ocorrência** (atraso, avaria, divergência) e **Devolver** (baixa o estoque e registra o crédito).\n- **Necessidade e mín./máx.** (Suprimentos → Estoque → Necessidade): itens com atividade no lookahead sem compra em andamento, e insumos abaixo do mínimo.\n- **Cadastros** (Suprimentos → Cadastros): fornecedores (CNPJ validado), insumos (unidade de compra com fator, mínimo e máximo).\n\n## Regras que bloqueiam\n- Menos de 3 propostas exige justificativa ou marca de emergência (regularizar em 2 dias úteis). Escolher fora da menor também exige justificativa.\n- Semáforo e alçadas: verde até o limite sai sozinho; amarelo e verde acima do limite vão ao Gerente; acima do valor do Gerente ou do teto, à Diretoria. Quem solicitou não aprova a própria OC.\n- Item sem meta ou fora da planilha: bloqueado.\n\n## Erros comuns\n- \"Escolheu fora da menor: justifique\".\n- Preço colado com vírgula decimal: use `1.234,56` ou `1234.56`.\n", "encarregado": "# Manual do Encarregado de campo\n**Seu dia:** abrir Obra → Campo, lançar o apontamento do dia, conferir o ponto e a frota.\n\n## Tarefas\n- **Apontamento** (Obra → Campo → Novo apontamento): escolha a data e o item do orçamento, a quantidade produzida (0 se não produziu), a equipe (função × pessoas × horas) e os equipamentos. Use **Puxar do ponto** para preencher a equipe a partir do ponto do dia. Chuva e parada entram com motivo e horas.\n- **Ponto** (Pessoas → Pessoas e ponto → Ponto → Lançar o dia): para cada colaborador marque a situação (presente, folga, falta, atestado, férias, externo, INSS). Quem está presente conta horas na frente (item) escolhida.\n- **Frota** (Contratos e ativos → Frota): lance abastecimento, leitura do horímetro/km e checklist do dia. Checklist reprovado abre ordem de serviço corretiva sozinho.\n\n## Regras que bloqueiam\n- Não dá para lançar apontamento ou ponto com data futura.\n- **SST:** colaborador com ASO vencido ou ausente não recebe ponto de presença (peça ao Administrativo para registrar o ASO).\n- Leitura de horímetro/km nunca pode ser menor que a anterior.\n- Já existindo apontamento conferido do mesmo item e dia, o sistema recusa outro.\n\n## Erros comuns\n- \"Informe a frente\": presente com horas precisa do item do orçamento.\n- \"Já existe registro deste colaborador neste dia\": edite pelo Administrativo ou use outro item.\n", "engenheiro": "# Manual do Engenheiro residente\n**Seu dia:** acompanhar o Dashboard, aprovar apontamentos, pedir compras, medir produção e subempreiteiros.\n\n## Tarefas\n- **Dashboard** (Início): indicadores com meta, Curva S, funil de compras, estoque e pessoas. \"Escolher o que mostrar\" liga e desliga seções.\n- **Solicitar compra** (Suprimentos → Compras → Nova solicitação): nasce dentro de um item do orçamento. O semáforo compara com a meta e o teto do item.\n- **Aprovar apontamento** (Obra → Campo): confira e aprove os apontamentos conferidos.\n- **Medição** (Obra → Medição e resultado): lance a produção medida; o Gerente atesta; vira boletim ao cliente (BM) no Financeiro.\n- **Medição de subempreiteiro** (Contratos e ativos → Contratos → Nova medição): você lança; Gerente/Diretoria aprova. A aprovação gera a nota do subempreiteiro (com retenção de INSS) e o custo do item.\n- **Projetos** (Contratos e ativos → Projetos): etapas, % concluído e horas apropriadas.\n\n## Regras que bloqueiam\n- Compra acima da meta (amarelo) exige justificativa e vai ao Gerente; acima do teto (vermelho) vai à Diretoria; item sem meta ou fora da planilha é bloqueado.\n- A linha de base precisa estar congelada pela Gestão antes de comprar.\n- Medição de subempreiteiro não passa do valor vigente do contrato; contrato bloqueado não aceita medição.\n\n## Erros comuns\n- \"Excede o valor vigente\": peça aditivo ao Administrativo/Gerente.\n- Medição que você mesmo lançou não pode ser aprovada por você.\n", "financeiro": "# Manual do Financeiro\n**Seu dia:** liberar e pagar, conciliar o extrato, faturar, receber e fechar o mês.\n\n## Tarefas\n- **Pagar** (Financeiro → Pagar e conciliar): notas conferidas → **Liberar** → **Pagar**. **Contas a pagar** permite parcelar, renegociar (com motivo) e agrupar títulos do mesmo fornecedor.\n- **Contas e extrato**: importe o **OFX** (concilia sozinho), **baixa múltipla** com juros, multa e desconto, remessa **CNAB 240 genérica** (validar com o banco).\n- **Cobrança**: mensagem pronta e link do WhatsApp para NFs vencidas; registre o contato.\n- **Faturamento** (Financeiro → Faturamento e caixa): boletim de medição → aprovação do cliente → NF de serviço → recebimento. Fluxo de caixa e DRE.\n- **Painel da obra** (Início → Painéis → Contrato da obra): mesmos blocos do ERP de referência; **Conferência** com os totais de lá; **Importar lançamentos** (CSV) do financeiro antigo.\n- **Contabilidade**: Balancete (débito = crédito), Diário, Razão, DRE e Balanço, Orçamento por conta, **Fechamento** da competência, livros em CSV.\n\n## Regras que bloqueiam\n- Só o Financeiro libera e paga. Competência fechada bloqueia retroativos.\n- Recebimento acima do saldo da NF é recusado.\n\n## Pontos de atenção\n- Alíquotas e plano de contas são padrões: confirme com o contador.\n", "geral": "# Manual rápido (qualquer papel)\n- **Menu** à esquerda por áreas; as abas ficam no alto da tela. O papel define o que aparece e o que dá para fazer; botões cinza com dica indicam falta de permissão.\n- **Alertas** (sino): pendências críticas, atenção e informativas.\n- **Semáforo de compras:** verde na meta; amarelo acima da meta; vermelho acima do teto; bloqueado fora da planilha.\n- **Rateio** de nota fecha 100% entre itens. **Competência fechada** bloqueia retroativos. **SST** vencido bloqueia ponto.\n- Tudo que muda fica na **Auditoria** com antes e depois.\n- Dúvida de regra: `docs/FLUXO_NF.md` e `docs/COMECE_AQUI.md`.\n", "gerencia": "# Manual de Gerente, Diretoria e Gestão\n**Seu dia:** aprovar o que passa da alçada, acompanhar indicadores e decidir.\n\n## Tarefas\n- **Dashboard e indicadores** (Início; Gestão → Indicadores e BI): cartões com meta, Curva S, caixa, desvios, funil, pessoas. Defina metas em \"Escolher o que mostrar\". O painel dinâmico cruza fontes (notas, estoque, ponto, títulos, contabilidade) e copia CSV.\n- **Aprovar OCs** (Suprimentos → Compras → Aprovações): amarelo e verde acima do limite → Gerente; vermelho e acima do valor do Gerente → Diretoria. Reprovar exige motivo.\n- **Aprovar medição de subempreiteiro** e atestar medições (Obra → Medição).\n- **Congelar a linha de base** (Gestão/Diretoria) e **Parâmetros** de compras (limite verde, limite do Gerente, tolerância).\n- **Contratos**: aditivos, bloqueio, alertas de vencimento e reajuste.\n- **Reabrir competência** (só Diretoria, com motivo) em Contabilidade → Fechamento.\n- **Administração** (Gestão e administração): grupos, acesso temporário, suplente de aprovador, horário, **alçadas por evento**.\n\n## Regras\n- Ninguém aprova a própria solicitação. Suplente só vale dentro do período cadastrado.\n- Acesso temporário, suplência e horário valem na interface; no banco vale o papel em Usuários.\n", "planejamento": "# Manual de Planejamento\n**Seu dia:** lookahead, restrições, PPC e leitura dos painéis.\n\n## Tarefas\n- **Lean e planejamento** (Obra → Lean): pauta de segunda, lookahead de 6 semanas, restrições com dono e prazo, PPC, tarefas.\n- **Projetos** (Contratos e ativos → Projetos): modelos com etapas, % por etapa, horas apropriadas.\n- **Fluxos e SLA** (Gestão → Fluxos e SLA): inicie modelos (admissão, mobilização, fechamento mensal) que geram tarefas com dono e prazo.\n- **Painéis** e **Dashboard**: Curva S, produção × HH, PPC, desvios.\n\n## Regras\n- Atividade só entra no lookahead ligada a um item do orçamento. Restrição sem dono ou prazo é recusada.\n"};

S.flt=S.flt||{};
const fNum=t=>{t=String(t).replace(/−/g,'-').replace(/R\$|\s|%/g,'');if(!/^-?[\d.]*(,\d+)?$/.test(t)||!/\d/.test(t))return null;return parseFloat(t.replace(/\./g,'').replace(',','.'))};
const fData=t=>{const m=String(t).match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?m[3]+'-'+m[2]+'-'+m[1]:null};
const fSemData=t=>String(t).replace(/\d{2}\/\d{2}\/\d{4}/g,' ').replace(/\s+/g,' ').trim();
const fChave=(t,i)=>S.view+'|'+JSON.stringify(S.tab)+'|'+i;

function fLinhas(t){return [...t.tBodies].flatMap(b=>[...b.rows]).filter(r=>!(r.cells.length===1&&r.cells[0].colSpan>1))}
function fAnalisa(t,L){const th=[...t.tHead.rows[t.tHead.rows.length-1].cells],cols=[];
  th.forEach((h,i)=>{const nome=h.textContent.trim();const vals=L.slice(0,3000).map(r=>fCelula(r,i)).filter(v=>v!==''),n=vals.length;if(!n){cols.push({i,nome,tipo:'vazio'});return}
    const datas=vals.filter(v=>fData(v)).length,nums=vals.filter(v=>fNum(v)!==null).length,uniq=[...new Set(L.slice(0,3000).map(r=>fTx(r,i)).filter(v=>v!==''))];
    let tipo='texto';if(datas>=n*.7&&fSemData(vals[0]).length<=2)tipo='data';else if(nums>=n*.7)tipo='num';const temData=datas>=n*.5;
    cols.push({i,nome,tipo,temData,uniq:tipo==='texto'&&uniq.length>=2&&uniq.length<=12&&uniq.length<=L.length*.8?uniq.sort((a,b)=>a.localeCompare(b,'pt-BR')):null,dinheiro:tipo==='num'&&vals.some(v=>/R\$/.test(v))})});return cols}
function fBarra(t,L,cols,st){
  const sel=cols.filter(c=>c.uniq&&c.nome).map(c=>`<select class="f-c" data-i="${c.i}" aria-label="Filtrar por ${esc(c.nome)}"><option value="">${esc(c.nome)}: todos</option>${c.uniq.map(v=>`<option ${st.cols&&st.cols[c.i]===v?'selected':''} value="${esc(v)}">${esc(v.slice(0,40))}</option>`).join('')}</select>`).join('');

function fAplica(t){const bar=t.__bar;if(!bar)return;const st=t.__st,L=fLinhas(t),cols=t.__cols,dc=cols.find(c=>c.tipo==='data')||cols.find(c=>c.temData),mc=cols.find(c=>c.dinheiro);let n=0;

    if(ok&&st.al&&!r.querySelector('.neg,.pill.bad,.pill.warn'))ok=false;
