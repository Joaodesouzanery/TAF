<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAF Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23141416%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 font-family=%27Arial%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27%3ET%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f3f4; --panel:#fff; --panel-2:#f8f8f9; --line:#e8e8eb; --ink:#111113; --ink-2:#55555c; --ink-3:#8b8b93;
  --ok:#2f9e60; --ok-bg:#e6f5ec; --warn:#c98a0b; --warn-bg:#fdf3dc; --bad:#c8372d; --bad-bg:#fdeceb;
  --info:#3b63c9; --info-bg:#e8eefc; --tick-off:#d9d9de; --btn:#141416; --btn-ink:#fff;
  --r:14px; --sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0e10; --panel:#17171a; --panel-2:#1d1d21; --line:#2a2a2f; --ink:#f2f2f4; --ink-2:#b0b0b8; --ink-3:#7c7c85;
  --ok:#4cc582; --ok-bg:#12301f; --warn:#e7b04a; --warn-bg:#352a10; --bad:#ef6a5f; --bad-bg:#381815;
  --info:#7c9cf0; --info-bg:#182244; --tick-off:#34343a; --btn:#f2f2f4; --btn-ink:#111113; --sh:none}}
:root[data-theme="dark"]{
  --bg:#0e0e10; --panel:#17171a; --panel-2:#1d1d21; --line:#2a2a2f; --ink:#f2f2f4; --ink-2:#b0b0b8; --ink-3:#7c7c85;
  --ok:#4cc582; --ok-bg:#12301f; --warn:#e7b04a; --warn-bg:#352a10; --bad:#ef6a5f; --bad-bg:#381815;
  --info:#7c9cf0; --info-bg:#182244; --tick-off:#34343a; --btn:#f2f2f4; --btn-ink:#111113; --sh:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;padding:16px;gap:16px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:16px;height:calc(100vh - 32px);box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.obra-sel{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.obra-sel .av{width:32px;height:32px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:600}
.obra-sel b{display:block;font-weight:500;font-size:13px}.obra-sel span{font-size:12px;color:var(--ink-3)}
.sec{font:500 10.5px var(--mono);letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase;margin:6px 6px 0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:10px;text-align:left;color:var(--ink-2)}
.nav button:hover{background:var(--panel-2)}
.nav button.on{background:var(--panel-2);color:var(--ink);font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.nav .badge{margin-left:auto}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{font:500 10.5px var(--mono);padding:2px 7px;border-radius:999px;background:var(--panel-2);color:var(--ink-3)}
.badge.hot{background:var(--bad-bg);color:var(--bad)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.note{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--ink-3)}
.note b{color:var(--ink);font-weight:500;display:flex;gap:7px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.main{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:22px 28px 36px;min-width:0;position:relative;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:13px}
.top .sp{flex:1}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;position:relative}
.icon-btn .pip{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
h1{font-size:30px;font-weight:500;letter-spacing:-.02em;margin:26px 0 6px}
.lead{color:var(--ink-2);max-width:760px}.lead b{color:var(--ink);font-weight:600}
.head{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:10px;display:inline-flex;gap:8px;align-items:center;font-weight:500}
.btn.dark{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.card>.in{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.kpis{display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:center}
.k-l{font:500 10.5px var(--mono);letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.big{font-size:44px;font-weight:500;letter-spacing:-.03em;line-height:1.1;margin:8px 0 6px}.big small{font-size:22px;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;font:500 10.5px var(--mono);letter-spacing:.04em;padding:3px 8px;border-radius:6px;text-transform:uppercase;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.mute{background:var(--panel-2);color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.stats .v{font-size:26px;font-weight:500;letter-spacing:-.02em;margin-top:4px}
.ticks{display:flex;flex-wrap:wrap;gap:2px;margin-top:14px}
.ticks i{display:block;width:3px;height:22px;border-radius:1px;background:var(--ink)}
.ticks i.w{background:var(--warn)}.ticks i.r{background:var(--bad)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:12px}
.legend i{display:inline-block;width:3px;height:11px;margin-right:6px;vertical-align:-1px}
.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;margin-top:18px}
.tabs{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:8px;color:var(--ink-3)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tabs em{font-style:normal;color:var(--bad);margin-left:4px}
.row{display:grid;grid-template-columns:44px 1fr auto auto;gap:14px;align-items:center;padding:14px 4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row h4{margin:0;font-weight:500;font-size:14px}.row h4 .mono{color:var(--ink-3);margin-left:6px}
.row p{margin:1px 0 0;color:var(--ink-2);font-size:13px}
.row .val{text-align:right}.row .val b{font-weight:600;display:block}.row .val span{font-size:12px;color:var(--ink-3)}
.ring{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:conic-gradient(var(--c,var(--ink)) calc(var(--p)*1%),var(--tick-off) 0)}
.ring span{width:32px;height:32px;border-radius:50%;background:var(--panel);display:grid;place-items:center}
.mx h5{margin:14px 0 6px;font-weight:500;font-size:13px;display:flex;justify-content:space-between}
.mx h5 small{color:var(--ink-3);font-weight:400}.mx h5 small b{color:var(--bad);font-weight:500}
.sq{display:flex;flex-wrap:wrap;gap:2.5px}.sq i{width:8px;height:8px;border-radius:2px;background:var(--tick-off)}
.sq i.w{background:var(--warn)}.sq i.r{background:var(--bad)}
.sub{color:var(--ink-3);font-size:12.5px;margin:2px 0 4px}
.panel-t{font-weight:500;font-size:15px;margin:2px 4px}
.soon{display:grid;place-items:center;text-align:center;min-height:360px;color:var(--ink-3);gap:8px}
.soon h2{color:var(--ink);font-weight:500;margin:0}
.drawer{position:fixed;top:16px;right:16px;bottom:16px;width:380px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.18);transform:translateX(120%);transition:transform .22s ease;z-index:20;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);font-weight:500}
.drawer .list{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.alert{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel-2);display:grid;grid-template-columns:28px 1fr;gap:10px}
.alert .g{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.alert b{font-weight:500;display:block}.alert p{margin:2px 0 6px;font-size:12.5px;color:var(--ink-2)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:.2s;z-index:10}.scrim.open{opacity:1;pointer-events:auto}
.err{padding:40px;text-align:center;color:var(--bad)}
@media (max-width:1100px){.cols,.kpis{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){.app{grid-template-columns:1fr;padding:8px}.side{position:static;height:auto}.main{padding:16px}.row{grid-template-columns:44px 1fr auto}.row .val{display:none}}

.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:13px}
.tbl th{font:500 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:6px 10px;background:var(--panel-2)}
.tbl th:first-child{border-radius:8px 0 0 8px}.tbl th:last-child{border-radius:0 8px 8px 0}
.tbl td{padding:9px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);vertical-align:middle}
.tbl td:first-child{border-left:1px solid var(--line);border-radius:10px 0 0 10px}.tbl td:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}
.tbl tr.grp td{background:var(--panel-2);font-weight:500}.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover td{background:var(--panel-2)}
.r{text-align:right;white-space:nowrap}.mut{color:var(--ink-3)}.neg{color:var(--bad)}.pos{color:var(--ok)}
.tw{overflow:auto;margin-top:8px}
.bar{height:6px;border-radius:3px;background:var(--tick-off);overflow:hidden;min-width:70px;display:flex}
.bar i{display:block;height:100%}.bar .a{background:var(--info)}.bar .b{background:var(--ink)}.bar .c{background:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--info);outline-offset:-1px}
label{display:block;font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:12px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;place-items:start center;padding:5vh 16px;z-index:40;overflow:auto}
.modal.open{display:grid}.mbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(720px,100%);box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mbox h3{margin:0 0 4px;font-weight:500;font-size:18px}.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.btn[disabled]{opacity:.45;cursor:not-allowed}.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}.btn.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.btn.no{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.sem{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;margin-top:12px;border:1px solid var(--line)}
.sem.verde{background:var(--ok-bg);color:var(--ok)}.sem.amarelo{background:var(--warn-bg);color:var(--warn)}.sem.vermelho,.sem.bloqueado{background:var(--bad-bg);color:var(--bad)}
.sem b{font-weight:600}.sem span{color:var(--ink-2);font-size:12.5px}
.who{width:100%}.search{max-width:280px}
.bar-fecha{height:10px;border-radius:5px;background:var(--tick-off);overflow:hidden;margin-top:8px}.bar-fecha i{display:block;height:100%;background:var(--ok);transition:width .15s}
.bar-fecha.bad i{background:var(--bad)}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:14px 0 4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:10px;z-index:60;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.chev{display:inline-block;width:14px;color:var(--ink-3)}
.kpi4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.kpi4>div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.kpi4 .v{font-size:22px;font-weight:500;letter-spacing:-.02em;margin-top:3px}
@media (max-width:820px){.g2,.g3,.kpi4{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">T</div>TAF Admin</div>
    <div class="obra-sel"><div class="av" id="obra-av">342</div><div><b id="obra-nome">Carregando…</b><span id="obra-sub">Centro de custo</span></div></div>
    <div class="sec">Workspace</div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div><label style="margin-top:0">Entrar como</label><select id="role"></select></div>
      <div class="note"><b><span class="dot"></span><span id="src-label"></span></b><span id="src-sub"></span></div>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span id="crumb">Hoje</span><span class="sp"></span><span id="today"></span>
      <button class="icon-btn" id="bell" aria-label="Alertas"><svg class="ic" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><span class="pip" id="pip"></span></button>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"><header>Alertas da obra<button class="btn sm" id="close">Fechar</button></header><div class="list" id="alerts"></div></aside>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

<script src="config.js"></script>
<script>
/* ============ util ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=(v,c=false)=>{v=+v||0;return c&&Math.abs(v)>=1e6?'R$ '+(v/1e6).toFixed(2).replace('.',',')+' mi':c&&Math.abs(v)>=1e3?'R$ '+Math.round(v/1e3).toLocaleString('pt-BR')+' mil':v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})};
const num=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
const r2=v=>Math.round((+v||0)*100)/100;
const hojeISO=()=>new Date().toISOString().slice(0,10);
const diasAte=s=>s?Math.round((new Date(s+'T00:00:00')-new Date(hojeISO()+'T00:00:00'))/864e5):null;
const fdata=s=>s?s.split('-').reverse().join('/'):'—';
const ico=n=>`<svg class="ic" viewBox="0 0 24 24">${ICON[n]||''}</svg>`;
const ICON={hoje:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 eap:'<path d="M4 6h16M4 12h10M4 18h6"/>',pac:'<path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8"/>',
 compras:'<path d="M5 6h15l-1.5 9h-12zM5 6L4 3H2M9 20a1 1 0 1 0 0 .01M17 20a1 1 0 1 0 0 .01"/>',
 nota:'<path d="M7 3h8l4 4v14H7zM15 3v4h4M10 12h6M10 16h6"/>',pain:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',aud:'<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/>'};

/* ============ papéis ============ */
const ROLES={gestao:{n:'Gestão da carteira',u:'Felipe'},diretoria:{n:'Diretoria',u:'Thadeu'},gerente:{n:'Gerente de contrato',u:'Tiago Marinho'},
 engenheiro:{n:'Engenheiro residente',u:'Marko Aurélio'},compras:{n:'Compras e suprimentos',u:'Compras'},almox:{n:'Almoxarife',u:'Almoxarife'},
 adm:{n:'Administrativo de obra',u:'Administrativo'},financeiro:{n:'Financeiro',u:'Financeiro'}};
const CAN={congelar:['gestao','diretoria'],solicitar:['engenheiro','gerente'],cotar:['compras'],receber:['almox','engenheiro'],
 nota:['adm','engenheiro'],liberar:['financeiro'],remanejar:['gerente','diretoria'],param:['diretoria','gestao']};
const can=a=>CAN[a].includes(S.role);
const user=()=>ROLES[S.role].u;

/* ============ estado ============ */
const KEY='taf_admin_v2';
let S={view:'hoje',tab:{},role:'engenheiro',D:null,t:null,exp:new Set(),q:''};
const novoT=()=>({frozen:false,versao:1,hist:[],metaOv:{},sols:[],ocs:[],notas:[],aud:[],seq:{sol:0,oc:0,nf:0},par:{tol:0.02,limite:100000}});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({...S.t,role:S.role}))}catch(e){}};
function loadT(){try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j){S.role=j.role||S.role;delete j.role;return {...novoT(),...j}}}catch(e){}return novoT()}
const log=(ent,ref,campo,antes,depois,motivo='')=>S.t.aud.unshift({q:new Date().toISOString(),quem:user()+' ('+ROLES[S.role].n+')',ent,ref,campo,antes:String(antes??''),depois:String(depois??''),motivo});
function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}

/* ============ motor de regras (espelha o SQL) ============ */
const byCod=()=>S.byCod;
const dominante=i=>{const n=i.natureza||{};const k=Object.keys(n).sort((a,b)=>n[b]-n[a])[0];
  if(n[k]>0)return k;return /material/.test(i.tipo||'')?'MAT':'TER'};
function prep(){
  const D=S.D;D.items=D.eap.filter(e=>e.tipo_linha==='item');
  D.items.forEach(i=>{i.meta_base=i.meta_base??i.meta_total;if(S.t.metaOv[i.codigo]!=null)i.meta_total=S.t.metaOv[i.codigo];else i.meta_total=i.meta_base;i.nat=dominante(i)});
  S.byCod=Object.fromEntries(D.eap.map(e=>[e.codigo,e]));

function saldos(){
  const m={};S.D.items.forEach(i=>m[i.codigo]={comp:0,real:0});
  const fat={};
  S.t.notas.forEach(n=>{if(n.status==='lancada')return;n.rateio.forEach(l=>{m[l.item]&&(m[l.item].real+=+l.valor);if(n.oc)fat[n.oc+'|'+l.item]=(fat[n.oc+'|'+l.item]||0)+ +l.valor})});
  S.t.ocs.forEach(o=>{if(['aprovada','recebida_parcial','recebida'].includes(o.status)&&m[o.item])m[o.item].comp+=Math.max(0,o.valor-(fat[o.id+'|'+o.item]||0))});
  S.sd=m;S.D.items.forEach(i=>{const s=m[i.codigo];s.meta=i.meta_total;s.teto=i.teto_total;s.livre=r2(i.meta_total-s.comp-s.real)});

}
function semaforo(cod,total,pendId){

  const s=S.sd[i.codigo];

function derive(){
  const D=S.D,X={};saldos();
  const it=D.items;
  X.meta=it.reduce((s,i)=>s+i.meta_total,0);X.venda=it.reduce((s,i)=>s+i.preco_venda_total,0);X.teto=it.reduce((s,i)=>s+i.teto_total,0);
  X.comp=it.reduce((s,i)=>s+S.sd[i.codigo].comp,0);X.real=it.reduce((s,i)=>s+S.sd[i.codigo].real,0);
  X.aCotar=it.filter(i=>i.status_cotacao==='A cotar');X.semFolga=it.filter(i=>i.meta_total>i.teto_total);
  D.pacotes.forEach(p=>{p._dias=diasAte(p.fechar_ate);p._cot=p._it.filter(i=>i.status_cotacao==='A cotar').length;p._pctCot=p._it.length?1-p._cot/p._it.length:1;
    p._semFolga=p._it.filter(i=>i.meta_total>i.teto_total).length;p._acima=p.meta>p.teto;
    p._meta=p._it.reduce((s,i)=>s+i.meta_total,0);p._comp=p._it.reduce((s,i)=>s+S.sd[i.codigo].comp,0);p._real=p._it.reduce((s,i)=>s+S.sd[i.codigo].real,0);
    p._temOC=S.t.ocs.some(o=>S.byCod[o.item]?.pacote===p.codigo&&o.status!=='cancelada'&&o.status!=='reprovada')});
  X.vencidos=D.pacotes.filter(p=>p._dias!=null&&p._dias<0&&p._it.length&&!p._temOC);
  X.pendAprov=S.t.ocs.filter(o=>o.status==='em_alcada');
  X.semRateio=S.t.notas.filter(n=>n.status==='lancada');
  X.semPedido=S.t.notas.filter(n=>!n.oc);
  X.economia=S.t.ocs.filter(o=>['aprovada','recebida_parcial','recebida'].includes(o.status)).reduce((s,o)=>{const i=S.byCod[o.item];return s+(i.meta_unit*o.qtd-o.valor)},0);
  return X;
}

function emitirOC(id){
  const s=S.t.sols.find(x=>x.id===id);const r=document.querySelector('input[name=esc]:checked');if(!r)return toast('Escolha uma proposta');

  const ocsOk=S.t.ocs.filter(o=>['aprovada','recebida_parcial','recebida'].includes(o.status));
  modal(`<h3>${ex?'Ratear '+ex.num:'Lançar nota fiscal'}</h3><div class="sub">O XML da NF-e chegaria sozinho (Fase seguinte); aqui o administrativo confere e rateia.</div>
   <div class="g2"><div><label>Emitente</label><input id="n-e" value="${esc(NF.emitente)}" ${ex?'disabled':''}></div><div><label>Chave / número</label><input id="n-c" value="${esc(NF.chave)}" ${ex?'disabled':''}></div></div>
   <div class="g3"><div><label>Valor da nota (R$)</label><input id="n-v" type="number" step="0.01" value="${NF.valor||''}" ${ex?'disabled':''}></div><div><label>Emissão</label><input id="n-d" type="date" value="${NF.emissao}" ${ex?'disabled':''}></div>
   <div><label>Pedido (OC)</label><select id="n-o" ${ex?'disabled':''}><option value="">Sem pedido</option>${ocsOk.map(o=>`<option value="${o.id}" ${NF.oc===o.id?'selected':''}>${o.num} · ${esc(o.forn)} · ${brl(o.valor)}</option>`).join('')}</select></div></div>
   <div id="n-js" style="display:none"><label>Justificativa (nota sem pedido)</label><input id="n-j" value="${esc(NF.justSemOC||'')}"></div>
   <div class="panel-t" style="margin-top:16px">Rateio</div><div id="n-rat"></div><div style="margin-top:8px;display:flex;gap:8px"><button class="btn sm" data-act="add-lin">+ Linha</button><button class="btn sm" data-act="sug-lin">Sugerir pelo pedido</button></div>
   <div class="bar-fecha" id="n-bar"><i></i></div><div class="sub" id="n-fecha" style="margin-top:6px"></div>
   <div class="acts"><button class="btn" data-act="fechar">Cancelar</button><button class="btn" data-act="nf-ok" data-modo="lancada">Salvar sem ratear</button><button class="btn dark" data-act="nf-ok" data-modo="rateada">Salvar rateio</button></div>`);
  $('#n-o').onchange=()=>{NF.oc=$('#n-o').value;$('#n-js').style.display=NF.oc?'none':'block'};$('#n-js').style.display=NF.oc?'none':'block';
  $('#n-v').oninput=()=>{NF.valor=+$('#n-v').value;pintaRat()};if(!NF.rateio.length)NF.rateio.push({item:S.D.items[0].codigo,valor:0});pintaRat();
}
function pintaRat(){
  $('#n-rat').innerHTML=NF.rateio.map((l,k)=>{const i=S.byCod[l.item],s=S.sd[l.item];
   return `<div class="g3" style="grid-template-columns:2fr 1fr .6fr auto;align-items:end;margin-top:8px"><div><label style="margin-top:0">Item</label><select data-lin="${k}" data-f="item">${itemOptions(l.item)}</select></div><div><label style="margin-top:0">Valor (R$)</label><input type="number" step="0.01" data-lin="${k}" data-f="valor" value="${l.valor||''}"></div><div><label style="margin-top:0">Natureza</label><span class="pill info" title="vem do cadastro do insumo">${i.nat}</span></div><button class="btn sm no" data-act="del-lin" data-k="${k}">×</button>
   <div class="sub" style="grid-column:1/-1;margin-top:-4px">saldo livre do item ${brl(s.livre)}${l.valor>s.livre?' · <b class="neg">acima da meta</b>':''}</div></div>`}).join('');
  document.querySelectorAll('[data-lin]').forEach(e=>e.oninput=e.onchange=()=>{const l=NF.rateio[+e.dataset.lin];l[e.dataset.f]=e.dataset.f==='valor'?+e.value:e.value;if(e.dataset.f==='item')pintaRat();else fechaBar()});fechaBar();
}
function fechaBar(){const soma=r2(NF.rateio.reduce((s,l)=>s+(+l.valor||0),0)),v=r2(NF.valor);const p=v>0?Math.min(100,soma/v*100):0;
  $('#n-bar').className='bar-fecha'+(Math.abs(soma-v)>.004?(soma>v?' bad':''):'');$('#n-bar i').style.width=p+'%';
  $('#n-fecha').innerHTML=Math.abs(soma-v)<.005&&v>0?`<b class="pos">Fecha 100%</b> · ${brl(soma)}`:`Rateado ${brl(soma)} de ${brl(v)} · falta <b class="${soma>v?'neg':''}">${brl(v-soma)}</b>`}
function doNF(modo){
  const ex=S.t.notas.find(n=>n.id===NF.id);
  NF.emitente=ex?ex.emitente:$('#n-e').value.trim();NF.valor=ex?ex.valor:r2($('#n-v').value);NF.chave=ex?ex.chave:$('#n-c').value.trim();NF.emissao=ex?ex.emissao:$('#n-d').value;NF.oc=ex?ex.oc:$('#n-o').value;
  if(!NF.emitente||!(NF.valor>0))return toast('Informe emitente e valor');
  if(!NF.oc){const j=$('#n-j').value.trim();if(!j)return toast('Nota sem pedido: justifique');NF.justSemOC=j}
  const lin=NF.rateio.filter(l=>+l.valor>0);
  if(modo==='rateada'){if(!lin.length||lin.some(l=>!l.item))return toast('Toda linha precisa de obra e item');
    if(Math.abs(r2(lin.reduce((s,l)=>s+ +l.valor,0))-NF.valor)>.004)return toast('O rateio não fecha 100% da nota')}
  const n={...NF,rateio:lin.map(l=>({item:l.item,valor:r2(l.valor),nat:S.byCod[l.item].nat})),status:modo,ocNum:NF.oc?S.t.ocs.find(o=>o.id===NF.oc).num:''};
  if(ex){Object.assign(ex,n)}else{n.num=nextNum('nf');S.t.notas.unshift(n)}
  log('nota_fiscal',n.num||ex.num,'status','',modo+' · '+brl(NF.valor));save();closeModal();toast('Nota '+(modo==='rateada'?'rateada':'lançada (fila sem rateio)'));render();
}
function conferir(id){
  const n=S.t.notas.find(x=>x.id===id);n.diverg='';
  if(n.oc){const o=S.t.ocs.find(x=>x.id===n.oc);
    const outras=S.t.notas.filter(x=>x.oc===o.id&&x.id!==n.id&&x.status!=='lancada').reduce((s,x)=>s+x.valor,0);
    const esperado=r2(ocRecebido(o)-outras);
    if(esperado<=0){n.status='divergente';n.diverg='Sem recebimento registrado para esta nota';}
    else if(Math.abs(n.valor-esperado)/esperado>S.t.par.tol){n.status='divergente';n.diverg=`Nota ${brl(n.valor)} × esperado ${brl(esperado)} (tolerância ${(S.t.par.tol*100).toFixed(1)}%)`}
    else n.status='conferida'}
  else n.status='conferida';
  log('nota_fiscal',n.num,'status','rateada',n.status,n.diverg);save();toast(n.status==='conferida'?'Conferida':'Divergente: volta para Compras');render()}
function liberar(id){const n=S.t.notas.find(x=>x.id===id);
  if(n.oc){const o=S.t.ocs.find(x=>x.id===n.oc);if(!(o.recebido>0))return toast('Pagamento só com recebimento confirmado (E19)')}
  n.status='liberada';log('nota_fiscal',n.num,'status','conferida','liberada');save();toast('Liberada para pagamento');render()}
function pagar(id){const n=S.t.notas.find(x=>x.id===id);n.status='paga';n.pago=hojeISO();log('nota_fiscal',n.num,'status','liberada','paga');save();toast('Pago');render()}

/* ============ PAINÉIS (Fase 5) ============ */
function viewPain(X){
  const tab=S.tab.pain||'compras';
  let b='';
  if(tab==='compras'){
    const L=S.D.pacotes.filter(p=>p._it.length).sort((a,b)=>(b._comp+b._real)-(a._comp+a._real));
    b=`<div class="kpi4"><div><div class="k-l">Comprometido</div><div class="v">${brl(X.comp,true)}</div></div><div><div class="k-l">Realizado</div><div class="v">${brl(X.real,true)}</div></div><div><div class="k-l">Economia nas OCs</div><div class="v ${X.economia>=0?'pos':'neg'}">${brl(X.economia,true)}</div></div><div><div class="k-l">Aprovações paradas</div><div class="v ${X.pendAprov.length?'neg':''}">${X.pendAprov.length}</div></div></div>
    <div class="tw"><table class="tbl"><thead><tr><th>Pacote</th><th class="r">Meta</th><th class="r">Comprometido</th><th class="r">Realizado</th><th class="r">Saldo</th><th>Consumo</th><th>A fechar</th></tr></thead><tbody>${L.map(p=>`<tr><td><b>${esc(p.nome)}</b><div class="mono mut">${p.codigo}</div></td><td class="r">${brl(p._meta)}</td><td class="r">${brl(p._comp)}</td><td class="r">${brl(p._real)}</td><td class="r ${p._meta-p._comp-p._real<0?'neg':''}">${brl(p._meta-p._comp-p._real)}</td><td>${bar(p._comp,p._real,p._meta)}</td><td>${p._temOC?'<span class="pill ok">com pedido</span>':p._dias<0?`<span class="pill bad">vencido ${-p._dias}d</span>`:p._dias<=30?`<span class="pill warn">${p._dias}d</span>`:fdata(p.fechar_ate)}</td></tr>`).join('')}</tbody></table></div>`}
  if(tab==='obra'){
    const sc={};S.D.items.forEach(i=>{const k=i.nat;sc[k]=sc[k]||{meta:0,comp:0,real:0};sc[k].meta+=i.meta_total;sc[k].comp+=S.sd[i.codigo].comp;sc[k].real+=S.sd[i.codigo].real});
    const NM={MO:'Mão de obra',MAT:'Material e equipamento',EQP:'Máquinas e veículos',TER:'Terceiros',ADM:'Indireto da obra'};
    const top=[...S.D.items].map(i=>({i,u:(S.sd[i.codigo].comp+S.sd[i.codigo].real)/i.meta_total})).filter(x=>x.u>0).sort((a,b)=>b.u-a.u).slice(0,10);
    const resultado=X.venda*(1-S.D.obra.tributos_nota)-X.meta;
    b=`<div class="kpi4"><div><div class="k-l">Preço licitado</div><div class="v">${brl(X.venda,true)}</div></div><div><div class="k-l">Meta de custo</div><div class="v">${brl(X.meta,true)}</div></div><div><div class="k-l">Resultado pela meta</div><div class="v ${resultado>=0?'pos':'neg'}">${brl(resultado,true)}</div></div><div><div class="k-l">Previsto (comp.+real.)</div><div class="v">${brl(X.comp+X.real,true)}</div></div></div>
    <div class="sub" style="margin-top:10px">Resultado pela meta = licitado × (1 − ${(S.D.obra.tributos_nota*100).toFixed(1)}% de tributos) − meta de custo. A divergência com o +R$ 227 mil do Estudo existe porque ele ainda soma reajuste e custos de MO/administração próprias; ver nota na seção 12 do doc.</div>
    <div class="panel-t" style="margin-top:16px">Meta por natureza</div><div class="tw"><table class="tbl"><thead><tr><th>Natureza</th><th class="r">Meta</th><th class="r">Comprometido</th><th class="r">Realizado</th></tr></thead><tbody>${Object.entries(sc).map(([k,v])=>`<tr><td>${NM[k]}</td><td class="r">${brl(v.meta)}</td><td class="r">${brl(v.comp)}</td><td class="r">${brl(v.real)}</td></tr>`).join('')}</tbody></table></div>
    <div class="panel-t" style="margin-top:16px">Itens mais consumidos da meta</div>${top.length?`<div class="tw"><table class="tbl"><tbody>${top.map(x=>`<tr class="clk" data-item="${x.i.codigo}"><td class="mono">${x.i.codigo}</td><td>${esc(x.i.descricao.slice(0,70))}</td><td class="r ${x.u>1?'neg':''}">${Math.round(x.u*100)}% da meta</td></tr>`).join('')}</tbody></table></div>`:'<div class="sub">Sem consumo ainda.</div>'}`}
  if(tab==='carteira'){
    const C=[['342','SANEAGO · UTR ETA Santo Antônio do Descoberto',3258000,'Preço global por evento','ativa'],['343','CAESB · Subadutora Sobradinho',5226634.03,'Preço unitário','linha de base pendente (Fase seguinte)'],['281','SANEAGO · Mozarlândia (consórcio)',17120015.74,'Eventograma','sem orçamento de custo; histórico a importar (08D)']];
    b=`<div class="tw"><table class="tbl"><thead><tr><th>Obra</th><th class="r">Contrato</th><th>Regime</th><th class="r">Meta</th><th class="r">Comprometido</th><th class="r">Realizado</th><th>Situação</th></tr></thead><tbody>${C.map(c=>c[0]==='342'?`<tr class="clk"><td><b>${c[0]}</b><div class="mut" style="font-size:11.5px">${c[1]}</div></td><td class="r">${brl(c[2],true)}</td><td>${c[3]}</td><td class="r">${brl(X.meta,true)}</td><td class="r">${brl(X.comp,true)}</td><td class="r">${brl(X.real,true)}</td><td><span class="pill ${S.t.frozen?'ok':'warn'}">${S.t.frozen?'base v'+S.t.versao:'base não congelada'}</span></td></tr>`:`<tr><td><b>${c[0]}</b><div class="mut" style="font-size:11.5px">${c[1]}</div></td><td class="r">${brl(c[2],true)}</td><td>${c[3]}</td><td class="r mut">—</td><td class="r mut">—</td><td class="r mut">—</td><td><span class="pill bad">${c[4]}</span></td></tr>`).join('')}</tbody></table></div><div class="sub" style="margin-top:8px">Valores de contrato lidos de TAF rev6 · 03. CONTRATOS. Obras sem linha de base não abrem compra (E01).</div>`}
  return `<div class="head"><div><h1>Painéis</h1><p class="lead">Lidos dos mesmos registros do fluxo de compra e de notas, sem exportação.</p></div></div>
  <div class="toolbar">${tabs('pain',[['compras','Compras'],['obra','Obra'],['carteira','Carteira']],tab)}</div>${b}`;
}

/* ============ AUDITORIA ============ */
function viewAud(){
  const A=S.t.aud;
  return `<div class="head"><div><h1>Auditoria</h1><p class="lead">Quem mudou o quê, quando e por quê. Nada se apaga: cancelar muda o status e grava o motivo.</p></div><button class="btn" data-act="reset">Restaurar dados de demonstração</button></div>
  <div class="tw">${A.length?`<table class="tbl"><thead><tr><th>Quando</th><th>Quem</th><th>Registro</th><th>Campo</th><th>Antes</th><th>Depois</th><th>Motivo</th></tr></thead><tbody>${A.slice(0,200).map(a=>`<tr><td class="mono">${a.q.slice(0,19).replace('T',' ')}</td><td>${esc(a.quem)}</td><td class="mono">${esc(a.ref)}</td><td>${esc(a.campo)}</td><td>${esc(a.antes)}</td><td>${esc(a.depois)}</td><td>${esc(a.motivo)}</td></tr>`).join('')}</tbody></table>`:empty('Sem eventos ainda.','Cada ação do fluxo aparece aqui.')}</div>`;
}

/* ============ render / eventos ============ */
function render(){
  const X=derive();S.X=X;
  $('#nav').innerHTML=NAV.map(([k,l,i])=>`<button class="${S.view===k?'on':''}" data-v="${k}">${ico(i)}${l}${badgeFor(k,X)}</button>`).join('');
  $('#crumb').textContent=NAV.find(n=>n[0]===S.view)[1];
  const V={hoje:viewHoje,eap:viewEap,pac:viewPac,compras:viewCompras,nota:viewNota,pain:viewPain,aud:viewAud}[S.view];
  const keepQ=document.activeElement&&document.activeElement.id==='q';
  $('#view').innerHTML=V(X);
  if(keepQ){const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}
  const al=alertas(X);const nb=al.filter(a=>a[0]==='bad').length;$('#pip').style.display=nb?'block':'none';
  const G={bad:'var(--bad)',warn:'var(--warn)',info:'var(--info)'};
  $('#alerts').innerHTML=al.map(([k,t,p])=>`<div class="alert"><div class="g" style="color:${G[k]}"><svg class="ic" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div><div><b>${t}</b><p>${p}</p><span class="pill ${k}">${k==='bad'?'Crítico':k==='warn'?'Atenção':'Info'}</span></div></div>`).join('');
  $('#role').value=S.role;
}
const openDrawer=()=>{$('#drawer').classList.add('open');$('#scrim').classList.add('open')},closeDrawer=()=>{$('#drawer').classList.remove('open');$('#scrim').classList.remove('open')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeModal()}});
$('#bell').onclick=openDrawer;$('#close').onclick=closeDrawer;$('#scrim').onclick=closeDrawer;
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
$('#role').innerHTML=Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v.n} · ${v.u}</option>`).join('');
$('#role').onchange=e=>{S.role=e.target.value;save();render()};

document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;render()}});
document.addEventListener('click',e=>{
  const t=e.target;let el;
  if(el=t.closest('[data-tabs] button')){S.tab[el.parentNode.dataset.tabs]=el.dataset.t;return render()}
  if(el=t.closest('#nav button')){S.view=el.dataset.v;return render()}
  if(el=t.closest('[data-go]')){S.view=el.dataset.go;return render()}
  if(el=t.closest('[data-act]')){const a=el.dataset.act,id=el.dataset.id;if(el.disabled)return;
    const A={alertas:openDrawer,fechar:closeModal,congelar:()=>{if(!can('congelar'))return;const m=prompt('Congelar a linha de base v1. Confirma? (motivo/observação)','Estudo REV10 + META da aba 11/12');if(m===null)return;S.t.frozen=true;S.t.hist.push({versao:1,motivo:m||'congelada',quando:new Date().toISOString(),quem:user()});log('obra','342','linha_base','aberta','v1 congelada',m);save();toast('Linha de base v1 congelada · compras liberadas');render()},
     remanejar:modalRemanejar,'rm-ok':doRemanejar,'nova-sol':()=>modalSol(el.dataset.item),'sol-ok':doSol,mapa:()=>modalMapa(id),'add-cot':()=>addCot(id),'emitir-oc':()=>emitirOC(id),
     aprovar:()=>decidir(id,true),reprovar:()=>decidir(id,false),receber:()=>modalReceber(id),'rc-ok':()=>doReceber(id),'cancelar-oc':()=>cancelarOC(id),params:modalParams,
     'params-ok':()=>{S.t.par.limite=+$('#p-l').value||0;S.t.par.tol=(+$('#p-t').value||0)/100;log('parametros','alçada','limite/tolerância','',brl(S.t.par.limite)+' / '+$('#p-t').value+'%');save();closeModal();render()},
     'nova-nf':()=>modalNF(),ratear:()=>modalNF(id),'add-lin':()=>{NF.rateio.push({item:S.D.items[0].codigo,valor:0});pintaRat()},'del-lin':()=>{NF.rateio.splice(+el.dataset.k,1);pintaRat()},
     'sug-lin':()=>{const o=S.t.ocs.find(x=>x.id===NF.oc);if(!o)return toast('Escolha um pedido');NF.rateio=[{item:o.item,valor:Math.min(+NF.valor||o.valor,o.valor)}];pintaRat()},
     'nf-ok':()=>doNF(el.dataset.modo),conferir:()=>conferir(id),liberar:()=>liberar(id),pagar:()=>pagar(id),
     reset:()=>{if(!confirm('Apagar todos os lançamentos de demonstração deste navegador?'))return;localStorage.removeItem(KEY);S.t=novoT();prep();toast('Dados restaurados');render()}};
    if(A[a])A[a]();return}
  if(el=t.closest('[data-exp]')){const c=el.dataset.exp;S.exp.has(c)?S.exp.delete(c):S.exp.add(c);return render()}
  if(el=t.closest('[data-item]')){return modalItem(el.dataset.item)}
  if(el=t.closest('[data-pac]')){return modalPac(el.dataset.pac)}
});

async function load(){
  if(window.TAF_DATA){S.src=['Arquivo único','Dados embutidos (demo)'];return window.TAF_DATA}
  const r=await fetch('data/obra342.json');if(!r.ok)throw new Error('data/obra342.json '+r.status);S.src=['Demonstração','Dados da planilha · estado salvo neste navegador'];return r.json()
}
(async()=>{
  $('#today').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  try{
    S.D=await load();S.t=loadT();prep();
    S.D.eap.filter(e=>e.nivel<=2).forEach(e=>S.exp.add(e.codigo));
    $('#obra-av').textContent=S.D.obra.codigo;$('#obra-nome').textContent=S.D.obra.contratante+' · '+S.D.obra.nome;$('#obra-sub').textContent='Centro de custo '+S.D.obra.codigo;
    $('#src-label').textContent=S.src[0];$('#src-sub').textContent=S.src[1];render();
  }catch(e){$('#view').innerHTML=`<div class="err">Não consegui carregar os dados: ${esc(e.message)}<br><span class="sub">Rode um servidor estático em <code>web/</code> ou use o arquivo único.</span></div>`}
})();
</script>
