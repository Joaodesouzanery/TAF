<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAF Obras</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23141416%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 font-family=%27Arial%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27%3ET%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f3f4; --panel:#fff; --panel-2:#f8f8f9; --line:#e8e8eb; --ink:#111113; --ink-2:#55555c; --ink-3:#8b8b93;
  --ok:#2f9e60; --ok-bg:#e6f5ec; --warn:#c98a0b; --warn-bg:#fdf3dc; --bad:#c8372d; --bad-bg:#fdeceb;
  --info:#3b63c9; --info-bg:#e8eefc; --tick-off:#d9d9de; --btn:#141416; --btn-ink:#fff;
  --r:14px; --sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0e10; --panel:#17171a; --panel-2:#1d1d21; --line:#2a2a2f; --ink:#f2f2f4; --ink-2:#b0b0b8; --ink-3:#7c7c85;
  --ok:#4cc582; --ok-bg:#12301f; --warn:#e7b04a; --warn-bg:#352a10; --bad:#ef6a5f; --bad-bg:#381815;
  --info:#7c9cf0; --info-bg:#182244; --tick-off:#34343a; --btn:#f2f2f4; --btn-ink:#111113; --sh:none}}
:root[data-theme="dark"]{
  --bg:#0e0e10; --panel:#17171a; --panel-2:#1d1d21; --line:#2a2a2f; --ink:#f2f2f4; --ink-2:#b0b0b8; --ink-3:#7c7c85;
  --ok:#4cc582; --ok-bg:#12301f; --warn:#e7b04a; --warn-bg:#352a10; --bad:#ef6a5f; --bad-bg:#381815;
  --info:#7c9cf0; --info-bg:#182244; --tick-off:#34343a; --btn:#f2f2f4; --btn-ink:#111113; --sh:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;padding:16px;gap:16px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:16px;height:calc(100vh - 32px);box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.obra-sel{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.obra-sel .av{width:32px;height:32px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:600}
.obra-sel b{display:block;font-weight:500;font-size:13px}.obra-sel span{font-size:12px;color:var(--ink-3)}
.sec{font:500 10.5px var(--mono);letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase;margin:6px 6px 0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:10px;text-align:left;color:var(--ink-2)}
.nav button:hover{background:var(--panel-2)}
.nav button.on{background:var(--panel-2);color:var(--ink);font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.nav .badge{margin-left:auto}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{font:500 10.5px var(--mono);padding:2px 7px;border-radius:999px;background:var(--panel-2);color:var(--ink-3)}
.badge.hot{background:var(--bad-bg);color:var(--bad)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.note{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--ink-3)}
.note b{color:var(--ink);font-weight:500;display:flex;gap:7px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.main{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:22px 28px 36px;min-width:0;position:relative;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:13px}
.top .sp{flex:1}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;position:relative}
.icon-btn .pip{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
h1{font-size:30px;font-weight:500;letter-spacing:-.02em;margin:26px 0 6px}
.lead{color:var(--ink-2);max-width:760px}.lead b{color:var(--ink);font-weight:600}
.head{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:10px;display:inline-flex;gap:8px;align-items:center;font-weight:500}
.btn.dark{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.card>.in{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.kpis{display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:center}
.k-l{font:500 10.5px var(--mono);letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.big{font-size:44px;font-weight:500;letter-spacing:-.03em;line-height:1.1;margin:8px 0 6px}.big small{font-size:22px;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;font:500 10.5px var(--mono);letter-spacing:.04em;padding:3px 8px;border-radius:6px;text-transform:uppercase;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.mute{background:var(--panel-2);color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.stats .v{font-size:26px;font-weight:500;letter-spacing:-.02em;margin-top:4px}
.ticks{display:flex;flex-wrap:wrap;gap:2px;margin-top:14px}
.ticks i{display:block;width:3px;height:22px;border-radius:1px;background:var(--ink)}
.ticks i.w{background:var(--warn)}.ticks i.r{background:var(--bad)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:12px}
.legend i{display:inline-block;width:3px;height:11px;margin-right:6px;vertical-align:-1px}
.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;margin-top:18px}
.tabs{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:8px;color:var(--ink-3)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tabs em{font-style:normal;color:var(--bad);margin-left:4px}
.row{display:grid;grid-template-columns:44px 1fr auto auto;gap:14px;align-items:center;padding:14px 4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row h4{margin:0;font-weight:500;font-size:14px}.row h4 .mono{color:var(--ink-3);margin-left:6px}
.row p{margin:1px 0 0;color:var(--ink-2);font-size:13px}
.row .val{text-align:right}.row .val b{font-weight:600;display:block}.row .val span{font-size:12px;color:var(--ink-3)}
.ring{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:conic-gradient(var(--c,var(--ink)) calc(var(--p)*1%),var(--tick-off) 0)}
.ring span{width:32px;height:32px;border-radius:50%;background:var(--panel);display:grid;place-items:center}
.mx h5{margin:14px 0 6px;font-weight:500;font-size:13px;display:flex;justify-content:space-between}
.mx h5 small{color:var(--ink-3);font-weight:400}.mx h5 small b{color:var(--bad);font-weight:500}
.sq{display:flex;flex-wrap:wrap;gap:2.5px}.sq i{width:8px;height:8px;border-radius:2px;background:var(--tick-off)}
.sq i.w{background:var(--warn)}.sq i.r{background:var(--bad)}
.sub{color:var(--ink-3);font-size:12.5px;margin:2px 0 4px}
.panel-t{font-weight:500;font-size:15px;margin:2px 4px}
.soon{display:grid;place-items:center;text-align:center;min-height:360px;color:var(--ink-3);gap:8px}
.soon h2{color:var(--ink);font-weight:500;margin:0}
.drawer{position:fixed;top:16px;right:16px;bottom:16px;width:380px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.18);transform:translateX(120%);transition:transform .22s ease;z-index:20;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);font-weight:500}
.drawer .list{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.alert{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel-2);display:grid;grid-template-columns:28px 1fr;gap:10px}
.alert .g{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.alert b{font-weight:500;display:block}.alert p{margin:2px 0 6px;font-size:12.5px;color:var(--ink-2)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:.2s;z-index:10}.scrim.open{opacity:1;pointer-events:auto}
.err{padding:40px;text-align:center;color:var(--bad)}
@media (max-width:1100px){.cols,.kpis{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){.app{grid-template-columns:1fr;padding:8px}.side{position:static;height:auto}.main{padding:16px}.row{grid-template-columns:44px 1fr auto}.row .val{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">T</div>TAF Obras</div>
    <div class="obra-sel"><div class="av" id="obra-av">342</div><div><b id="obra-nome">Carregando…</b><span id="obra-sub">Centro de custo</span></div></div>
    <div class="sec">Workspace</div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div class="note"><b><span class="dot"></span><span id="src-label">Dados locais</span></b><span id="src-sub">Planilhas importadas</span></div>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span id="crumb">Hoje</span><span class="sp"></span><span id="today"></span>
      <button class="icon-btn" id="bell" aria-label="Notificações"><svg class="ic" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><span class="pip" id="pip"></span></button>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"><header>Alertas da obra<button class="btn" id="close" style="padding:4px 10px">Fechar</button></header><div class="list" id="alerts"></div></aside>

<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
const brl=(v,c=false)=>c&&Math.abs(v)>=1e6?'R$ '+(v/1e6).toFixed(2).replace('.',',')+' mi':c&&Math.abs(v)>=1e3?'R$ '+Math.round(v/1e3).toLocaleString('pt-BR')+' mil':(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pct=v=>(v*100).toFixed(1).replace('.',',')+'%';
const ICON={
 hoje:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 eap:'<path d="M4 6h16M4 12h10M4 18h6"/>',pac:'<path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8"/>',
 compras:'<path d="M5 6h15l-1.5 9h-12zM5 6L4 3H2M9 20a1 1 0 1 0 0 .01M17 20a1 1 0 1 0 0 .01"/>',
 nota:'<path d="M7 3h8l4 4v14H7zM15 3v4h4M10 12h6M10 16h6"/>',pain:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>'};
const NAV=[['hoje','Hoje','hoje'],['eap','Orçamento (EAP)','eap',2],['pac','Pacotes','pac',2],['compras','Compras','compras',3],['nota','Notas e rateio','nota',4],['pain','Painéis','pain',5]];
let S={view:'hoje',tab:'fechar',data:null};

async function load(){
  const C=window.TAF_CONFIG;
  if(C&&C.supabaseUrl&&C.supabaseKey){
    const h={apikey:C.supabaseKey,Authorization:'Bearer '+C.supabaseKey};
    const g=t=>fetch(`${C.supabaseUrl}/rest/v1/${t}`,{headers:h}).then(r=>{if(!r.ok)throw new Error(t+' '+r.status);return r.json()});
    const [obra,pacotes,eap]=await Promise.all([g('obra?select=*&limit=1'),g('pacote?select=*'),g('item_eap?select=*&order=codigo&limit=2000')]);
    const pc=Object.fromEntries(pacotes.map(p=>[p.id,p.codigo]));
    eap.forEach(e=>{e.pacote=pc[e.pacote_id];e.pai=e.pai_codigo;e.tipo_linha=e.eh_item?'item':'grupo';[ 'meta_total','teto_total','preco_venda_total'].forEach(k=>e[k]=e[k]==null?e[k]:+e[k])});
    pacotes.forEach(p=>{p.meta=+p.meta;p.teto=+p.teto});
    S.src=['Supabase','Banco conectado'];
    return {obra:obra[0],pacotes,eap,relatorio:{}};
  }
  const r=await fetch('data/obra342.json');if(!r.ok)throw new Error('data/obra342.json '+r.status);
  S.src=['Dados locais','Planilhas importadas (demo)'];
  return r.json();
}

function derive(D){
  const items=D.eap.filter(e=>e.tipo_linha==='item');
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const dias=s=>s?Math.round((new Date(s+'T00:00:00')-hoje)/864e5):null;
  const semFolga=items.filter(i=>i.meta_total>i.teto_total);
  const aCotar=items.filter(i=>i.status_cotacao==='A cotar');
  const porPac={};items.forEach(i=>(porPac[i.pacote]=porPac[i.pacote]||[]).push(i));
  D.pacotes.forEach(p=>{const it=porPac[p.codigo]||[];p._it=it;p._dias=dias(p.fechar_ate);
    p._cot=it.filter(i=>i.status_cotacao==='A cotar').length;p._pctCot=it.length?1-p._cot/it.length:1;p._semFolga=it.filter(i=>i.meta_total>i.teto_total).length;
    p._acima=p.meta>p.teto});
  const meta=items.reduce((s,i)=>s+i.meta_total,0),teto=items.reduce((s,i)=>s+i.teto_total,0),venda=items.reduce((s,i)=>s+i.preco_venda_total,0);
  const vencidos=D.pacotes.filter(p=>p._dias!=null&&p._dias<0&&p._it.length);
  const prox=D.pacotes.filter(p=>p._dias!=null&&p._dias>=0&&p._dias<=30);
  return {items,semFolga,aCotar,meta,teto,venda,vencidos,prox,dias};
}

function alerts(D,X){
  const a=[];
  if(!D.obra.linha_base_congelada&&!(D.obra.linha_base&&D.obra.linha_base.congelada))
    a.push(['bad','Linha de base não congelada','Sem linha de base congelada a obra não deve abrir compra (E01). Congele a versão 1 na Fase 2.']);
  X.vencidos.forEach(p=>a.push(['bad',`Pacote ${p.codigo}: fechar até ${p.fechar_ate} vencido`,`Venceu há ${-p._dias} dia(s), ${brl(p.meta,true)} de meta. Vira restrição na frente que depende dele.`]));
  D.pacotes.filter(p=>p._acima).forEach(p=>a.push(['bad',`Pacote ${p.codigo}: meta acima do teto`,`Meta ${brl(p.meta)} × teto ${brl(p.teto)}. A solicitação nasce vermelha e só a diretoria aprova.`]));
  a.push(['warn',`${X.aCotar.length} itens sem cotação`,`${brl(X.aCotar.reduce((s,i)=>s+i.meta_total,0),true)} do custo-meta ainda é estimativa.`]);
  a.push(['warn',`${X.semFolga.length} itens com meta acima do teto`,'Sem folga: qualquer compra nesses itens fica vermelha.']);
  const r=D.relatorio||{};
  if(r.diferenca_contrato)a.push(['info','Soma da EAP diverge do contrato',`Diferença de ${brl(r.diferenca_contrato)} entre a soma dos itens e o valor do contrato.`]);
  if(r.aviso)a.push(['info','Versão da META a confirmar',r.aviso]);
  return a;
}

const svg=n=>`<svg class="ic" viewBox="0 0 24 24">${ICON[n]||''}</svg>`;
function renderNav(D,X){
  $('#nav').innerHTML=NAV.map(([k,l,i,f])=>`<button class="${S.view===k?'on':''}" data-v="${k}">${svg(i)}${l}${f?`<span class="badge">F${f}</span>`:''}</button>`).join('');
  $('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.view=b.dataset.v;render()};
}
function ticks(items){
  return items.map(i=>`<i class="${i.meta_total>i.teto_total?'r':i.status_cotacao==='A cotar'?'w':''}" title="${i.codigo}"></i>`).join('');
}
function ring(p,c){return `<div class="ring" style="--p:${Math.round(p*100)};--c:${c}"><span>${Math.round(p*100)}</span></div>`}
function pacRow(p,X){
  const d=p._dias;
  const pill=d==null?'':d<0?`<span class="pill bad">Vencido ${-d}d</span>`:d<=7?`<span class="pill warn">Em ${d} dias</span>`:`<span class="pill ok">Em ${d} dias</span>`;
  const c=p._acima?'var(--bad)':p._cot?'var(--warn)':'var(--ok)';
  return `<div class="row">${ring(p._pctCot,c)}
   <div><h4>${p.nome}<span class="mono">${p.codigo}</span></h4>
   <p>${p._it.length} ${p._it.length===1?'item':'itens'} · ${p._cot?p._cot+' sem cotação':'todos cotados'}${p._semFolga?` · ${p._semFolga} sem folga`:''}</p></div>
   <div>${p._acima?'<span class="pill bad">Meta &gt; teto</span> ':''}${pill}</div>
   <div class="val"><b>${brl(p.meta,true)}</b><span>teto ${brl(p.teto,true)}</span></div></div>`;
}
function viewHoje(D,X){
  const ord=[...D.pacotes].filter(p=>p._it.length).sort((a,b)=>(a.fechar_ate||'9').localeCompare(b.fechar_ate||'9'));
  const lists={fechar:ord.filter(p=>p._dias!=null&&p._dias<=30),todos:ord,cotar:ord.filter(p=>p._cot)};
  const nf=lists.fechar.length;
  const rows=(lists[S.tab]||[]).map(p=>pacRow(p,X)).join('')||'<div class="sub" style="padding:18px">Nada por aqui.</div>';
  const folga=X.items.reduce((s,i)=>s+Math.max(0,i.teto_total-i.meta_total),0);
  const mx=ord.slice(0,6).map(p=>`<div class="mx"><h5>${p.nome}<small>${p._semFolga?`<b>${p._semFolga} sem folga</b> · `:''}${p._it.length-p._cot}/${p._it.length}</small></h5><div class="sq">${ticks(p._it).replace(/<i/g,'<i')}</div></div>`).join('');
  return `
  <div class="head"><div><h1>Bom dia</h1>
   <p class="lead"><b>${X.vencidos.length} pacotes</b> com data de fechar vencida, <b>${X.aCotar.length} itens</b> ainda sem cotação (${brl(X.aCotar.reduce((s,i)=>s+i.meta_total,0),true)}) e <b>${X.semFolga.length} itens</b> com meta acima do teto na obra ${D.obra.codigo}.</p></div>
   <button class="btn dark" data-v="alert">Ver alertas ${S.n?`<span class="badge hot">${S.n}</span>`:''}</button></div>
  <div class="card" style="margin-top:22px"><div class="in kpis">
   <div><div class="k-l">Meta de custo</div><div class="big">${brl(X.meta,true).replace('R$ ','')}</div>
    <span class="pill ${folga>0?'ok':'bad'}">Folga ${brl(folga,true)}</span> <span class="sub">entre a meta e o teto, nos ${X.items.length-X.semFolga.length} itens com folga</span></div>
   <div><div class="stats">
     <div><div class="k-l">Itens</div><div class="v">${X.items.length}</div></div>
     <div><div class="k-l">Preço licitado</div><div class="v">${brl(X.venda,true)}</div></div>
     <div><div class="k-l">Teto (margem zero)</div><div class="v" style="color:var(--ink)">${brl(X.teto,true)}</div></div>
     <div><div class="k-l">Sem cotação</div><div class="v" style="color:var(--warn)">${X.aCotar.length}</div></div></div>
    <div class="ticks">${ticks(X.items)}</div>
    <div class="legend"><span><i style="background:var(--ink)"></i>Cotado / orçado</span><span><i style="background:var(--warn)"></i>Estimado, sem cotação</span><span><i style="background:var(--bad)"></i>Meta acima do teto</span><span style="margin-left:auto">Cada marca é um item da EAP</span></div></div>
  </div></div>
  <div class="cols">
   <div class="card"><div class="in">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
     <div class="tabs" id="tabs"><button data-t="fechar" class="${S.tab==='fechar'?'on':''}">A fechar em 30 dias <em>${nf}</em></button><button data-t="cotar" class="${S.tab==='cotar'?'on':''}">Sem cotação</button><button data-t="todos" class="${S.tab==='todos'?'on':''}">Todos ${ord.length}</button></div>
     <span class="sub">Por data de fechar</span></div>${rows}</div></div>
   <div class="card"><div class="in mx"><div class="panel-t">Matriz de metas por pacote</div><div class="sub">Um quadrado por item · próximos pacotes a fechar</div>${mx}</div></div>
  </div>`;
}
function viewSoon(k){
  const [,l,,f]=NAV.find(n=>n[0]===k);
  const t={2:'Árvore da EAP, pacotes e versões da linha de base.',3:'Solicitação, cotação e OC com semáforo e alçadas.',4:'Nota fiscal, rateio fechando 100% e saldos por item.',5:'Painéis de compras, obra e carteira.'}[f];
  return `<div class="soon"><div><span class="pill info">Fase ${f}</span></div><h2>${l}</h2><div>${t}</div></div>`;
}
function render(){
  const D=S.data,X=S.X;renderNav(D,X);
  $('#crumb').textContent=(NAV.find(n=>n[0]===S.view)||NAV[0])[1];
  $('#view').innerHTML=S.view==='hoje'?viewHoje(D,X):viewSoon(S.view);
  const t=$('#tabs');if(t)t.onclick=e=>{const b=e.target.closest('button');if(b){S.tab=b.dataset.t;render()}};
  const bt=document.querySelector('[data-v=alert]');if(bt)bt.onclick=openDrawer;
}
function openDrawer(){$('#drawer').classList.add('open');$('#scrim').classList.add('open')}
function closeDrawer(){$('#drawer').classList.remove('open');$('#scrim').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
$('#bell').onclick=openDrawer;$('#close').onclick=closeDrawer;$('#scrim').onclick=closeDrawer;

(async()=>{
  $('#today').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  try{
    const D=await load();S.data=D;S.X=derive(D);
    $('#obra-av').textContent=D.obra.codigo;$('#obra-nome').textContent=`${D.obra.contratante||''} · ${D.obra.nome}`.replace(/^ · /,'');
    $('#obra-sub').textContent='Centro de custo '+D.obra.codigo;
    $('#src-label').textContent=S.src[0];$('#src-sub').textContent=S.src[1];
    const al=alerts(D,S.X);S.n=al.filter(a=>a[0]==='bad').length;
    $('#pip').style.display=S.n?'block':'none';
    const G={bad:'var(--bad)',warn:'var(--warn)',info:'var(--info)'};
    $('#alerts').innerHTML=al.map(([k,t,p])=>`<div class="alert"><div class="g" style="color:${G[k]}"><svg class="ic" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div><div><b>${t}</b><p>${p}</p><span class="pill ${k==='info'?'info':k}">${k==='bad'?'Crítico':k==='warn'?'Atenção':'Info'}</span></div></div>`).join('');
    render();
  }catch(e){$('#view').innerHTML=`<div class="err">Não consegui carregar os dados: ${e.message}<br><span class="sub">Rode um servidor estático em <code>web/</code> (ex.: <code>python3 -m http.server</code>).</span></div>`}
})();
</script>
</body>
</html>
