<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAF Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23141416%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 font-family=%27Arial%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27%3ET%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f3f4; --panel:#fff; --panel-2:#f8f8f9; --line:#e8e8eb; --ink:#111113; --ink-2:#55555c; --ink-3:#8b8b93;
  --ok:#2f9e60; --ok-bg:#e6f5ec; --warn:#c98a0b; --warn-bg:#fdf3dc; --bad:#c8372d; --bad-bg:#fdeceb;
  --info:#3b63c9; --info-bg:#e8eefc; --tick-off:#d9d9de; --btn:#141416; --btn-ink:#fff;
  --r:14px; --sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0e10; --panel:#17171a; --panel-2:#1d1d21; --line:#2a2a2f; --ink:#f2f2f4; --ink-2:#b0b0b8; --ink-3:#7c7c85;
  --ok:#4cc582; --ok-bg:#12301f; --warn:#e7b04a; --warn-bg:#352a10; --bad:#ef6a5f; --bad-bg:#381815;
  --info:#7c9cf0; --info-bg:#182244; --tick-off:#34343a; --btn:#f2f2f4; --btn-ink:#111113; --sh:none}}
:root[data-theme="dark"]{
  --bg:#0e0e10; --panel:#17171a; --panel-2:#1d1d21; --line:#2a2a2f; --ink:#f2f2f4; --ink-2:#b0b0b8; --ink-3:#7c7c85;
  --ok:#4cc582; --ok-bg:#12301f; --warn:#e7b04a; --warn-bg:#352a10; --bad:#ef6a5f; --bad-bg:#381815;
  --info:#7c9cf0; --info-bg:#182244; --tick-off:#34343a; --btn:#f2f2f4; --btn-ink:#111113; --sh:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;padding:16px;gap:16px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:16px;height:calc(100vh - 32px);box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.obra-sel{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.obra-sel .av{width:32px;height:32px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:600}
.obra-sel b{display:block;font-weight:500;font-size:13px}.obra-sel span{font-size:12px;color:var(--ink-3)}
.sec{font:500 10.5px var(--mono);letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase;margin:6px 6px 0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:10px;text-align:left;color:var(--ink-2)}
.nav button:hover{background:var(--panel-2)}
.nav button.on{background:var(--panel-2);color:var(--ink);font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.nav .badge{margin-left:auto}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{font:500 10.5px var(--mono);padding:2px 7px;border-radius:999px;background:var(--panel-2);color:var(--ink-3)}
.badge.hot{background:var(--bad-bg);color:var(--bad)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.note{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--ink-3)}
.note b{color:var(--ink);font-weight:500;display:flex;gap:7px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.main{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:22px 28px 36px;min-width:0;position:relative;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:13px}
.top .sp{flex:1}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;position:relative}
.icon-btn .pip{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
h1{font-size:30px;font-weight:500;letter-spacing:-.02em;margin:26px 0 6px}
.lead{color:var(--ink-2);max-width:760px}.lead b{color:var(--ink);font-weight:600}
.head{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:10px;display:inline-flex;gap:8px;align-items:center;font-weight:500}
.btn.dark{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.card>.in{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.kpis{display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:center}
.k-l{font:500 10.5px var(--mono);letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.big{font-size:44px;font-weight:500;letter-spacing:-.03em;line-height:1.1;margin:8px 0 6px}.big small{font-size:22px;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;font:500 10.5px var(--mono);letter-spacing:.04em;padding:3px 8px;border-radius:6px;text-transform:uppercase;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.mute{background:var(--panel-2);color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.stats .v{font-size:26px;font-weight:500;letter-spacing:-.02em;margin-top:4px}
.ticks{display:flex;flex-wrap:wrap;gap:2px;margin-top:14px}
.ticks i{display:block;width:3px;height:22px;border-radius:1px;background:var(--ink)}
.ticks i.w{background:var(--warn)}.ticks i.r{background:var(--bad)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:12px}
.legend i{display:inline-block;width:3px;height:11px;margin-right:6px;vertical-align:-1px}
.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;margin-top:18px}
.tabs{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:8px;color:var(--ink-3)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tabs em{font-style:normal;color:var(--bad);margin-left:4px}
.row{display:grid;grid-template-columns:44px 1fr auto auto;gap:14px;align-items:center;padding:14px 4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row h4{margin:0;font-weight:500;font-size:14px}.row h4 .mono{color:var(--ink-3);margin-left:6px}
.row p{margin:1px 0 0;color:var(--ink-2);font-size:13px}
.row .val{text-align:right}.row .val b{font-weight:600;display:block}.row .val span{font-size:12px;color:var(--ink-3)}
.ring{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:conic-gradient(var(--c,var(--ink)) calc(var(--p)*1%),var(--tick-off) 0)}
.ring span{width:32px;height:32px;border-radius:50%;background:var(--panel);display:grid;place-items:center}
.mx h5{margin:14px 0 6px;font-weight:500;font-size:13px;display:flex;justify-content:space-between}
.mx h5 small{color:var(--ink-3);font-weight:400}.mx h5 small b{color:var(--bad);font-weight:500}
.sq{display:flex;flex-wrap:wrap;gap:2.5px}.sq i{width:8px;height:8px;border-radius:2px;background:var(--tick-off)}
.sq i.w{background:var(--warn)}.sq i.r{background:var(--bad)}
.sub{color:var(--ink-3);font-size:12.5px;margin:2px 0 4px}
.panel-t{font-weight:500;font-size:15px;margin:2px 4px}
.soon{display:grid;place-items:center;text-align:center;min-height:360px;color:var(--ink-3);gap:8px}
.soon h2{color:var(--ink);font-weight:500;margin:0}
.drawer{position:fixed;top:16px;right:16px;bottom:16px;width:380px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.18);transform:translateX(120%);transition:transform .22s ease;z-index:20;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);font-weight:500}
.drawer .list{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.alert{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel-2);display:grid;grid-template-columns:28px 1fr;gap:10px}
.alert .g{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.alert b{font-weight:500;display:block}.alert p{margin:2px 0 6px;font-size:12.5px;color:var(--ink-2)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:.2s;z-index:10}.scrim.open{opacity:1;pointer-events:auto}
.err{padding:40px;text-align:center;color:var(--bad)}
@media (max-width:1100px){.cols,.kpis{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr);padding:8px}.side,.main{min-width:0}.side{position:static;height:auto}.side{padding:10px;gap:8px;border-radius:16px}.side .sec,.side .note{display:none}.nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px;-webkit-overflow-scrolling:touch}.nav button{white-space:nowrap;flex:none;padding:8px 12px}.obra-sel{padding:8px}.side .foot{margin-top:0}.side .foot label{display:none}.main{padding:16px}.row{grid-template-columns:44px 1fr auto}.row .val{display:none}}

.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:13px}
.tbl th{font:500 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:6px 10px;background:var(--panel-2)}
.tbl th:first-child{border-radius:8px 0 0 8px}.tbl th:last-child{border-radius:0 8px 8px 0}
.tbl td{padding:9px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);vertical-align:middle}
.tbl td:first-child{border-left:1px solid var(--line);border-radius:10px 0 0 10px}.tbl td:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}
.tbl tr.grp td{background:var(--panel-2);font-weight:500}.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover td{background:var(--panel-2)}
.r{text-align:right;white-space:nowrap}.mut{color:var(--ink-3)}.neg{color:var(--bad)}.pos{color:var(--ok)}
.tw{overflow:auto;margin-top:8px}
.bar{height:6px;border-radius:3px;background:var(--tick-off);overflow:hidden;min-width:70px;display:flex}
.bar i{display:block;height:100%}.bar .a{background:var(--info)}.bar .b{background:var(--ink)}.bar .c{background:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--info);outline-offset:-1px}
label{display:block;font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:12px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;place-items:start center;padding:5vh 16px;z-index:40;overflow:auto}
.modal.open{display:grid}.mbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(720px,100%);box-shadow:0 30px 80px rgba(0,0,0,.25)}
.mbox h3{margin:0 0 4px;font-weight:500;font-size:18px}.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.btn[disabled]{opacity:.45;cursor:not-allowed}.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}.btn.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.btn.no{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.sem{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;margin-top:12px;border:1px solid var(--line)}
.sem.verde{background:var(--ok-bg);color:var(--ok)}.sem.amarelo{background:var(--warn-bg);color:var(--warn)}.sem.vermelho,.sem.bloqueado{background:var(--bad-bg);color:var(--bad)}
.sem b{font-weight:600}.sem span{color:var(--ink-2);font-size:12.5px}
.who{width:100%}.search{max-width:280px}
.bar-fecha{height:10px;border-radius:5px;background:var(--tick-off);overflow:hidden;margin-top:8px}.bar-fecha i{display:block;height:100%;background:var(--ok);transition:width .15s}
.bar-fecha.bad i{background:var(--bad)}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:14px 0 4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:10px;z-index:60;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.chev{display:inline-block;width:14px;color:var(--ink-3)}
.pr{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-top:6px}
@media (max-width:820px){.pr{grid-template-columns:1fr 1fr}input,select,textarea{min-height:44px;font-size:16px}}
.kpi4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.kpi4>div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.kpi4 .v{font-size:22px;font-weight:500;letter-spacing:-.02em;margin-top:3px}
@media (max-width:820px){.g2,.g3,.kpi4{grid-template-columns:1fr 1fr}}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.pk{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);min-width:0}
.pk .v{font-size:19px;font-weight:500;letter-spacing:-.02em;margin-top:2px}
.pk.big{background:var(--panel-2)}.pk.big .v{font-size:22px}.pk.bad .v{color:var(--bad)}
@media (max-width:820px){.pgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">T</div>TAF Admin</div>
    <div class="obra-sel" data-act="obras" role="button" tabindex="0" title="Trocar de obra" style="cursor:pointer"><div class="av" id="obra-av">342</div><div><b id="obra-nome">Carregando…</b><span id="obra-sub">Centro de custo</span></div></div>
    <div class="sec">Workspace</div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div id="userbox" style="display:none"></div>
      <div><label style="margin-top:0">Entrar como</label><select id="role"></select></div>
      <div class="note"><b><span class="dot"></span><span id="src-label"></span></b><span id="src-sub"></span></div>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span id="crumb">Hoje</span><span class="sp"></span><span id="today"></span>
      <button class="icon-btn" id="bell" aria-label="Alertas"><svg class="ic" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><span class="pip" id="pip"></span></button>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"><header>Alertas da obra<button class="btn sm" id="close">Fechar</button></header><div class="list" id="alerts"></div></aside>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="modal" id="login" style="z-index:80;background:var(--bg)"><div class="mbox" id="lbox" style="width:min(420px,100%)"></div></div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script>
/* ============ util ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=(v,c=false)=>{v=+v||0;return c&&Math.abs(v)>=1e6?'R$ '+(v/1e6).toFixed(2).replace('.',',')+' mi':c&&Math.abs(v)>=1e3?'R$ '+Math.round(v/1e3).toLocaleString('pt-BR')+' mil':v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})};
const num=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
const r2=v=>Math.round((+v||0)*100)/100;
const hojeISO=()=>new Date().toISOString().slice(0,10);
const diasAte=s=>s?Math.round((new Date(s+'T00:00:00')-new Date(hojeISO()+'T00:00:00'))/864e5):null;
const fdata=s=>s?s.split('-').reverse().join('/'):'—';
const ico=n=>`<svg class="ic" viewBox="0 0 24 24">${ICON[n]||''}</svg>`;
const ICON={campo:'<path d="M3 21h18M5 21V10l7-6 7 6v11M10 21v-6h4v6"/>',lean:'<path d="M4 6h16M4 12h16M4 18h10M17 17l2 2 3-4"/>',hoje:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 eap:'<path d="M4 6h16M4 12h10M4 18h6"/>',pac:'<path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8"/>',
 compras:'<path d="M5 6h15l-1.5 9h-12zM5 6L4 3H2M9 20a1 1 0 1 0 0 .01M17 20a1 1 0 1 0 0 .01"/>',
 nota:'<path d="M7 3h8l4 4v14H7zM15 3v4h4M10 12h6M10 16h6"/>',pain:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',fin:'<path d="M3 7h18v12H3zM3 11h18M7 15h3"/>',med:'<path d="M3 17l5-5 4 4 8-9"/>',plano:'<path d="M4 5h16M4 10h12M4 15h8M4 20h4"/>',aud:'<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/>'};

const ACOES={};/* ações registradas pelos módulos novos (Fase 13+) */
/* ============ papéis ============ */
const ROLES={gestao:{n:'Gestão da carteira',u:'Felipe'},diretoria:{n:'Diretoria',u:'Thadeu'},gerente:{n:'Gerente de contrato',u:'Tiago Marinho'},
 engenheiro:{n:'Engenheiro residente',u:'Marko Aurélio'},compras:{n:'Compras e suprimentos',u:'Compras'},almox:{n:'Almoxarife',u:'Almoxarife'},
 adm:{n:'Administrativo de obra',u:'Administrativo'},financeiro:{n:'Financeiro',u:'Financeiro'},
 encarregado:{n:'Encarregado de campo',u:'Encarregado'},planejamento:{n:'Planejamento',u:'Planejamento'},

const fmtNum=(k,n)=>PX[k]+'-'+String(n).padStart(4,'0');
/* Numeração: com banco compartilhado os números vêm de faixas reservadas no servidor (sem repetir entre pessoas); sem sinal ou no modo aberto, maior número local + 1. */
function nextNum(k){
  if(MODO_SB&&SB.pool&&SB.pool[k]&&SB.pool[k].length){const n=SB.pool[k].shift();if(SB.pool[k].length<5)sbPool(k);return fmtNum(k,n)}
  const arr={sol:S.t.sols,oc:S.t.ocs,nf:S.t.notas,bm:S.t.meds,apt:S.t.apts,rst:S.t.rsts,tar:S.t.tars,bc:S.t.bcs,fat:S.t.fats}[k];
  const mx=arr.reduce((m,o)=>Math.max(m,parseInt(String(o.num||'').replace(/\D/g,''))||0),0);if(MODO_SB)sbPool(k);return fmtNum(k,mx+1)}
const ocFat=oc=>S.t.notas.filter(n=>n.oc===oc.id&&n.status!=='lancada').reduce((s,n)=>s+n.rateio.reduce((a,l)=>a+ +l.valor,0),0);
const ocRecebido=oc=>r2(oc.preco*(oc.recebido||0));
/* ============ derivados ============ */
function derive(){
  const D=S.D,X={};saldos();
  const it=D.items;
  X.meta=it.reduce((s,i)=>s+i.meta_total,0);X.venda=it.reduce((s,i)=>s+i.preco_venda_total,0);X.teto=it.reduce((s,i)=>s+i.teto_total,0);
  X.comp=it.reduce((s,i)=>s+S.sd[i.codigo].comp,0);X.real=it.reduce((s,i)=>s+S.sd[i.codigo].real,0);
  X.aCotar=it.filter(i=>i.status_cotacao==='A cotar');X.semFolga=it.filter(i=>i.meta_total>i.teto_total);
  D.pacotes.forEach(p=>{p._dias=diasAte(p.fechar_ate);p._cot=p._it.filter(i=>i.status_cotacao==='A cotar').length;p._pctCot=p._it.length?1-p._cot/p._it.length:1;
    p._semFolga=p._it.filter(i=>i.meta_total>i.teto_total).length;p._acima=p.meta>p.teto;
    p._meta=p._it.reduce((s,i)=>s+i.meta_total,0);p._comp=p._it.reduce((s,i)=>s+S.sd[i.codigo].comp,0);p._real=p._it.reduce((s,i)=>s+S.sd[i.codigo].real,0);
    p._temOC=S.t.ocs.some(o=>S.byCod[o.item]?.pacote===p.codigo&&o.status!=='cancelada'&&o.status!=='reprovada')});
  X.vencidos=D.pacotes.filter(p=>p._dias!=null&&p._dias<0&&p._it.length&&!p._temOC);
  X.pendAprov=S.t.ocs.filter(o=>o.status==='em_alcada');
  X.semRateio=S.t.notas.filter(n=>n.status==='lancada');
  X.semPedido=S.t.notas.filter(n=>!n.oc);
  X.economia=S.t.ocs.filter(o=>['aprovada','recebida_parcial','recebida'].includes(o.status)).reduce((s,o)=>{const i=S.byCod[o.item];return s+(i.meta_unit*o.qtd-o.valor)},0);
  return X;
}
/* ============ alertas ============ */
function alertas(X){
  const a=[];
  if(!S.t.frozen)a.push(['bad','Linha de base não congelada','Compras bloqueadas até a Gestão congelar a versão 1 (E01).']);
  X.vencidos.forEach(p=>a.push(['bad',`Pacote ${p.codigo}: fechar até ${fdata(p.fechar_ate)} vencido`,`${-p._dias} dia(s) de atraso, sem pedido. ${brl(p.meta,true)} de meta; vira restrição na frente.`]));
  S.D.pacotes.filter(p=>p._acima).forEach(p=>a.push(['bad',`Pacote ${p.codigo}: meta acima do teto`,`Meta ${brl(p.meta)} × teto ${brl(p.teto)}. Solicitação nasce vermelha.`]));
  X.pendAprov.forEach(o=>a.push([o.alcada==='diretoria'?'bad':'warn',`${o.num} aguarda ${ROLES[o.alcada].n}`,`${brl(o.valor)} · ${o.item} · ${esc(o.forn)}`]));
  X.semRateio.forEach(n=>a.push(['warn',`${n.num} sem rateio`,`${esc(n.emitente)} · ${brl(n.valor)}. Não entra no custo do item.`]));
  X.semPedido.filter(n=>n.status!=='paga').forEach(n=>a.push(['warn',`${n.num} sem pedido`,`Alerta de governança: ${esc(n.justSemOC||'sem justificativa')}`]));
  S.t.notas.filter(n=>n.status==='divergente').forEach(n=>a.push(['bad',`${n.num} divergente do pedido`,'Pagamento bloqueado até Compras resolver.']));
  S.t.meds.filter(m=>m.status==='lancada').forEach(m=>a.push(['warn',`${m.num} aguarda atesto`,`${m.item} · ${num(m.qtd)} medidos por ${esc(m.quem)}`]));
  S.t.titulos.filter(t=>!t.cancelado&&t.venc<hojeISO()&&tituloInfo(t).saldo>0).forEach(t=>a.push(['bad',`Título ${t.ocNum} vencido`,`${esc(t.forn)} · saldo ${brl(tituloInfo(t).saldo)}`]));
  S.D.items.forEach(i=>{const r=resItem(i);if(r.sem==='bad')a.push(['bad',`Item ${i.codigo}: ${r.txt}`,`Receita ${brl(r.rec)} × custo ${brl(r.real)}${r.idc!=null?' · IDC '+r.idc.toFixed(2).replace('.',','):''}`])});
  restAb().filter(escalada).forEach(r=>a.push(['bad','Restrição escalada: '+r.desc,`${r.dono} · parada há ${duDesde(r.atualizada||r.criada)} dias úteis`]));
  if(S.t.frozen&&!S.t.apts.some(x=>x.data===ontemUtil()))a.push(['warn','Sem apontamento no último dia útil',fdata(ontemUtil())+': lance ou justifique em Campo.']);
  S.t.apts.filter(x=>x.status==='conferido').forEach(x=>a.push(['warn',x.num+' aguarda aprovação',x.item+' · '+num(x.qtd)+' apontados']));
  S.t.bcs.filter(x=>x.status==='aprovado').forEach(x=>a.push(['warn',x.num+' aprovado e não faturado',brl(bcAprov(x))+': emita a NF de serviço.']));
  S.t.fats.filter(f=>fatSaldo(f)>0&&f.venc<hojeISO()).forEach(f=>a.push(['bad','NF '+f.num+' vencida sem recebimento','Saldo '+brl(fatSaldo(f))]));
  if(medsLivres().length)a.push(['info',medsLivres().length+' medição(ões) atestada(s) sem boletim',brl(medsLivres().reduce((q,m)=>q+medValor(m),0))+' a medir ao cliente.']);
  {const c=caixa();if(c.minAcc<0)a.push(['bad','Caixa projetado negativo','Exposição máxima '+brl(c.minAcc)])}
  a.push(['warn',`${X.aCotar.length} itens sem cotação`,`${brl(X.aCotar.reduce((s,i)=>s+i.meta_total,0),true)} do custo-meta é estimativa.`]);
  a.push(['warn',`${X.semFolga.length} itens com meta acima do teto`,'Sem folga: qualquer compra neles fica vermelha.']);
  if(S.D.relatorio?.aviso)a.push(['info','Versão da META a confirmar',S.D.relatorio.aviso]);
  return a;
}

/* ============ LEAN (Fase 8) ============ */
const CAUSAS=['Material não chegou','Projeto ou definição','Equipamento indisponível','Falta de mão de obra','Chuva','Cliente ou liberação','Retrabalho','Planejamento falho','Outro'];
const TIPOS_R=['Material','Projeto','Equipamento','Mão de obra','Liberação do cliente','Licença','Financeiro','Outro'];
const restAb=()=>S.t.rsts.filter(r=>r.status==='aberta');
const escalada=r=>r.status==='aberta'&&duDesde(r.atualizada||r.criada)>=3;
const donoAb=d=>restAb().filter(r=>r.dono===d).length;
const bloqItem=cod=>restAb().filter(r=>r.item===cod);
function ppcSemanas(){const m={};S.t.atvs.forEach(a=>{if(a.status!=='cumprida'&&a.status!=='nao_cumprida')return;const w=m[a.semana]=m[a.semana]||{c:0,n:0};a.status==='cumprida'?w.c++:w.n++});
  return Object.entries(m).sort().map(([s,w])=>({semana:s,...w,ppc:w.c/(w.c+w.n)}))}
const ppcPill=p=>`<span class="pill ${p>=.8?'ok':p>=.6?'warn':'bad'}">${Math.round(p*100)}%</span>`;
function pareto(){const m={};S.t.atvs.filter(a=>a.status==='nao_cumprida').forEach(a=>m[a.causa||'Outro']=(m[a.causa||'Outro']||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function restAuto(X){return X.vencidos.map(p=>({auto:true,id:'auto-'+p.codigo,tipo:'Material',desc:`Pacote ${p.nome}: fechar até ${fdata(p.fechar_ate)} vencido, sem pedido`,dono:p.responsavel||'Compras',prazo:p.fechar_ate,valor:p.meta,status:'aberta'}))}
function viewLean(X){
  const tab=S.tab.lean||'pauta',T=S.t,ab=restAb(),esc3=ab.filter(escalada),auto=restAuto(X);
  const seg=segunda(hojeISO()),segAnt=addDias(seg,-7),pp=ppcSemanas(),ppAnt=pp.find(w=>w.semana===segAnt);
  let b='';
  if(tab==='pauta'){
    const sem=T.atvs.filter(a=>a.semana===seg),ven=T.tars.filter(t=>t.status!=='feito'&&t.quando&&t.quando<hojeISO());
    b=`<div class="kpi4"><div><div class="k-l">PPC semana anterior</div><div class="v">${ppAnt?Math.round(ppAnt.ppc*100)+'%':'—'}</div></div><div><div class="k-l">Restrições abertas</div><div class="v ${esc3.length?'neg':''}">${ab.length+auto.length}</div></div><div><div class="k-l">Escaladas (3+ dias úteis)</div><div class="v ${esc3.length?'neg':''}">${esc3.length}</div></div><div><div class="k-l">Atividades da semana</div><div class="v">${sem.length}</div></div></div>
    <div class="cols" style="margin-top:14px"><div class="card"><div class="in"><div class="panel-t">Compromissos da semana (${fdata(seg)})</div>${sem.length?sem.map(a=>`<div class="row" style="grid-template-columns:1fr auto"><div><h4>${esc(a.desc)}</h4><p class="mono">${a.item}</p></div>${atvPill(a)}</div>`).join(''):'<div class="sub">Nenhuma atividade prometida. Use Lookahead.</div>'}</div></div>
    <div class="card"><div class="in"><div class="panel-t">Para decidir na segunda</div>
     ${[...esc3.map(r=>`<div class="row" style="grid-template-columns:1fr auto"><div><h4>${esc(r.desc)}</h4><p>${esc(r.dono)} · escalada, parada há ${duDesde(r.atualizada||r.criada)} dias úteis</p></div><span class="pill bad">Escalar</span></div>`),
       ...X.vencidos.slice(0,4).map(p=>`<div class="row" style="grid-template-columns:1fr auto"><div><h4>Pacote ${esc(p.nome)} sem pedido</h4><p>fechar até ${fdata(p.fechar_ate)}</p></div><span class="pill bad">Vencido</span></div>`),
       ...ven.map(t=>`<div class="row" style="grid-template-columns:1fr auto"><div><h4>${esc(t.oque)}</h4><p>${esc(t.quem)} · era para ${fdata(t.quando)}</p></div><span class="pill warn">Atrasada</span></div>`),
       ...(S.t.apts.filter(a=>a.status!=='aprovado').length?[`<div class="row" style="grid-template-columns:1fr auto"><div><h4>${S.t.apts.filter(a=>a.status!=='aprovado').length} apontamento(s) sem aprovação</h4><p>Campo</p></div><span class="pill warn">Pendente</span></div>`]:[])].join('')||'<div class="sub">Nada crítico.</div>'}</div></div></div>`}
  if(tab==='look'){
    const sems=[-2,-1,0,1,2,3,4,5].map(k=>addDias(seg,7*k));
    b=`<div class="sub" style="margin-top:8px">Atividade só fica <b>Pronta</b> sem restrição aberta no item. Não cumprida exige a causa.</div>`+sems.map(s=>{const L=T.atvs.filter(a=>a.semana===s);return `<div class="panel-t" style="margin-top:14px">Semana de ${fdata(s)}${s===seg?' · atual':''}</div>${L.length?L.map(a=>`<div class="row" style="grid-template-columns:1fr auto auto"><div><h4>${esc(a.desc)}</h4><p class="mono">${a.item}${a.causa?' · '+esc(a.causa):''}</p></div>${atvPill(a)}<div>${a.status==='planejada'?`<button class="btn sm ok" data-act="atv-ok" data-id="${a.id}" ${bloqItem(a.item).length||!can('lean')?'disabled title="Há restrição aberta ou sem permissão"':''}>Cumprida</button> <button class="btn sm no" data-act="atv-no" data-id="${a.id}" ${can('lean')?'':'disabled'}>Não cumprida</button>`:''}</div></div>`).join(''):'<div class="sub">—</div>'}`}).join('')}
  if(tab==='restr'){
    const L=[...auto,...ab,...T.rsts.filter(r=>r.status!=='aberta')];
    b=`<div class="tw">${L.length?`<table class="tbl"><thead><tr><th>Restrição</th><th>Dono</th><th>Prazo</th><th class="r">R$ em jogo</th><th>Situação</th><th></th></tr></thead><tbody>${L.map(r=>`<tr><td><b>${esc(r.desc)}</b><div class="mut" style="font-size:11.5px">${esc(r.tipo)}${r.item?' · '+r.item:''}${r.proximo?' · próximo passo: '+esc(r.proximo):''}${r.replan?' · replanejada '+r.replan+'x':''}</div></td><td>${esc(r.dono)}</td><td>${fdata(r.prazo)}</td><td class="r">${brl(r.valor)}</td><td>${r.auto?'<span class="pill info">Automática</span>':r.status==='resolvida'?'<span class="pill ok">Resolvida</span>':escalada(r)?'<span class="pill bad">Escalada</span>':r.prazo&&r.prazo<hojeISO()?'<span class="pill warn">Vencida</span>':'<span class="pill mute">Aberta</span>'}</td>
      <td class="r">${r.status==='aberta'&&!r.auto?`<button class="btn sm ok" data-act="rst-ok" data-id="${r.id}" ${can('lean')?'':'disabled'}>Resolver</button> <button class="btn sm" data-act="rst-rep" data-id="${r.id}" ${can('lean')?'':'disabled'}>Replanejar</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="sub" style="padding:18px">Nenhuma restrição.</div>'}</div><div class="sub" style="margin-top:8px">Limite de 8 abertas por pessoa. Sem atualização por 3 dias úteis a restrição é escalada. Restrição automática nasce de pacote com “fechar até” vencido e sem pedido.</div>`}
  if(tab==='ppc'){
    const par=pareto(),mx=Math.max(1,...par.map(x=>x[1])),espera=ab.reduce((s,r)=>s+(+r.valor||0),0);
    b=`<div class="kpi4"><div><div class="k-l">PPC acumulado</div><div class="v">${pp.length?Math.round(pp.reduce((s,w)=>s+w.c,0)/pp.reduce((s,w)=>s+w.c+w.n,0)*100)+'%':'—'}</div></div><div><div class="k-l">Semanas medidas</div><div class="v">${pp.length}</div></div><div><div class="k-l">Custo da espera (R$ em jogo)</div><div class="v">${brl(espera,true)}</div></div><div><div class="k-l">Metas</div><div class="v" style="font-size:14px">verde ≥ 80% · amarelo ≥ 60%</div></div></div>
    <div class="cols" style="margin-top:14px"><div class="card"><div class="in"><div class="panel-t">PPC por semana</div>${pp.length?pp.map(w=>`<div class="row" style="grid-template-columns:1fr auto"><div><h4>Semana de ${fdata(w.semana)}</h4><p>${w.c} cumpridas de ${w.c+w.n}</p></div>${ppcPill(w.ppc)}</div>`).join(''):'<div class="sub">Marque atividades como cumprida/não cumprida.</div>'}</div></div>
    <div class="card"><div class="in"><div class="panel-t">Pareto das causas</div>${par.length?par.map(([c,n])=>`<div class="row" style="grid-template-columns:1fr 80px"><div><h4>${esc(c)}</h4><div class="bar-fecha bad"><i style="width:${n/mx*100}%"></i></div></div><b>${n}</b></div>`).join(''):'<div class="sub">Sem não cumpridas.</div>'}</div></div></div>`}
  if(tab==='tar'){
    const cols=[['afazer','A fazer'],['fazendo','Fazendo'],['feito','Feito']];
    b=`<div class="cols" style="grid-template-columns:repeat(3,1fr);margin-top:12px">${cols.map(([k,l])=>`<div class="card"><div class="in"><div class="panel-t">${l} · ${T.tars.filter(t=>t.status===k).length}</div>${T.tars.filter(t=>t.status===k).map(t=>`<div class="alert" style="grid-template-columns:1fr;margin-top:8px"><div><b>${esc(t.oque)}</b><p>${esc(t.quem)} · até ${fdata(t.quando)}${t.item?' · '+t.item:''}</p><p class="mut">${esc([t.porque&&'Por quê: '+t.porque,t.onde&&'Onde: '+t.onde,t.como&&'Como: '+t.como,t.quanto&&'Quanto: '+t.quanto].filter(Boolean).join(' · '))}</p>${k!=='feito'?`<button class="btn sm" data-act="tar-mv" data-id="${t.id}" ${can('lean')?'':'disabled'}>${k==='afazer'?'Iniciar':'Concluir'}</button>`:''}</div></div>`).join('')}</div></div>`).join('')}</div>`}
  const nb={restr:ab.length+auto.length,tar:T.tars.filter(t=>t.status!=='feito').length};
  return `<div class="head"><div><h1>Lean e planejamento</h1><p class="lead">Pauta de segunda, lookahead de 6 semanas, restrições com dono e prazo, PPC e tarefas. Cada reunião vira lista de ações, não ata.</p></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="nova-atv" ${can('lean')?'':'disabled'}>Nova atividade</button><button class="btn" data-act="nova-rst" ${can('lean')?'':'disabled'}>Nova restrição</button><button class="btn dark" data-act="nova-tar" ${can('lean')?'':'disabled'}>Nova tarefa</button></div></div>
   <div class="toolbar">${tabs('lean',[['pauta','Pauta de segunda'],['look','Lookahead'],['restr','Restrições',nb.restr],['ppc','PPC'],['tar','Tarefas',nb.tar]],tab)}</div>${b}`}
function atvPill(a){if(a.status==='cumprida')return '<span class="pill ok">Cumprida</span>';if(a.status==='nao_cumprida')return '<span class="pill bad">Não cumprida</span>';
  return bloqItem(a.item).length?'<span class="pill bad">Com restrição</span>':'<span class="pill ok">Pronta</span>'}
function modalAtv(){const seg=segunda(hojeISO());
  modal(`<h3>Nova atividade no lookahead</h3><label>Item</label><select id="v-item">${itemOptions()}</select><label>O que será feito</label><input id="v-desc"><label>Semana</label><select id="v-sem">${[-2,-1,0,1,2,3,4,5].map(k=>{const s=addDias(seg,7*k);return `<option value="${s}" ${k===0?'selected':''}>${fdata(s)}</option>`}).join('')}</select>
   <div class="acts"><button class="btn" data-act="fechar">Cancelar</button><button class="btn dark" data-act="atv-salvar">Salvar</button></div>`)}
function doAtv(){const d=$('#v-desc').value.trim();if(!d)return toast('Descreva a atividade');const a={id:'atv'+Date.now(),item:$('#v-item').value,desc:d,semana:$('#v-sem').value,status:'planejada',quem:user()};S.t.atvs.push(a);log('atividade',a.item,'lookahead','',d);save();closeModal();S.tab.lean='look';render()}
function atvOk(id){const a=S.t.atvs.find(x=>x.id===id);if(bloqItem(a.item).length)return toast('Há restrição aberta neste item');a.status='cumprida';log('atividade',a.item,'status','planejada','cumprida');save();render()}
function atvNo(id){modal(`<h3>Atividade não cumprida</h3><label>Causa</label><select id="v-causa">${CAUSAS.map(c=>`<option>${c}</option>`).join('')}</select><div class="acts"><button class="btn" data-act="fechar">Cancelar</button><button class="btn dark" data-act="atv-no-ok" data-id="${id}">Registrar</button></div>`)}
function atvNoOk(id){const a=S.t.atvs.find(x=>x.id===id);a.status='nao_cumprida';a.causa=$('#v-causa').value;log('atividade',a.item,'status','planejada','não cumprida: '+a.causa);save();closeModal();render()}
function modalRst(){modal(`<h3>Nova restrição</h3><div class="g2"><div><label>Tipo</label><select id="r-tipo">${TIPOS_R.map(t=>`<option>${t}</option>`).join('')}</select></div><div><label>Item (opcional)</label><select id="r-item"><option value="">—</option>${itemOptions()}</select></div></div>
   <label>O que impede</label><input id="r-desc"><div class="g2"><div><label>Dono</label><input id="r-dono" value="${esc(user())}"></div><div><label>Prazo</label><input id="r-prazo" type="date" value="${addDias(hojeISO(),3)}"></div></div><div class="g2"><div><label>Próximo passo</label><input id="r-prox"></div><div><label>R$ em jogo</label><input id="r-val" type="number" min="0" step="any"></div></div>
   <div class="acts"><button class="btn" data-act="fechar">Cancelar</button><button class="btn dark" data-act="rst-salvar">Registrar</button></div>`)}
function doRst(){const d=$('#r-desc').value.trim(),dono=$('#r-dono').value.trim();if(!d||!dono)return toast('Descreva e informe o dono');if(donoAb(dono)>=8)return toast(dono+' já tem 8 restrições abertas: resolva antes de abrir outra');
  const r={id:'rst'+Date.now(),num:nextNum('rst'),tipo:$('#r-tipo').value,item:$('#r-item').value,desc:d,dono,prazo:$('#r-prazo').value,proximo:$('#r-prox').value,valor:+$('#r-val').value||0,status:'aberta',criada:hojeISO(),atualizada:hojeISO(),replan:0,quem:user()};
  S.t.rsts.unshift(r);log('restricao',r.num,'aberta','',d);save();closeModal();S.tab.lean='restr';render()}
function rstOk(id){const r=S.t.rsts.find(x=>x.id===id);r.status='resolvida';r.resolvida=hojeISO();log('restricao',r.num,'status','aberta','resolvida');save();render()}
function rstRep(id){const r=S.t.rsts.find(x=>x.id===id);ask('Replanejar restrição','Novo prazo (AAAA-MM-DD)',addDias(hojeISO(),3),p=>rstRepFim(r,p))}
function rstRepFim(r,p){r.prazo=p;r.replan=(r.replan||0)+1;r.atualizada=hojeISO();log('restricao',r.num,'prazo','',p);save();render()}
function modalTar(){modal(`<h3>Nova tarefa</h3><label>O quê</label><input id="t-oque"><div class="g2"><div><label>Quem</label><input id="t-quem" value="${esc(user())}"></div><div><label>Quando</label><input id="t-quando" type="date" value="${addDias(hojeISO(),3)}"></div></div>
   <label>Por quê</label><input id="t-por"><div class="g3"><div><label>Onde</label><input id="t-onde"></div><div><label>Como</label><input id="t-como"></div><div><label>Quanto</label><input id="t-quanto"></div></div><label>Item (opcional)</label><select id="t-item"><option value="">—</option>${itemOptions()}</select>
   <div class="acts"><button class="btn" data-act="fechar">Cancelar</button><button class="btn dark" data-act="tar-salvar">Criar</button></div>`)}
function doTar(){const o=$('#t-oque').value.trim();if(!o)return toast('Diga o que fazer');const t={id:'tar'+Date.now(),num:nextNum('tar'),oque:o,quem:$('#t-quem').value,quando:$('#t-quando').value,porque:$('#t-por').value,onde:$('#t-onde').value,como:$('#t-como').value,quanto:$('#t-quanto').value,item:$('#t-item').value,status:'afazer',quem0:user()};
  S.t.tars.unshift(t);log('tarefa',t.num,'criada','',o);save();closeModal();S.tab.lean='tar';render()}
function tarMv(id){const t=S.t.tars.find(x=>x.id===id);const n=t.status==='afazer'?'fazendo':'feito';log('tarefa',t.num,'status',t.status,n);t.status=n;save();render()}
/* ============ FATURAMENTO, RECEBIMENTO, DRE E CAIXA (Fase 9) ============ */
const mesDe=s=>String(s||'').slice(0,7);
const addMes=(m,n)=>{const [y,x]=m.split('-').map(Number);const d=new Date(y,x-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const fmes=m=>{const [y,x]=m.split('-');return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+x-1]+'/'+y.slice(2)};
const puItem=i=>i.qtd?i.preco_venda_total/i.qtd:0;
const medValor=m=>m.qtd*puItem(S.byCod[m.item]||{qtd:0,preco_venda_total:0});
const medsLivres=()=>S.t.meds.filter(m=>m.status==='atestada'&&!m.bc);
const bcBruto=b=>r2(b.medIds.reduce((s,id)=>{const m=S.t.meds.find(x=>x.id===id);return s+(m?medValor(m):0)},0));
const bcTotal=b=>r2(bcBruto(b)*(1+(b.reajuste||0)/100));
const bcAprov=b=>b.valorAprovado!=null?b.valorAprovado:bcTotal(b);
const bcGlosa=b=>b.valorAprovado!=null?r2(Math.max(0,bcTotal(b)-b.valorAprovado)):0;
const fatLiq=f=>r2(f.valor*(1-(f.ret||0)/100));
const fatRec=f=>r2(S.t.recs.filter(r=>r.fat===f.id).reduce((s,r)=>s+r.valor,0));
const fatSaldo=f=>r2(Math.max(0,fatLiq(f)-fatRec(f)));
const BC_ST={rascunho:['mute','Rascunho'],enviado:['info','Enviado ao cliente'],aprovado:['warn','Aprovado, a faturar'],faturado:['ok','Faturado']};
function realPorConta(){const real={};S.t.notas.forEach(n=>{if(n.status==='lancada')return;n.rateio.forEach(l=>{const c=l.conta||contaPadrao(l.nat,S.byCod[l.item]?.pacote);real[c]=(real[c]||0)+ +l.valor})});return real}
function dre(){
  const trib=S.D.obra.tributos_nota,bcs=S.t.bcs.filter(b=>b.status==='aprovado'||b.status==='faturado');
  const bruto=bcs.reduce((s,b)=>s+bcBruto(b),0),reaj=bcs.reduce((s,b)=>s+r2(bcBruto(b)*(b.reajuste||0)/100),0),glosa=bcs.reduce((s,b)=>s+bcGlosa(b),0);
  const aprov=bcs.reduce((s,b)=>s+bcAprov(b),0),ded=r2(aprov*trib),liq=r2(aprov-ded);
  const real=realPorConta(),custoPorConta=Object.entries(real).sort(([a],[b])=>cmpCod(a,b));const custo=custoPorConta.reduce((s,[,v])=>s+v,0);
  return {bruto,reaj,glosa,aprov,ded,liq,custoPorConta,custo,resultado:r2(liq-custo),margem:liq>0?(liq-custo)/liq:null}}
function proxMeses(n0,n1){const m0=mesDe(hojeISO());return Array.from({length:n1-n0+1},(_,k)=>addMes(m0,n0+k))}
function caixa(){
  const meses=proxMeses(-2,6),L={};meses.forEach(m=>L[m]={entP:0,entR:0,saiP:0,saiR:0,man:0});
  const put=(m,k,v)=>{if(L[m])L[m][k]+=v};
  S.t.fats.forEach(f=>{put(mesDe(f.venc),'entP',fatSaldo(f))});
  S.t.recs.forEach(r=>put(mesDe(r.data),'entR',r.valor));
  S.t.titulos.filter(t=>!t.cancelado).forEach(t=>{const i=tituloInfo(t);put(mesDe(t.venc),'saiP',i.saldo)});
  S.t.notas.filter(n=>n.status==='paga').forEach(n=>put(mesDe(n.pago),'saiR',n.valor));
  S.t.lans.forEach(l=>put(mesDe(l.data),'man',l.valor));
  let acc=0,minAcc=0;
  const rows=meses.map(m=>{const x=L[m],liq=x.entR+x.entP-x.saiR-x.saiP+x.man;acc+=liq;minAcc=Math.min(minAcc,acc);return {m,...x,liq,acc}});
  return {rows,minAcc}}
function svgCaixa(rows){
  const W=640,H=180,P=24,mx=Math.max(1,...rows.map(r=>Math.max(r.entR+r.entP,r.saiR+r.saiP))),bw=(W-2*P)/rows.length;
  const y=v=>H-P-(v/mx)*(H-2*P);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto" role="img" aria-label="Entradas e saídas por mês">${rows.map((r,k)=>{const x=P+k*bw,e=r.entR+r.entP,s=r.saiR+r.saiP;
   return `<rect x="${x+bw*.12}" y="${y(e)}" width="${bw*.34}" height="${H-P-y(e)}" fill="var(--ok)" rx="2"/><rect x="${x+bw*.52}" y="${y(s)}" width="${bw*.34}" height="${H-P-y(s)}" fill="var(--bad)" rx="2"/><text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${fmes(r.m)}</text>`}).join('')}</svg>
   <div class="legend"><span><i style="background:var(--ok)"></i>Entradas (previstas + realizadas)</span><span><i style="background:var(--bad)"></i>Saídas (previstas + realizadas)</span></div>`}
function viewFat(X){
  const tab=S.tab.fat||'bc',T=S.t,livres=medsLivres(),vl=livres.reduce((s,m)=>s+medValor(m),0);

const FISCAL={provedor:null};   // provedor externo (ex.: Focus NFe) ainda não contratado: nada é chamado sem credencial
const SANKHYA={url:'',appkey:'',token:''};   // API oficial; credenciais só do administrador do Sankhya (docs/INTEGRACOES.md)
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function xmlTxt(doc,tag){const e=doc.getElementsByTagName(tag)[0];return e?e.textContent.trim():''}
function parseNFe(txt){
  const doc=new DOMParser().parseFromString(txt,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('XML inválido');
  const inf=doc.getElementsByTagName('infNFe')[0];if(!inf)throw new Error('Não é uma NF-e (sem infNFe)');
  const chave=(inf.getAttribute('Id')||'').replace(/\D/g,'');
  const emit=doc.getElementsByTagName('emit')[0],ide=doc.getElementsByTagName('ide')[0];
  const g=(p,t)=>{const e=p&&p.getElementsByTagName(t)[0];return e?e.textContent.trim():''};
  const dh=g(ide,'dhEmi')||g(ide,'dEmi');
  const itens=[...doc.getElementsByTagName('det')].map(d=>({desc:g(d,'xProd'),qtd:+g(d,'qCom')||0,valor:+g(d,'vProd')||0}));
  const v=+xmlTxt(doc,'vNF')||0;
  return {chave,num:g(ide,'nNF'),serie:g(ide,'serie'),emissao:dh.slice(0,10),emitente:g(emit,'xNome'),cnpj:g(emit,'CNPJ')||g(emit,'CPF'),valor:r2(v),itens,
    inss:r2(+xmlTxt(doc,'vRetPrev')||0),iss:r2(+xmlTxt(doc,'vISSRet')||+xmlTxt(doc,'vISS')||0)}}
function sugereOC(x){
  const ocs=S.t.ocs.filter(o=>['aprovada','recebida_parcial','recebida'].includes(o.status)&&norm(o.forn)&&(norm(x.emitente).includes(norm(o.forn))||norm(o.forn).includes(norm(x.emitente))));
  const bons=ocs.filter(o=>Math.abs(o.valor-x.valor)/Math.max(o.valor,1)<=S.t.par.tol);return bons.length===1?bons[0]:null}
function importaXmls(textos){
  const res={ok:[],dup:[],erro:[]};
  textos.forEach(([nome,t])=>{try{const x=parseNFe(t);
    if(x.chave&&S.t.notas.some(n=>n.chave===x.chave)){res.dup.push(nome+' (chave já lançada)');return}
    if(!(x.valor>0)){res.erro.push(nome+': sem valor');return}
    const o=sugereOC(x);
    const n={id:'n'+Date.now()+Math.random().toString(36).slice(2,5),num:nextNum('nf'),emitente:x.emitente,cnpj:x.cnpj,chave:x.chave||x.num,nfNum:x.num,valor:x.valor,emissao:x.emissao||hojeISO(),oc:o?o.id:'',ocNum:o?o.num:'',rateio:[],status:'lancada',origemXml:true,itensXml:x.itens,retInss:x.inss,retIss:x.iss,justSemOC:o?'':'Importada de XML sem pedido correspondente'};
    S.t.notas.unshift(n);log('nota_fiscal',n.num,'importada_xml','',x.emitente+' · '+brl(x.valor)+(o?' · sugerida '+o.num:''));res.ok.push(n.num+' '+x.emitente+' '+brl(x.valor)+(o?' → '+o.num:' (sem pedido)'))}
   catch(e){res.erro.push(nome+': '+e.message)}});
  save();return res}

async function linhasDaPlanilha(file){

function calculaDiff(L){
  const dif=[],info={novos:[],semQtd:[]},seen=new Set();

    if(r.qtd!=null&&i.qtd!=null&&Math.abs(r.qtd-i.qtd)>1e-6)info.semQtd.push(`${r.codigo}: planilha ${num(r.qtd)} × orçamento ${num(i.qtd)}`);
    const m=r.meta!=null?r2(r.meta):null,t=r.teto!=null?r2(r.teto):null,mudou=[];
    if(m!=null&&(i.meta_base==null||Math.abs(m-i.meta_base)>0.005))mudou.push(['Meta',i.meta_base,m]);
    if(t!=null&&(i.teto_total==null||Math.abs(t-i.teto_total)>0.005))mudou.push(['Teto',i.teto_total,t]);
    if(r.status&&r.status!==i.status_cotacao)mudou.push(['Status',i.status_cotacao,r.status]);
    if(mudou.length)dif.push({codigo:r.codigo,mudou,novo:{meta_total:m??i.meta_base,teto_total:t??i.teto_total,status_cotacao:r.status||i.status_cotacao,qtd:i.qtd}})});
  const pacs=[];L.pacotes.forEach(r=>{const p=S.D.pacotes.find(x=>x.codigo===r.codigo);if(!p)return;

  const semMov=S.D.items.filter(i=>!seen.has(i.codigo)).length;
  return {dif,pacs,info,semMov,dMeta:r2(dif.reduce((s,d)=>s+(d.novo.meta_total||0)-(S.byCod[d.codigo].meta_base||0),0))}}

  const impDeb=r2(fat*trib);

/* ---------- Importar lançamentos do financeiro (CSV) ---------- */
/* Colunas: tipo;numero;fornecedor;descricao;vencimento;valor;pago_em;fat_direto  (tipo: gasto | custo_fixo | provisao). Datas dd/mm/aaaa ou aaaa-mm-dd; valores 1.234,56. */
const numBR=s=>{s=String(s||'').trim().replace(/[R$\s]/g,'');if(!s)return 0;return s.includes(',')?+s.replace(/\./g,'').replace(',','.'):+s};
const dataImp=s=>{s=String(s||'').trim();const m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?`${m[3]}-${m[2]}-${m[1]}`:/^\d{4}-\d{2}-\d{2}$/.test(s)?s:''};
function lfxParse(txt){const out=[],erros=[];String(txt||'').replace(/^﻿/,'').split(/\r?\n/).forEach((ln,i)=>{if(!ln.trim())return;const c=ln.split(';').map(x=>x.trim());
  if(i===0&&/^tipo$/i.test(c[0]))return;const tp=(c[0]||'').toLowerCase();
  if(!['gasto','custo_fixo','provisao'].includes(tp))return erros.push(`Linha ${i+1}: tipo "${c[0]}" inválido (use gasto, custo_fixo ou provisao)`);
  const v=numBR(c[5]),venc=dataImp(c[4]);if(!(v>0))return erros.push(`Linha ${i+1}: valor inválido`);if(!venc)return erros.push(`Linha ${i+1}: vencimento inválido`);
  out.push({tipo:tp,numero:c[1]||'',forn:c[2]||'',desc:c[3]||'',venc,valor:r2(v),pago:dataImp(c[6])||'',fatDireto:/^(1|s|sim|x)$/i.test(c[7]||'')})});return {out,erros}}
const lfxChave=l=>[l.tipo,l.numero,l.forn.toLowerCase(),l.venc,l.valor].join('|');
function lfxImportar(){const r=lfxParse($('#lf-csv').value),ja=new Set(S.t.lfxs.map(lfxChave));
  if(!r.out.length&&r.erros.length)return toast(r.erros[0]);
  const novos=r.out.filter(l=>!ja.has(lfxChave(l)));const lote='L'+Date.now();
  novos.forEach(l=>S.t.lfxs.push({id:'lfx'+Date.now()+Math.random().toString(36).slice(2,6),origem:'Sankhya',lote,...l}));
  log('lancamentos_importados',lote,'importar','',novos.length+' novos, '+(r.out.length-novos.length)+' repetidos ignorados'+(r.erros.length?', '+r.erros.length+' linhas com erro':''));
  save();toast(novos.length+' lançamentos importados, '+(r.out.length-novos.length)+' repetidos ignorados'+(r.erros.length?', '+r.erros.length+' com erro':''));S.lfxErros=r.erros;render()}
function lfxDesfazer(){const ult=S.t.lfxs[S.t.lfxs.length-1];if(!ult)return toast('Nada para desfazer');const n=S.t.lfxs.filter(l=>l.lote===ult.lote).length;
  S.t.lfxs=S.t.lfxs.filter(l=>l.lote!==ult.lote);log('lancamentos_importados',ult.lote,'desfazer','',n+' removidos');save();toast(n+' lançamentos do último lote removidos');render()}
ACOES['lf-imp']=()=>{if(!can('lan'))return toast('Só Financeiro importa lançamentos');lfxImportar()};ACOES['lf-undo']=()=>{if(!can('lan'))return toast('Só Financeiro desfaz importação');lfxDesfazer()};
function impView(){const L=S.t.lfxs;
  return `<div class="sub">Traga para cá o histórico financeiro que hoje só existe no Sankhya. Colunas separadas por ponto e vírgula: <span class="mono">tipo;numero;fornecedor;descricao;vencimento;valor;pago_em;fat_direto</span>. Tipo: <b>gasto</b>, <b>custo_fixo</b> ou <b>provisao</b>. Deixe <span class="mono">pago_em</span> vazio para títulos em aberto. Linhas repetidas (mesmo tipo, número, fornecedor, vencimento e valor) são ignoradas.</div>
  <textarea id="lf-csv" rows="6" placeholder="gasto;123;Fornecedor X;Cimento;25/11/2026;2.011,26;;&#10;provisao;;Folha;Provisão de mão de obra;30/11/2026;126.731,81;;"></textarea>
  <div style="margin-top:8px;display:flex;gap:8px"><button class="btn dark" data-act="lf-imp" ${can('lan')?'':'disabled title="Só Financeiro"'}>Importar</button><button class="btn" data-act="lf-undo" ${can('lan')&&L.length?'':'disabled'}>Desfazer último lote</button></div>
  ${(S.lfxErros||[]).length?`<div class="err" style="margin-top:8px">${S.lfxErros.slice(0,5).map(esc).join('<br>')}</div>`:''}
  ${L.length?`<div class="tw"><table class="tbl"><thead><tr><th>Tipo</th><th>Nº</th><th>Fornecedor</th><th>Vencimento</th><th class="r">Valor</th><th>Situação</th></tr></thead><tbody>${L.slice(-30).map(l=>`<tr><td>${l.tipo}${l.fatDireto?' · fat. direto':''}</td><td class="mono">${esc(l.numero)}</td><td>${esc(l.forn)}</td><td>${fdata(l.venc)}</td><td class="r">${brl(l.valor)}</td><td>${l.tipo==='gasto'?(l.pago?'pago '+fdata(l.pago):l.venc<hojeISO()?'<span class="neg">atrasado</span>':'a pagar'):'—'}</td></tr>`).join('')}</tbody></table></div>`:''}`}
/* ============ FINANCEIRO NATIVO (Fase 13): contas, extrato OFX, baixa múltipla, cobrança, remessa CNAB ============ */
const contaSel=()=>S.contaSel&&S.t.bancos.some(b=>b.id===S.contaSel)?S.contaSel:(S.t.bancos[0]||{}).id;
const saldoConta=b=>r2((b.saldoIni||0)+S.t.movs.filter(m=>m.banco===b.id&&!m.dup).reduce((s,m)=>s+m.valor,0));
function ofxParse(txt){const out=[];String(txt||'').replace(/<STMTTRN>([\s\S]*?)(?=<\/STMTTRN>|<STMTTRN>|<\/BANKTRANLIST>|$)/gi,(_,b)=>{
  const g=t=>{const m=b.match(new RegExp('<'+t+'>([^<\\r\\n]*)','i'));return m?m[1].trim():''};
  const d=g('DTPOSTED').slice(0,8),v=numOfx(g('TRNAMT'));if(!/^\d{8}$/.test(d)||!isFinite(v)||v===0)return;
  out.push({data:`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`,valor:r2(v),desc:g('MEMO')||g('NAME'),fitid:g('FITID')})});return out}
const numOfx=s=>{s=String(s).trim();return s.includes(',')&&!s.includes('.')?+s.replace(',','.'):+s};
function ofxImportar(){const id=contaSel();if(!id)return toast('Cadastre uma conta bancária antes (Suprimentos → Cadastros)');
  const L=ofxParse($('#ofx-arq').value);if(!L.length)return toast('Nenhuma transação encontrada no OFX');
  const ja=new Set(S.t.movs.filter(m=>m.banco===id).map(m=>m.fitid).filter(Boolean));let n=0,rep=0;
  L.forEach(t=>{if(t.fitid&&ja.has(t.fitid)){rep++;return}S.t.movs.push({id:'mv'+Date.now()+Math.random().toString(36).slice(2,6),banco:id,data:t.data,valor:t.valor,desc:t.desc,fitid:t.fitid,origem:'OFX'});n++});
  const c=conciliaMovs(id);log('extrato','OFX','importar','',n+' movimentos, '+rep+' repetidos, '+c+' conciliados');save();toast(n+' movimentos importados, '+rep+' repetidos, '+c+' conciliados');render()}
/* concilia saídas com notas pagas de mesmo valor e entradas com recebimentos de mesmo valor */
function conciliaMovs(id){let c=0;S.t.movs.filter(m=>m.banco===id&&!m.conc&&m.origem!=='baixa').forEach(m=>{
  if(m.valor<0){/* extrato confirma uma baixa já feita no sistema, ou uma nota paga sem baixa pela conta */
    const bx=S.t.movs.find(x=>x.banco===id&&x.origem==='baixa'&&!x.conc&&Math.abs(x.valor-m.valor)<.005);
    if(bx){const n=S.t.notas.find(n=>n.id===bx.nota);bx.conc=m.conc=n?n.num:"baixa";m.dup=true;if(n)n.conc=m.data;c++;return}
    const n=S.t.notas.find(n=>n.status==='paga'&&!n.conc&&Math.abs(n.valor+(n.encargos||0)-Math.abs(m.valor))<.005);if(n){n.conc=m.data;m.conc=n.num;c++}}
  else{const r=S.t.recs.find(r=>!r.conc&&Math.abs(r.valor-m.valor)<.005);if(r){r.conc=m.data;m.conc=r.id;c++}}});return c}
function movManual(){const id=contaSel(),v=+$('#mv-v').value,d=$('#mv-d').value||hojeISO(),ds=$('#mv-t').value.trim();if(!id||!v||!ds)return toast('Informe conta, descrição e valor (negativo = saída)');
  S.t.movs.push({id:'mv'+Date.now(),banco:id,data:d,valor:r2(v),desc:ds,origem:'manual'});log('extrato','manual','lançar','',brl(v)+' · '+ds);save();toast('Lançado');render()}
/* baixa múltipla: paga várias notas liberadas de uma vez, com juros, multa e desconto rateados proporcionalmente */
function baixaMultipla(){const ids=[...document.querySelectorAll('.bx:checked')].map(e=>e.value);if(!ids.length)return toast('Marque as notas');const banco=contaSel();if(!banco)return toast('Cadastre uma conta bancária');
  const ju=+$('#bx-j').value||0,mu=+$('#bx-m').value||0,de=+$('#bx-d').value||0,dt=$('#bx-dt').value||hojeISO(),ns=ids.map(i=>S.t.notas.find(n=>n.id===i)).filter(n=>n&&n.status==='liberada');
  if(!ns.length)return toast('Nenhuma nota liberada marcada');const base=ns.reduce((s,n)=>s+n.valor,0),adj=r2(ju+mu-de);let rest=adj;
  ns.forEach((n,k)=>{const q=k===ns.length-1?rest:r2(adj*n.valor/base);rest=r2(rest-q);n.status='paga';n.pago=dt;n.encargos=q;
    S.t.movs.push({id:'mv'+Date.now()+k,banco,data:dt,valor:-r2(n.valor+q),desc:'Pagamento '+n.num+' · '+n.emitente,origem:'baixa',nota:n.id});
    log('nota_fiscal',n.num,'status','liberada','paga (baixa múltipla'+(q?', encargos '+brl(q):'')+')')});
  save();toast(ns.length+' notas pagas · total '+brl(base+adj));render()}
ACOES['ofx-imp']=()=>{if(!can('liberar'))return toast('Só Financeiro');ofxImportar()};
ACOES['mv-novo']=()=>{if(!can('lan'))return toast('Só Financeiro');movManual()};
ACOES['bx-ok']=()=>{if(!can('liberar'))return toast('Só Financeiro');baixaMultipla()};
ACOES['conta-sel']=el=>{S.contaSel=el.dataset.id;render()};
function viewContas(){
  const B=S.t.bancos,id=contaSel(),b=B.find(x=>x.id===id),M=S.t.movs.filter(m=>m.banco===id).sort((x,y)=>y.data.localeCompare(x.data)),lib=S.t.notas.filter(n=>n.status==='liberada');
  if(!B.length)return `<div class="empty">Nenhuma conta bancária cadastrada. Cadastre em Suprimentos → Cadastros → Bancos.</div>`;
  return `<div class="kpi4">${B.map(x=>`<div class="clk" data-act="conta-sel" data-id="${x.id}" style="${x.id===id?'outline:2px solid var(--ink)':''}"><div class="k-l">${esc(x.desc)}</div><div class="v ${saldoConta(x)<0?'neg':''}">${brl(saldoConta(x),true)}</div></div>`).join('')}</div>
  <div class="cols" style="margin-top:14px"><div class="card"><div class="in"><div class="panel-t">Importar extrato OFX</div><div class="sub">Cole o conteúdo do arquivo .ofx do banco. Transações já importadas (mesmo FITID) são ignoradas e o sistema concilia sozinho com notas pagas e recebimentos de mesmo valor.</div>
    <textarea id="ofx-arq" rows="4" placeholder="<STMTTRN>…"></textarea><div style="margin-top:8px"><button class="btn dark" data-act="ofx-imp" ${can('liberar')?'':'disabled title="Só Financeiro"'}>Importar e conciliar</button></div></div></div>
   <div class="card"><div class="in"><div class="panel-t">Lançamento manual na conta</div><div class="g3"><div><label>Data</label><input id="mv-d" type="date" value="${hojeISO()}"></div><div><label>Valor (− saída)</label><input id="mv-v" type="number" step="any"></div><div><label>Descrição</label><input id="mv-t"></div></div><div style="margin-top:8px"><button class="btn" data-act="mv-novo" ${can('lan')?'':'disabled title="Só Financeiro"'}>Lançar</button></div></div></div></div>
  <div class="panel-t" style="margin-top:16px">Baixa múltipla de notas liberadas</div>
  ${lib.length?`<div class="tw"><table class="tbl"><tbody>${lib.map(n=>`<tr><td><input type="checkbox" class="bx" value="${n.id}"></td><td class="mono">${n.num}</td><td>${esc(n.emitente)}</td><td>vence ${fdata(vencNota(n))}</td><td class="r">${brl(n.valor)}</td></tr>`).join('')}</tbody></table></div>
   <div class="g3"><div><label>Juros</label><input id="bx-j" type="number" step="any" value="0"></div><div><label>Multa</label><input id="bx-m" type="number" step="any" value="0"></div><div><label>Desconto</label><input id="bx-d" type="number" step="any" value="0"></div></div><div class="g3"><div><label>Pago em</label><input id="bx-dt" type="date" value="${hojeISO()}"></div></div>
   <div style="margin-top:8px"><button class="btn dark" data-act="bx-ok" ${can('liberar')?'':'disabled title="Só Financeiro"'}>Pagar marcadas</button> <button class="btn" data-act="cnab-gera" ${can('liberar')?'':'disabled'}>Gerar remessa CNAB 240 (genérica)</button></div>
   ${S.cnabOut?`<label>Remessa gerada — layout genérico, <b>validar com o banco antes de enviar</b></label><textarea rows="6" readonly style="font-family:monospace;font-size:11px">${esc(S.cnabOut)}</textarea>`:''}`:'<div class="sub">Nenhuma nota liberada para pagamento.</div>'}
  <div class="panel-t" style="margin-top:16px">Extrato de ${b?esc(b.desc):''}</div>${M.length?`<div class="tw"><table class="tbl"><thead><tr><th>Data</th><th>Descrição</th><th class="r">Valor</th><th>Origem</th><th>Conciliação</th></tr></thead><tbody>${M.slice(0,60).map(m=>`<tr><td>${fdata(m.data)}</td><td>${esc(m.desc)}</td><td class="r ${m.valor<0?'neg':'pos'}">${brl(m.valor)}</td><td>${m.origem}</td><td>${m.conc?'<span class="pill ok">conciliado</span>':'<span class="pill mute">pendente</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="sub">Sem movimentos.</div>'}`}
/* Remessa CNAB 240 genérica (pagamento a fornecedores). Posições seguem o padrão FEBRABAN de forma simplificada: o banco exige homologação do layout. */
function cnabGera(){const b=S.t.bancos.find(x=>x.id===contaSel()),ns=S.t.notas.filter(n=>n.status==='liberada');if(!b||!ns.length)return toast('Sem conta ou notas liberadas');
  const pad=(s,n,c=' ')=>String(s).slice(0,n).padEnd(n,c),num=(v,n)=>String(Math.round(v)).replace(/\D/g,'').padStart(n,'0').slice(-n),dd=hojeISO().split('-').reverse().join('');
  const emp=S.t.par.emp||{};const L=[pad('00000000'+pad(b.banco,3)+'00000'+'         2'+num((emp.cnpj||'').replace(/\D/g,'')||0,14)+pad(emp.razao||"TAF",30)+pad(b.banco,30)+'          1'+dd,240)];
  L.push(pad('0000130000100'+'C2001'+'046'+' 2'+num((emp.cnpj||'').replace(/\D/g,'')||0,14),240));
  ns.forEach((n,k)=>{const f=S.t.forns.find(x=>x.nome===n.emitente)||{};L.push(pad('00000013'+num(k+1,5)+'A000000'+pad(f.banco||'',3,'0')+'00000'+num(0,13)+pad(n.emitente,30)+pad(n.num,20)+dd+'BRL'+num(0,15)+num(n.valor*100,15),240))});
  L.push(pad('00000015         '+num(ns.length+2,6)+num(ns.reduce((s,n)=>s+n.valor*100,0),18),240));L.push(pad('99999999         000001'+num(ns.length+4,6),240));
  S.cnabOut=L.join('\r\n');log('remessa','CNAB240','gerar','',ns.length+' pagamentos');save();render()}
ACOES['cnab-gera']=cnabGera;
/* ---- cobrança ---- */
const msgCobr=f=>`Olá! Identificamos que a nota ${f.num} (${brl(fatSaldo(f))}) venceu em ${fdata(f.venc)} e consta em aberto. Pode nos confirmar a previsão de pagamento? Obrigado.`;
ACOES['cobr-reg']=el=>{if(!can('recFat'))return toast('Sem permissão');const f=S.t.fats.find(x=>x.id===el.dataset.id);S.t.cobrs.push({id:'cb'+Date.now(),fat:f.id,num:f.num,data:hojeISO(),canal:'WhatsApp',quem:user()});log('cobranca',f.num,'enviada','','régua: WhatsApp');save();render()};
function viewCobranca(){const V=S.t.fats.filter(f=>fatSaldo(f)>0&&f.venc<hojeISO()).sort((a,b)=>a.venc.localeCompare(b.venc)),dias=f=>Math.round((new Date(hojeISO())-new Date(f.venc))/864e5);
  const etapa=d=>d>60?['bad','Jurídico']:d>30?['bad','Diretoria']:d>15?['warn','Gerente']:['info','Lembrete'];
  return `<div class="sub">Notas de serviço vencidas e não recebidas. A mensagem abre no WhatsApp para você enviar (o sistema não envia sozinho) e o contato fica registrado.</div>
  ${V.length?`<div class="tw"><table class="tbl"><thead><tr><th>NF</th><th>Vencida há</th><th class="r">Saldo</th><th>Etapa</th><th>Contatos</th><th></th></tr></thead><tbody>${V.map(f=>{const d=dias(f),e=etapa(d),n=S.t.cobrs.filter(c=>c.fat===f.id).length;return `<tr><td class="mono">${f.num}</td><td>${d} dias</td><td class="r">${brl(fatSaldo(f))}</td><td><span class="pill ${e[0]}">${e[1]}</span></td><td>${n}</td><td class="r"><a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msgCobr(f))}">Abrir mensagem</a> <button class="btn sm" data-act="cobr-reg" data-id="${f.id}" ${can('recFat')?'':'disabled'}>Registrar contato</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma nota vencida a receber.</div>'}`}
/* ============ inicialização ============ */
(async()=>{
  $('#today').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  $('#role').innerHTML=Object.entries(ROLES).filter(([k])=>!['admin','pendente'].includes(k)).map(([k,v])=>`<option value="${k}">${v.n} · ${v.u}</option>`).join('');
  if(MODO_SB){try{await sbBoot()}catch(e){telaAviso('Erro de conexão',esc(e.message||e))}return}
  await abreDemo(OBRAS_PADRAO.some(o=>o[0]===obraGuardada())?obraGuardada():'342');
})();
</script>
